  async insert(t,o){if(!o.id)o.id=uid();const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${t}`,{method:'POST',headers:{'apikey':CONFIG.SUPABASE_ANON_KEY,'Authorization':`Bearer ${CONFIG.SUPABASE_ANON_KEY}`,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(o)});return r.json()},

// === MIGRATIE: adres + postcode toevoegen aan bestaande klanten (behoudt ingevoerde data) ===
function migrateKlanten(){
  const adressen={
    'Loonbedrijf Van Dijk':['Havenweg 12','1043 AB','Amsterdam'],
    'Melkveebedrijf De Vries':['Zuiderdijk 84','1509 GH','Zaandam'],
    'Gemeente Waadhoeke':['Harlingerstraatweg 113','8801 PX','Franeker'],
    'Gemeente Waadfaeke':['Harlingerstraatweg 113','8801 PX','Franeker'],
    'Aannemersbedrijf Postma':['Friesestraat 47','8911 BZ','Leeuwarden'],
    'Akkerbouw Havinga':['Oude Nijeveenseweg 8','8441 PL','Heerenveen'],
    'Zuivelboerderij Nicolai':['Hemdijk 25','8601 XX','Sneek']
  };
  DB.list('klanten').forEach(k=>{
    const fix=adressen[k.naam];let nieuw=false;
    if(fix){if(!k.adres){k.adres=fix[0];nieuw=true}if(!k.postcode){k.postcode=fix[1];nieuw=true}if(!k.plaats){k.plaats=fix[2];nieuw=true}}
    if(k.naam==='Gemeente Waadfaeke'){k.naam='Gemeente Waadhoeke';nieuw=true}
    if(nieuw)DB.update('klanten',k.id,{...k});
  });
}

// === MIGRATIE: oude voorbeelddata naar recente datums schuiven ===
// Alleen wanneer ALLE dagstaten ouder zijn dan 60 dagen (dus ongebruikte seed-data),
// zodat echte invoer van de gebruiker nooit wordt aangeraakt.
function migrateDagstaten(){
  if(localStorage.getItem('uren_dates_shifted'))return;
  const rows=DB.list('dagstaten');if(!rows.length){localStorage.setItem('uren_dates_shifted','1');return}
  const vandaag=new Date();vandaag.setHours(0,0,0,0);
  const nieuwste=rows.map(r=>r.datum).sort().pop();
  const dagen=(vandaag-new Date(nieuwste+'T00:00:00'))/86400000;
  if(dagen<=60){localStorage.setItem('uren_dates_shifted','1');return}
  const verschuif=Math.floor(dagen)-1;
  rows.forEach(r=>{const d=new Date(r.datum+'T00:00:00');d.setDate(d.getDate()+verschuif);DB.update('dagstaten',r.id,{...r,datum:iso(d)})});
  localStorage.setItem('uren_dates_shifted','1');
}

// === MIGRATIE: facturatiestatus toevoegen aan bestaande klusregels ===
function migrateFacturatie(){
  DB.list('dagstaten').forEach(d=>{
    let gewijzigd=false;
    const klussen=(d.klussen||[]).map(k=>{
      if(typeof k.gefactureerd!=='boolean'||typeof k.wegenMonsteren!=='boolean'){
        gewijzigd=true;
        return {...k,gefactureerd:typeof k.gefactureerd==='boolean'?k.gefactureerd:false,factuurdatum:k.factuurdatum||'',wegenMonsteren:typeof k.wegenMonsteren==='boolean'?k.wegenMonsteren:false};
      }
      return k;
    });
    if(gewijzigd)DB.update('dagstaten',d.id,{...d,klussen});
  });
}

// === MIGRATIE: records zonder id herstellen ===
// Rijen die zijn toegevoegd voordat insert automatisch een id toekende.
function migrateIds(){
  ['werknemers','klanten','diensten','dagstaten'].forEach(tabel=>{
    const rows=DB.list(tabel);
    let gewijzigd=false;
    const nieuw=rows.map(r=>{
      if(r.id)return r;
      gewijzigd=true;return {...r,id:uid()};
    });
    if(gewijzigd){
      localStorage.setItem('uren_'+tabel,JSON.stringify(nieuw));
    }
  });
}

// === TOAST ===
function toast(msg,type='info'){
  const t=document.createElement('div');
  t.className=`toast-enter px-5 py-3 rounded-xl shadow-lg text-sm font-medium pointer-events-auto ${type==='success'?'bg-emerald-600 text-white':type==='error'?'bg-red-600 text-white':'bg-gray-800 text-white'}`;
  t.textContent=msg;
  $('toast').appendChild(t);
  setTimeout(()=>{t.classList.replace('toast-enter','toast-out');setTimeout(()=>t.remove(),300)},3000);
}

// === DARK MODE ===
function initDarkMode(){
  const dark=localStorage.getItem('uren_dark')==='1';
  if(dark)document.documentElement.classList.add('dark');
  $('darkToggle').textContent=dark?'☀️':'🌙';
  $('darkToggle').onclick=()=>{
    const isDark=document.documentElement.classList.toggle('dark');
    localStorage.setItem('uren_dark',isDark?'1':'0');
    $('darkToggle').textContent=isDark?'☀️':'🌙';
    renderCurrentView();
  };
}

      <div id="calcInfo" class="bg-gray-50 dark:bg-gray-700 rounded-xl p-3 text-sm space-y-1" aria-live="polite">
        <div>Bruto duur: <strong>${fmtNum(bruto)}u</strong></div>
        <div>Netto uren: <strong class="text-emerald-700 dark:text-emerald-400">${fmtNum(netto)}u</strong></div>
        <div>Klussen (uren): <strong>${fmtNum(klusSum)}u</strong>${warn?' <span class="text-amber-600 dark:text-amber-400">⚠ Verschil!</span>':''}</div>
      </div>
    </div>
    <h3 class="font-semibold mb-2">Klussen</h3>
    <div id="klusLijst" class="space-y-3 mb-4"></div>
    <button type="button" id="btnAddKlus" class="w-full py-3 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl text-emerald-700 dark:text-emerald-400 font-medium hover:bg-emerald-50 dark:hover:bg-gray-700 min-h-[48px]">+ Klus toevoegen</button>
    <div class="sticky-bottom mt-4 pt-2">
      <button id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl text-lg shadow-lg min-h-[52px]">Werkdag indienen voor loonadministratie</button>
      ${concept?'<p class="text-center text-xs text-gray-400 mt-2">Concept opgeslagen</p>':''}
    </div>
  </div>`;
  // Event bindings
  const saveConcept=()=>{
    if(!$('inDatum'))return;
    const s={datum:$('inDatum').value,medewerkerId:$('inMedew').value,startTime:$('inStart').value,endTime:$('inEind').value,pauzeMin:+$('inPauze').value,klussen:getKlussen()};
    localStorage.setItem('uren_concept',JSON.stringify(s));
  };
  const calcAndRender=()=>{
    if(!$('inDatum'))return;
    const bruto=calcBruto($('inStart').value,$('inEind').value);
    const netto=Math.max(0,bruto-+$('inPauze').value/60);
    const ks=getKlussen();
    const ksUren=ks.reduce((s,k)=>s+(k.eenheid==='uur'?k.aantal:0),0);
    const warn=ks.length>0&&Math.abs(netto-ksUren)>0.5;
    const info=$('calcInfo');if(info)info.innerHTML=
      `<div>Bruto duur: <strong>${fmtNum(bruto)}u</strong></div>
       <div>Netto uren: <strong class="text-emerald-700 dark:text-emerald-400">${fmtNum(netto)}u</strong></div>
       <div>Klussen (uren): <strong>${fmtNum(ksUren)}u</strong>${warn?' <span class="text-amber-600 dark:text-amber-400">⚠ Verschil!</span>':''}</div>`;
  };
  function getKlussen(){return ds.klussen.map(k=>({...k, wegenMonsteren:($('wm_'+k.id)?$('wm_'+k.id).checked:!!k.wegenMonsteren), klantId:$('klant_'+k.id)?.value||k.klantId, dienstId:($('dienst_'+k.id)?$('dienst_'+k.id).value:'')||k.dienstId||(diensten[0]?diensten[0].id:''), kenteken:$('ket_'+k.id)?.value||k.kenteken, omschrijving:$('oms_'+k.id)?.value||k.omschrijving, aantal:+($('aant_'+k.id)?.value||k.aantal||1), eenheid:$('een_'+k.id)?.value||k.eenheid||'uur'}))}
  function klantZoek(q){
    const all=DB.list('klanten').filter(k=>k.actief!==false);
    const t=(q||'').trim().toLowerCase();
    if(!t)return all;
    return all.filter(k=>[k.naam,k.plaats,k.adres,k.postcode,k.contact].some(v=>(v||'').toLowerCase().includes(t)));
  }
  function klantResultaat(kid){
    const box=$('kres_'+kid);if(!box)return;
    const q=$('kzoek_'+kid)?$('kzoek_'+kid).value:'';
    const list=klantZoek(q);
    box.innerHTML=list.length?list.map(k=>`<button type="button" data-pick="${k.id}" class="w-full text-left px-3 py-2 border-b border-gray-100 dark:border-gray-700 last:border-0 hover:bg-emerald-50 dark:hover:bg-gray-600 min-h-[48px]"><div class="font-medium text-sm text-gray-800 dark:text-gray-100">${esc(k.naam)}</div><div class="text-xs text-gray-500 dark:text-gray-400">📍 ${esc(klantAdres(k)||'Geen adres bekend')}${k.contact?' · '+esc(k.contact):''}</div></button>`).join(''):`<div class="p-3 text-sm text-gray-500">Geen klant gevonden voor &ldquo;${esc(q)}&rdquo;</div>`;
    box.classList.remove('hidden');
  }
  function renderKlussen(){
    const c=$('klusLijst');if(!c)return;
    const ks=getKlussen();
    const selCls='w-full border rounded-lg px-2 py-2 bg-white dark:bg-gray-700 dark:border-gray-600 text-sm min-h-[48px]';
    c.innerHTML=ks.map((k,i)=>{
      const kd=DB.get('klanten',k.klantId);
      return `<div class="klus-card"><div class="flex justify-between items-start mb-2"><span class="text-xs font-semibold text-gray-400">Klus ${i+1}</span><button data-remove-klus="${k.id}" class="text-red-500 hover:text-red-700 text-sm px-2 min-h-[48px]" aria-label="Verwijder klus">✕</button></div>
    <div class="grid grid-cols-2 gap-2">
    <div class="col-span-2 relative"><label for="kzoek_${k.id}" class="text-xs text-gray-500">Klant/Opdrachtgever</label>
      <input id="kzoek_${k.id}" type="text" autocomplete="off" placeholder="Zoek op naam, plaats of adres…" value="${esc(kd?kd.naam:'')}" class="${selCls}" role="combobox" aria-expanded="false" aria-controls="kres_${k.id}">
      <input id="klant_${k.id}" type="hidden" value="${esc(k.klantId||'')}">
      <div id="kres_${k.id}" class="hidden absolute left-0 right-0 mt-1 max-h-60 overflow-auto bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-lg shadow-xl z-20" role="listbox"></div>
      <div id="kadres_${k.id}" class="text-[11px] text-gray-500 dark:text-gray-400 mt-1">${kd?'📍 '+esc(klantAdres(kd)||'Geen adres bekend'):'Nog geen klant gekozen'}</div>
    </div>
    <div><label class="text-xs text-gray-500">Dienst</label><select id="dienst_${k.id}" class="${selCls}">${dOpt}</select></div>
    <div><label class="text-xs text-gray-500">Kenteken/Materieel</label><input id="ket_${k.id}" value="${esc(k.kenteken)}" list="ddKenteken" class="${selCls}"></div>
    <div><label class="text-xs text-gray-500">Aantal</label><input id="aant_${k.id}" type="number" value="${k.aantal||1}" min="0.1" step="0.1" class="${selCls}"></div>
    <div><label class="text-xs text-gray-500">Eenheid</label><select id="een_${k.id}" class="${selCls}"><option value="uur"${k.eenheid==='uur'?' selected':''}>uur</option><option value="m3"${k.eenheid==='m3'?' selected':''}>m³</option><option value="ha"${k.eenheid==='ha'?' selected':''}>ha</option><option value="ritten"${k.eenheid==='ritten'?' selected':''}>ritten</option><option value="km"${k.eenheid==='km'?' selected':''}>km</option><option value="stukken"${k.eenheid==='stukken'?' selected':''}>stuks</option></select></div>
    <div class="col-span-2"><label class="text-xs text-gray-500">Omschrijving</label><textarea id="oms_${k.id}" rows="2" class="${selCls}">${esc(k.omschrijving)}</textarea></div>
    <div class="col-span-2 border-t border-gray-100 dark:border-gray-700 pt-2">
      <label for="wm_${k.id}" class="flex items-center gap-3 min-h-[48px] cursor-pointer select-none">
        <input type="checkbox" id="wm_${k.id}" ${k.wegenMonsteren?'checked':''} class="w-6 h-6 accent-blue-600 shrink-0">
        <span class="text-sm font-medium text-gray-800 dark:text-gray-100">⚖ Wegen monsteren</span>
      </label>
      <p class="text-[11px] text-gray-500 dark:text-gray-400 -mt-1 ml-9">Aanvinken als deze klus gewogen en/of bemonsterd is. Zo zie je later per klus of het gebeurd is.</p>
    </div></div></div>`}).join('');
    ks.forEach(k=>{
      const du=$('dienst_'+k.id);if(du)du.value=k.dienstId;
      const hi=$('klant_'+k.id),zo=$('kzoek_'+k.id),ad=$('kadres_'+k.id),bx=$('kres_'+k.id);
      if(!zo)return;
      const toonAdres=id=>{const kk=DB.get('klanten',id);ad.textContent=kk?'📍 '+(klantAdres(kk)||'Geen adres bekend'):'Nog geen klant gekozen'};
      zo.oninput=()=>{
        const t=zo.value.trim().toLowerCase();
        const exact=DB.list('klanten').find(x=>x.naam.toLowerCase()===t);
        hi.value=exact?exact.id:'';
        toonAdres(hi.value);klantResultaat(k.id);saveConcept();
      };
      zo.onfocus=()=>{zo.select();klantResultaat(k.id)};
      bx.onmousedown=e=>{
        const b=e.target.closest('[data-pick]');if(!b)return;
        e.preventDefault();
        const kk=DB.get('klanten',b.dataset.pick);
        hi.value=b.dataset.pick;zo.value=kk?kk.naam:'';
        toonAdres(b.dataset.pick);bx.classList.add('hidden');saveConcept();
      };
    });
    if(!document.body.dataset.klBuiten){
      document.body.dataset.klBuiten='1';
      document.addEventListener('mousedown',e=>{
        if(e.target.closest('[id^="kres_"]')||e.target.closest('[id^="kzoek_"]'))return;
        document.querySelectorAll('[id^="kres_"]').forEach(b=>b.classList.add('hidden'));
      });
    }
  }
  $('main').oninput=e=>{if(['inDatum','inMedew','inStart','inEind','inPauze'].includes(e.target.id)){saveConcept();calcAndRender()}if(e.target.id.startsWith('klant_')||e.target.id.startsWith('dienst_')||e.target.id.startsWith('ket_')||e.target.id.startsWith('oms_')||e.target.id.startsWith('aant_')||e.target.id.startsWith('een_')){saveConcept();calcAndRender()}};
  $('main').onchange=e=>{saveConcept();calcAndRender()};
  $('main').onclick=e=>{
    if(e.target.dataset.pauze!==undefined){$('inPauze').value=e.target.dataset.pauze;saveConcept();calcAndRender()}
    if(e.target.dataset.removeKlus){ds.klussen=ds.klussen.filter(k=>k.id!==e.target.dataset.removeKlus);saveConcept();renderKlussen();calcAndRender()}
    if(e.target.id==='btnAddKlus'){ds.klussen.push({id:uid(),klantId:'',dienstId:(diensten[0]?diensten[0].id:''),kenteken:'',omschrijving:'',aantal:1,eenheid:'uur',gefactureerd:false,factuurdatum:'',wegenMonsteren:false});saveConcept();renderKlussen()}
    if(e.target.id==='btnSubmit'){
      // Alles uit het formulier lezen: ds is alleen de beginwaarde, niet de invoer.
      const wId=$('inMedew').value,datum=$('inDatum').value,st=$('inStart').value,et=$('inEind').value,pauze=(+$('inPauze').value)||0;
      const w=werknemers.find(x=>x.id===wId);if(!w){toast('Kies een medewerker','error');return}
      if(!datum){toast('Kies een datum','error');return}
      const klussen=getKlussen();
      if(klussen.length===0){toast('Voeg minstens 1 klus toe','error');return}
      if(klussen.some(k=>!k.klantId)){toast('Kies bij elke klus een klant','error');return}
      if(!st||!et||st>=et){toast('Eindtijd moet na starttijd zijn','error');return}
      const bestaat=DB.list('dagstaten').some(d=>d.medewerkerId===wId&&d.datum===datum);
      if(bestaat&&!confirm('Er staat al een dagstaat voor deze medewerker op '+datum+'. Toch nog een indienen?'))return;
      const nettoDag=Math.max(0,calcBruto(st,et)-pauze/60);
      const dag={id:uid(),medewerkerId:wId,medewerkerNaam:w.naam,datum,startTime:st,endTime:et,pauzeMin:pauze,nettoUren:+nettoDag.toFixed(1),status:'in_afwachting',klussen:klussen.map(k=>({...k,gefactureerd:false,factuurdatum:''}))};
      DB.insert('dagstaten',dag);
      localStorage.removeItem('uren_concept');
      toast('Werkdag ingediend! ✅','success');
      renderInvoer();
    }
  };
  // Datalist for kenteken suggestions
  const existing=DB.list('dagstaten').flatMap(d=>d.klussen.filter(k=>k.kenteken).map(k=>k.kenteken));
  const unique=[...new Set(existing)];
  if(unique.length>0)$('main').insertAdjacentHTML('beforeend',`<datalist id="ddKenteken">${unique.map(k=>`<option value="${esc(k)}">`).join('')}</datalist>`);
  renderKlussen();calcAndRender();
}

function calcBruto(st,et){
  if(!st||!et)return 0;
  const [sh,sm]=st.split(':').map(Number),[eh,em]=et.split(':').map(Number);
  return(Math.max(0,(eh*60+em)-(sh*60+sm)))/60;
}

  const wId=werknemers[0]?.id||'';

// De gekozen filters blijven bewaard buiten het tekenen, zodat de keuze niet
// steeds wordt gewist wanneer de tabel opnieuw wordt opgebouwd.
let dashFilter={periode:'week',wId:'',status:''};
function dashGefilterd(){
  return DB.list('dagstaten')
    .filter(d=>matchesFilter(d,{wId:dashFilter.wId,status:dashFilter.status,period:dashFilter.periode}))
    .sort((a,b)=>(b.datum||'').localeCompare(a.datum||''));
}
function renderDashboard(){
  const werknemers=DB.list('werknemers');
  const gef=dashGefilterd();
  const totaalAlle=DB.list('dagstaten').length;
  const totalNetto=gef.reduce((s,d)=>s+(Number(d.nettoUren)||0),0);
  const inAfwachting=gef.filter(d=>d.status==='in_afwachting').length;
  const activeW=werknemers.filter(w=>w.actief!==false).length;
  const alleMono=gef.reduce((s,d)=>s+(d.klussen||[]).filter(k=>k.wegenMonsteren).length,0);

function getDashFilter(){
  const wId=$('dashWerknemer')?.value||'';
  const status=$('dashStatus')?.value||'';
  let period='all';
  const active=document.querySelector('.dash-filter.bg-emerald-100,.dark\\:bg-emerald-900');
  if(active)period=active.dataset.filter||'all';
  return{wId,status,period};
}
function matchesFilter(d,f){
  if(f.wId&&d.medewerkerId!==f.wId)return false;
  if(f.status&&d.status!==f.status)return false;
  if(f.period==='week'){const w=weekNum(new Date(d.datum));const y=new Date(d.datum).getFullYear();const{start,end}=weekRange(y,w);if(d.datum<start||d.datum>end)return false}
  else if(f.period==='maand'){const now=new Date();const dm=now.getMonth(),dy=now.getFullYear();const d=new Date(d.datum);if(d.getMonth()!==dm||d.getFullYear()!==dy)return false}
  return true;
}

// === BEHEER: KLUSSEN & FACTURATIE ===
let klusFilter={periode:'maand',klant:'',dienst:'',werknemer:'',factuur:'',mono:''};
let klusSelectie=new Set();

// Alle klusregels uit alle dagstaten, platgeslagen tot losse regels
function alleKlussen(){
  const kMap={};DB.list('klanten').forEach(k=>kMap[k.id]=k);
  const dMap={};DB.list('diensten').forEach(d=>dMap[d.id]=d);
  const out=[];
  DB.list('dagstaten').forEach(d=>(d.klussen||[]).forEach(k=>out.push({
    ...k,dagId:d.id,datum:d.datum,medewerkerId:d.medewerkerId,medewerkerNaam:d.medewerkerNaam,dagStatus:d.status,
    klant:kMap[k.klantId]||null,dienst:dMap[k.dienstId]||null
  })));
  return out.sort((a,b)=>(b.datum||'').localeCompare(a.datum||''));
}
function klusBedrag(k){const t=k.dienst&&k.dienst.tarief?Number(k.dienst.tarief):0;return t*(Number(k.aantal)||0)}
function klusMatch(k,f){
  if(f.klant&&k.klantId!==f.klant)return false;
  if(f.dienst&&k.dienstId!==f.dienst)return false;
  if(f.werknemer&&k.medewerkerId!==f.werknemer)return false;
  if(f.factuur==='open'&&k.gefactureerd)return false;
  if(f.factuur==='klaar'&&!k.gefactureerd)return false;
  if(f.mono==='wel'&&!k.wegenMonsteren)return false;
  if(f.mono==='niet'&&k.wegenMonsteren)return false;
  if(f.periode&&f.periode!=='alles'){
    const dt=new Date(k.datum);
    if(f.periode==='week'){const y=dt.getFullYear(),w=weekNum(dt);const r=weekRange(y,w);if(k.datum<r.start||k.datum>r.end)return false}
    else if(f.periode==='maand'){const n=new Date();if(dt.getMonth()!==n.getMonth()||dt.getFullYear()!==n.getFullYear())return false}
  }
  return true;
}
// Facturatiestatus van klusregels wegschrijven naar de dagstaat
function zetFacturatieBulk(paren,waarde){
  const perDag={};
  paren.forEach(p=>{(perDag[p.dagId]=perDag[p.dagId]||[]).push(p.klusId)});
  Object.keys(perDag).forEach(dagId=>{
    const d=DB.get('dagstaten',dagId);if(!d)return;
    const ids=perDag[dagId];
    const klussen=(d.klussen||[]).map(k=>ids.includes(k.id)?{...k,gefactureerd:!!waarde,factuurdatum:waarde?today():''}:k);
    DB.update('dagstaten',dagId,{...d,klussen});
  });
}
// "Wegen monsteren" van klusregels wegschrijven naar de dagstaat
function zetMono(paren,waarde){
  const perDag={};
  paren.forEach(p=>{(perDag[p.dagId]=perDag[p.dagId]||[]).push(p.klusId)});
  Object.keys(perDag).forEach(dagId=>{
    const d=DB.get('dagstaten',dagId);if(!d)return;
    const ids=perDag[dagId];
    const klussen=(d.klussen||[]).map(k=>ids.includes(k.id)?{...k,wegenMonsteren:!!waarde}:k);
    DB.update('dagstaten',dagId,{...d,klussen});
  });
}
function toggleKlusSelectie(id,aan){if(aan)klusSelectie.add(id);else klusSelectie.delete(id);updateKlusBulkLabel()}
function updateKlusBulkLabel(){
  const b=$('btnKlusBulk');if(!b)return;
  b.textContent=klusSelectie.size?`✅ Geselecteerde afvinken (${klusSelectie.size})`:'✅ Geselecteerde afvinken';

// Facturatielijst als CSV (puntkomma + UTF-8 BOM, opent goed in Nederlandse Excel)
function exportKlussenCSV(rows){
  const headers=['Datum','Medewerker','Klant','Adres klant','Dienst','Kenteken/Materieel','Omschrijving','Aantal','Eenheid','Uurtarief','Indicatief bedrag','Wegen monsteren','Facturatiestatus','Factuurdatum','Dagstaatstatus'];
  const lijnen=rows.map(k=>{
    const tarief=k.dienst&&k.dienst.tarief?Number(k.dienst.tarief):0;
    const bud=klusBedrag(k);
    return [k.datum,k.medewerkerNaam||'',k.klant?esc(k.klant.naam):'',esc(k.klant?klantAdres(k.klant):''),k.dienst?esc(k.dienst.naam):'',esc(k.kenteken||''),esc(k.omschrijving||''),k.aantal,k.eenheid||'uur',tarief?tarief.toFixed(2):'',bud?bud.toFixed(2):'',k.wegenMonsteren?'Ja':'Nee',k.gefactureerd?'Gefactureerd':'Te factureren',k.factuurdatum||'',k.dagStatus||''].join(';');
  });
  const csv='\uFEFF'+headers.join(';')+'\n'+lijnen.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='facturatielijst_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);
  toast('Facturatielijst geëxporteerd ✅ ('+rows.length+' regels)','success');
}

// === KLANTEN IMPORTEREN (CSV-bestand of plakken uit Excel) ===
function normaliseerKop(h){return String(h||'').toLowerCase().replace(/["']/g,'').replace(/[^a-z]/g,'')}
const KLANT_KOLOMMEN={
  naam:['naam','klant','klantnaam','bedrijfsnaam','bedrijf','relatie','relatienaam','name','company','opdrachtgever','debiteur'],
  adres:['adres','straat','straatnaam','address','street','adres1','bezoekadres','adresregel1'],
  postcode:['postcode','zip','zipcode','postalcode'],
  plaats:['plaats','stad','woonplaats','city','town','vestigingsplaats'],
  contact:['contact','contactpersoon','contactpersoonnaam','naamcontactpersoon','tav','tennamevan'],
  email:['email','emailadres','mail','emailaddress','email1'],
  telefoon:['telefoon','telefoonnummer','tel','telefoonnr','phone','phonenumber','mobiel','gsm']
};
function splitsCSVRegel(regel,dl){
  const uit=[];let cur='';let q=false;
  for(let i=0;i<regel.length;i++){
    const c=regel[i];
    if(c==='"'){ if(q&&regel[i+1]==='"'){cur+='"';i++} else q=!q }
    else if(c===dl&&!q){uit.push(cur);cur=''}
    else cur+=c;
  }
  uit.push(cur);return uit.map(x=>x.trim());
}
// Leest geplakte of geüploade tekst en haalt er klanten uit.
// Herkent Nederlandse kolomkoppen; is er geen kop, dan is kolom 1 de naam.
function parseKlantenTekst(txt){
  const regels=String(txt||'').replace(/\r\n?/g,'\n').split('\n').filter(r=>r.trim()!=='');
  if(!regels.length)return{fout:'Geen regels gevonden'};
  const eerste=regels[0];
  const telling=[['\t',(eerste.match(/\t/g)||[]).length],[';',(eerste.match(/;/g)||[]).length],[',',(eerste.match(/,/g)||[]).length]];
  telling.sort((a,b)=>b[1]-a[1]);
  const dl=telling[0][1]>0?telling[0][0]:';';
  const kop=splitsCSVRegel(regels[0],dl);
  const kol={};
  Object.keys(KLANT_KOLOMMEN).forEach(veld=>{
    const i=kop.findIndex(h=>KLANT_KOLOMMEN[veld].includes(normaliseerKop(h)));
    if(i>=0)kol[veld]=i;
  });
  const heeftKop=Object.keys(kol).length>0;
  if(!heeftKop)kol.naam=0;
  const datarijen=heeftKop?regels.slice(1):regels;
  const klanten=[];
  datarijen.forEach(r=>{
    const c=splitsCSVRegel(r,dl);
    const naam=(c[kol.naam]||'').trim();
    if(!naam)return;
    const pak=v=>kol[v]!=null?(c[kol[v]]||'').trim():'';
    klanten.push({naam,adres:pak('adres'),postcode:pak('postcode'),plaats:pak('plaats'),contact:pak('contact'),email:pak('email'),telefoon:pak('telefoon'),actief:true});
  });
  return{klanten,heeftKop,kol,dl};
}

function renderExports(){
  const dagstaten=DB.list('dagstaten');

  <button id="btnExportJSON" class="w-full px-4 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-medium min-h-[48px]">💾 JSON backup exporteren</button>

  <p class="text-sm text-gray-500 mb-2">JSON backup importeren</p>
  <label class="inline-block px-4 py-2 bg-gray-100 dark:bg-gray-700 rounded-xl cursor-pointer min-h-[48px] flex items-center gap-2"><span>📁 Kies bestand</span><input type="file" id="importJSON" accept=".json" class="hidden"></label>
  </div>
  </div></div>`;
  $('btnExportCSV').onclick=()=>exportCSV(dagstaten,werknemers,klanten,diensten);
  $('btnExportJSON').onclick=()=>exportJSON();
  $('importJSON').onchange=e=>importJSON(e);
}
function exportCSV(dagen,werknemers,klanten,diensten){
  const wMap={},kMap={},dMap={};
  werknemers.forEach(w=>wMap[w.id]=w);klanten.forEach(k=>kMap[k.id]=k);diensten.forEach(d=>dMap[d.id]=d);
  const headers=['Medewerker','Personeelsnr','Datum','Starttijd','Eindtijd','Pauze (min)','Netto uren dag','Klant','Adres klant','Dienst','Kenteken/Materieel','Omschrijving','Aantal','Eenheid','Wegen monsteren','Status'];
  const rows=[];
  dagen.forEach(d=>{const w=wMap[d.medewerkerId]||{};d.klussen.forEach(k=>{const kl=kMap[k.klantId]||{},dv=dMap[k.dienstId]||{};rows.push([w.naam||'',w.persNr||'',d.datum,d.startTime,d.endTime,d.pauzeMin,d.nettoUren,kl.naam||'',esc(klantAdres(kl)),dv.naam||'',esc(k.kenteken||''),esc(k.omschrijving||''),k.aantal,k.eenheid||'',k.wegenMonsteren?'Ja':'Nee',d.status].join(';'))});});
  const bom='\uFEFF';
  const csv=bom+headers.join(';')+'\n'+rows.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='urenadministratie_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);
  toast('CSV geëxporteerd ✅','success');
}
function exportJSON(){const data={werknemers:DB.list('werknemers'),klanten:DB.list('klanten'),diensten:DB.list('diensten'),dagstaten:DB.list('dagstaten')};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uren_backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('JSON backup geëxporteerd ✅','success')}
function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(data.werknemers)data.werknemers.forEach(w=>{const ex=DB.get('werknemers',w.id);ex?DB.update('werknemers',w.id,w):DB.insert('werknemers',w)});if(data.klanten)data.klanten.forEach(k=>{const ex=DB.get('klanten',k.id);ex?DB.update('klanten',k.id,k):DB.insert('klanten',k)});if(data.diensten)data.diensten.forEach(d=>{const ex=DB.get('diensten',d.id);ex?DB.update('diensten',d.id,d):DB.insert('diensten',d)});if(data.dagstaten)data.dagstaten.forEach(d=>{const ex=DB.get('dagstaten',d.id);ex?DB.update('dagstaten',d.id,d):DB.insert('dagstaten',d)});toast('Backup geïmporteerd ✅','success');setTimeout(()=>renderCurrentView(),500)}catch(err){toast('Ongeldig JSON-bestand','error')}};reader.readAsText(file);e.target.value='';
}

let currentView='invoer', currentBeheerTab='dashboard', currentMode='medewerker';
function renderCurrentView(){
  const main=$('main');

  // andere schermen (en crashen ze op velden die daar niet bestaan).
  main.oninput=null;main.onchange=null;main.onclick=null;
  if(currentMode==='medewerker'){
    if(currentView==='invoer')renderInvoer();
    else if(currentView==='mijnuren')renderMijnUren();
  } else {
    switch(currentBeheerTab){
      case 'dashboard':renderDashboard();break;
      case 'klussen':renderKlussenBeheer();break;
      case 'klanten':renderKlanten();break;
      case 'diensten':renderDiensten();break;
      case 'werknemers':renderWerknemers();break;
      case 'export':renderExports();break;
      default:renderDashboard();
    }
  }
}
function renderBottomNav(){
  $('bottomNav').style.display=currentMode==='medewerker'?'flex':'none';
  $('beheerNav').style.display=currentMode==='beheer'?'flex':'none';
}
function switchView(view){currentView=view;renderCurrentView()}
function switchTab(tab){currentBeheerTab=tab;renderCurrentView();document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.toggle('border-emerald-600',b.dataset.tab===tab);b.classList.toggle('text-emerald-700',b.dataset.tab===tab);b.classList.toggle('border-transparent',b.dataset.tab!==tab)})}

// === PWA ===
function initPWA(){
  try{
    const manifest={name:'Urenregistratie Transport & Loon',short_name:'UrenApp',start_url:'.',display:'standalone',theme_color:'#059669',background_color:'#ffffff',icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#059669"/><circle cx="50" cy="52" r="22" fill="none" stroke="white" stroke-width="5"/><line x1="50" y1="52" x2="50" y2="38" stroke="white" stroke-width="5"/><line x1="50" y1="52" x2="62" y2="57" stroke="white" stroke-width="5"/></svg>')}],type:'image/svg+xml'};
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
    const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(blob);document.head.appendChild(link);
    // Service worker
    const swCode=`const CACHE='uren-v1';self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.add('/')))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`;
    const swBlob=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker?.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }catch(e){console.log('PWA registration skipped:',e.message)}
}

// === INIT ===
function init(){
  seedData();
  migrateKlanten();

  document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

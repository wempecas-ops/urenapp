// Bij een factuur: scans van deze klant kiezen en als bijlage toevoegen (kopie naar de factuurmap)
function openScanKeuze(f,klaar){
  const k=f.klantId||'';const naam=(f.klant&&f.klant.naam)||'';
  const data=(f.klusIds||[]).map(x=>(DB.get('dagstaten',x.dagId)||{}).datum).filter(Boolean).sort();
  const van=data[0]?iso_(new Date(new Date(data[0]+'T12:00:00').getTime()-7*86400000)):'';
  const tot=data.length?iso_(new Date(new Date(data[data.length-1]+'T12:00:00').getTime()+7*86400000)):'';
  const lijst=DB.list('scans').filter(s=>s.status==='gesorteerd'&&((k&&s.klantId===k)||(!s.klantId&&vNorm(s.klantNaam)===vNorm(naam)))).sort((a,b)=>String(b.datum||'').localeCompare(String(a.datum||'')));
  if(!lijst.length){toast('Er zijn nog geen gesorteerde scans voor '+(naam||'deze klant'),'error');return}
  const m=document.createElement('div');m.id='scanKeuze';m.className='fixed inset-0 bg-black/50 z-30 overflow-auto p-3';
  m.innerHTML=`<div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-5 w-full max-w-lg mx-auto my-4"><h3 class="font-bold mb-1">Scans van ${esc(naam)}</h3><p class="text-xs text-gray-500 mb-3">${van?'Aangevinkt: de scans rond de klusdata van deze factuur.':'Vink aan welke scans mee moeten.'}</p>
   <div class="max-h-80 overflow-auto space-y-1 mb-4">${lijst.map(s=>{const aan=!s.factuurId&&van&&s.datum&&s.datum>=van&&s.datum<=tot;return `<label class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 text-sm"><input type="checkbox" data-sk="${esc(s.id)}" ${aan?'checked':''}><span class="flex-1">${esc(s.bestandsnaam||'scan')}<br><span class="text-xs text-gray-500">${s.datum?esc(datumNL(s.datum)):'geen datum'}${s.factuurId?' · al op een factuur':''}</span></span></label>`}).join('')}</div>
   <div class="flex gap-2"><button id="skOk" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-medium min-h-[48px]">Toevoegen als bijlage</button><button id="skX" class="flex-1 bg-gray-200 dark:bg-gray-700 py-2 rounded-xl font-medium min-h-[48px]">Annuleren</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#skX').onclick=()=>m.remove();
  m.querySelector('#skOk').onclick=async()=>{
    const ids=[...m.querySelectorAll('[data-sk]:checked')].map(c=>c.dataset.sk);if(!ids.length){toast('Niets aangevinkt','error');return}
    const knop=m.querySelector('#skOk');knop.disabled=true;knop.textContent='Toevoegen…';
    const nieuw=[];
    for(const id of ids){const s=DB.get('scans',id);try{
      await zorgVoorToken();
      const doel='facturen/'+f.id+'/b-'+Date.now().toString(36)+'-'+veiligBestand(s.bestandsnaam||'scan');
      const r=await fetch(CONFIG.SUPABASE_URL+'/storage/v1/object/copy',{method:'POST',headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+AUTH_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({bucketId:'bijlagen',sourceKey:s.pad,destinationKey:doel})});
      if(!r.ok){let t='';try{t=(await r.json()).message}catch(e){}throw new Error(t||('Fout '+r.status))}
      nieuw.push({pad:doel,naam:s.bestandsnaam||'scan',grootte:s.grootte||0,bron:'scan',mee:true});
      DB.update('scans',s.id,{...s,factuurId:f.id});
    }catch(e){toast((s.bestandsnaam||'scan')+': '+e.message,'error')}}
    m.remove();if(nieuw.length)klaar(nieuw);
  };
}

// ---- Factuur versturen per mail ----
// De pdf's en bijlagen gaan eerst naar de besloten opslag (map facturen/<id>/), daarna verstuurt
// /api/factuur-mail de mail via Gmail. Vooraf rekenen we uit of de mail niet te groot wordt.
const MAIL_MAX=25*1024*1024;                 // Gmail: 25 MB per mail
const mbF=n=>(n/1024/1024).toFixed(1).replace('.',',')+' MB';
const veiligBestand=n=>String(n||'bestand').normalize('NFKD').replace(/[^\w.\-]+/g,'_').replace(/_+/g,'_').slice(0,80)||'bestand';
async function opslagUpload(pad,blob,type){
  if(CONFIG.MODE!=='supabase')throw new Error('Versturen werkt alleen met de database (niet in demo-modus)');
  await zorgVoorToken();
  const r=await fetch(CONFIG.SUPABASE_URL+'/storage/v1/object/bijlagen/'+pad.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+AUTH_TOKEN,'Content-Type':type||blob.type||'application/octet-stream'},body:blob});
  if(!r.ok){let m='Uploaden mislukt';try{const j=await r.json();m=j.message||j.error||m}catch(e){}throw new Error(m)}
  return pad;
}

  const kl=f.klantId?DB.get('klanten',f.klantId):null;

  const groet=['Met vriendelijke groet,','',b.naam,b.onderNaam,b.telefoon].filter(x=>x!==undefined&&x!==null).join('\n');
  if(f.soort==='credit')return aanhef+'\n\nIn de bijlage vindt u creditnota '+f.nummer+' van '+datumLangNL(f.factuurdatum)+' voor een bedrag van '+eurF(Math.abs(t.incl))+'.\n\nHeeft u vragen? Neem dan gerust contact met ons op.\n\n'+groet;
  return aanhef+'\n\nIn de bijlage vindt u factuur '+f.nummer+' van '+datumLangNL(f.factuurdatum)+' voor een bedrag van '+eurF(t.incl)+'.\n\nWij verzoeken u dit bedrag vóór '+datumLangNL(f.vervaldatum)+' over te maken op '+b.iban+' t.n.v. '+(b.tenaamstelling||b.naam)+', onder vermelding van factuurnummer '+f.nummer+'.\n\nHeeft u vragen over deze factuur? Neem dan gerust contact met ons op.\n\n'+groet;
}

    $('fm_extra').innerHTML=extra.map((x,i)=>{const ext=(x.naam.split('.').pop()||'').toUpperCase().slice(0,4);return `<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border:1px solid #e3e6e0;border-radius:10px;margin-bottom:8px"><span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;font-size:11px;font-weight:700;background:${ext==='PDF'?'#5a655e':'#8a5a12'};color:#fff;flex:none">${esc(ext||'BEST')}</span><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.naam)}</div><div style="font-size:12px;color:#5a655e">${mbF(x.blob.size)}</div></div><button type="button" data-fmrm="${i}" aria-label="Bijlage ${esc(x.naam)} verwijderen" style="font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:0;background:#fdecea;color:#b42318;cursor:pointer;min-height:32px">verwijder</button></div>`}).join('');
    m.querySelectorAll('[data-fmrm]').forEach(bt=>bt.onclick=()=>{extra.splice(+bt.dataset.fmrm,1);tekenExtra()});
    tekenMaat();
  };
  const tekenMaat=()=>{
    const ruw=pdfMaat+(($('fm_wb')&&$('fm_wb').checked)?wbMaat||200*1024:0)+extra.reduce((s,x)=>s+x.blob.size,0)+vast.filter(x=>x.mee).reduce((s,x)=>s+(x.grootte||350*1024),0);
    const mail=Math.round(ruw*1.37)+30*1024;
    const te=mail>MAIL_MAX;
    $('fm_maat').innerHTML=`<div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:600">Grootte van de mail</span><span style="font-weight:600;color:${te?'#b42318':'#14181a'}">${mbF(mail)} <span style="color:#5a655e;font-weight:400">van 25 MB</span></span></div>
      <div style="height:8px;background:#eceee9;border-radius:4px;margin-top:10px;overflow:hidden"><div style="height:8px;border-radius:4px;width:${Math.min(100,mail/MAIL_MAX*100).toFixed(0)}%;background:${te?'#b42318':mail>MAIL_MAX*0.8?'#c98a2b':'#2f6b45'}"></div></div>
      <div style="font-size:12px;color:${te?'#b42318':'#5a655e'};margin-top:8px">${te?'Te groot voor één mail. Haal een bijlage weg of verklein hem. (Bijlagen worden bij het versturen ongeveer een derde groter.)':mail>MAIL_MAX*0.8?'Bijna aan de grens van Gmail.':'Ruim binnen de grens van Gmail. Foto\'s worden automatisch verkleind.'}</div>`;
    $('fmSend').disabled=te;
    return mail;
  };
  tekenVast();tekenExtra();
  // echte grootte van de factuur-pdf alvast bepalen
  factuurPdf(f.id,'blob').then(bl=>{if(bl){pdfMaat=bl.size;if($('fm_pdfmaat'))$('fm_pdfmaat').textContent=mbF(bl.size);tekenMaat()}}).catch(()=>{if($('fm_pdfmaat'))$('fm_pdfmaat').textContent='kon niet worden gemaakt'});
  if($('fm_wb'))$('fm_wb').onchange=async()=>{tekenMaat();if($('fm_wb').checked&&!wbMaat){try{const bl=await werkbonPdfBlob(klussen);wbMaat=bl.size;tekenMaat()}catch(e){}}};
  const verzendBestanden=async files=>{
    for(const file of files){
      let blob=file,naam=file.name;
      // Foto's groter dan 1 MB verkleinen we (zoals bij de klussen); pdf's en andere bestanden blijven zoals ze zijn.
      if(/^image\//.test(file.type)&&file.size>1024*1024){try{blob=await fotoVerkleinen(file);naam=naam.replace(/\.[^.]+$/,'')+'.jpg'}catch(x){}}
      extra.push({naam,blob});
    }
    tekenExtra();
  };
  $('fm_file').onchange=e=>{const files=[...e.target.files];e.target.value='';verzendBestanden(files)};
  maakSleepZone(m.querySelector('[role=dialog]'),verzendBestanden);
  const sluit=()=>m.remove();
  $('fmX').onclick=sluit;$('fmCancel').onclick=sluit;
  $('fmSend').onclick=async()=>{
    const aan=$('fm_aan').value.trim();
    if(!aan){toast('Vul een ontvanger in','error');return}
    if(tekenMaat()>MAIL_MAX){toast('De mail is te groot','error');return}
    if(CONFIG.MODE!=='supabase'){toast('Versturen werkt alleen met de database (niet in demo-modus)','error');return}
    if(navigator.onLine===false){toast('Geen internet','error');return}
    const knop=$('fmSend');knop.disabled=true;knop.textContent='Bezig met versturen…';
    try{
      const map='facturen/'+f.id+'/'+Date.now().toString(36)+'-';
      const fnaam=((f.soort==='credit'?'Creditnota ':'Factuur ')+f.nummer+' - '+((f.klant&&f.klant.naam)||'')).replace(/[\\/:*?"<>|]/g,'').trim()+'.pdf';
      const pdf=await factuurPdf(f.id,'blob');
      const factuurPad=await opslagUpload(map+'factuur.pdf',pdf,'application/pdf');
      const bijlagen=[];
      if($('fm_wb')&&$('fm_wb').checked){const wb=await werkbonPdfBlob(klussen);bijlagen.push({pad:await opslagUpload(map+'werkbon.pdf',wb,'application/pdf'),naam:'Werkbon bij '+(f.soort==='credit'?'creditnota ':'factuur ')+f.nummer+'.pdf'})}
      for(const x of vast.filter(v=>v.mee)){
        if(x.bron==='klus'){const r2_=await fetch(await fotoUrl(x.pad));if(!r2_.ok)throw new Error('Foto '+x.naam+' kon niet worden opgehaald');const bl=await r2_.blob();bijlagen.push({pad:await opslagUpload(map+'f-'+veiligBestand(x.naam),bl,bl.type||'image/jpeg'),naam:x.naam})}
        else bijlagen.push({pad:x.pad,naam:x.naam});
      }
      for(let i=0;i<extra.length;i++){const x=extra[i];bijlagen.push({pad:await opslagUpload(map+i+'-'+veiligBestand(x.naam),x.blob,x.blob.type),naam:x.naam})}
      await zorgVoorToken();
      const r=await fetch('/api/factuur-mail',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+AUTH_TOKEN},body:JSON.stringify({factuurId:f.id,aan,cc:$('fm_cc').value.trim(),onderwerp:$('fm_ond').value,tekst:$('fm_tekst').value,factuurPad,factuurNaam:fnaam,bijlagen,yuki:(!herinnering&&$('fm_yuki').checked&&b.yukiEmail)?b.yukiEmail:'',soort:herinnering?'herinnering':'factuur',afzenderNaam:[b.naam,b.onderNaam].filter(Boolean).join(' ')})});
      let j={};try{j=await r.json()}catch(e){}
      if(!r.ok||!j.ok)throw new Error(j.fout||('Fout '+r.status));
      // lokaal bijwerken (de server heeft het al vastgelegd)
      const rij=DB.get('facturen',f.id);if(rij){if(!herinnering)rij.verstuurdOp=j.verstuurdOp;rij.pdfPad=factuurPad;rij.verzendingen=[...(rij.verzendingen||[]),j.verzending];cacheBewaar()}
      sluit();
      toast((herinnering?'Herinnering verstuurd naar ':'Verstuurd naar ')+aan+(j.yuki===true?' (en kopie naar Yuki)':'')+(j.yuki===false?' — let op: de kopie naar Yuki is mislukt':''),j.yuki===false?'error':'success');
      renderCurrentView();
    }catch(e){toast('Versturen mislukt: '+e.message,'error');knop.disabled=false;knop.textContent=herinnering?'Herinnering versturen':(f.soort==='credit'?'Creditnota':'Factuur')+' versturen'}
  };
}

function werkbonPdfDef(lijst,b,img){
  lijst=lijst.slice().sort((a,c)=>(a.datum||'').localeCompare(c.datum||'')||(a.startTijd||'').localeCompare(c.startTijd||''));
  const kl=lijst[0]&&lijst[0].klant||{};
  const grijs='#6b6b6b',lijn='#e4e1da',inkt='#111111';
  const th=(tx,al)=>({text:tx.toUpperCase(),fontSize:6.4,bold:true,color:grijs,characterSpacing:1.1,alignment:al||'left'});
  const dagNaam=iso=>{const d=new Date(iso+'T12:00:00');return isNaN(d)?(iso||''):DAGEN_KORT[d.getDay()]+' '+datumNL(iso)};
  const uren=lijst.filter(k=>k.eenheid==='uur').reduce((s,k)=>s+(Number(k.aantal)||0),0);
  const datums=[...new Set(lijst.map(k=>k.datum))].sort();
  const kop=(datums.length>1?datumNL(datums[0])+' t/m '+datumNL(datums[datums.length-1]):datumNL(datums[0]||'')).toUpperCase();
  return {
    pageSize:'A4',pageOrientation:'portrait',pageMargins:[45,50,45,72],
    info:{title:'Werkbon '+(kl.naam||''),author:b.naam},
    defaultStyle:{font:'Inter',fontSize:8.6,color:inkt,lineHeight:1.2},
    background:(page)=>page!==1?null:[
      {image:img.banner,width:595.28,height:209.8,absolutePosition:{x:0,y:0}},
      {canvas:[{type:'rect',x:0,y:0,w:595.28,h:3.4,color:FACT_GROEN}],absolutePosition:{x:0,y:209.8}},
      {image:img.logo,width:176,absolutePosition:{x:45,y:42}},
      {text:'WERKBON',font:'InterLicht',fontSize:27,characterSpacing:5,color:'#ffffff',absolutePosition:{x:45,y:124}},
      {text:kop,fontSize:8.2,characterSpacing:1.6,color:FACT_SUB,absolutePosition:{x:45,y:163}}
    ],
    header:(page)=>page===1?null:{text:[{text:(b.naam||'').toUpperCase(),bold:true},'   ·   Werkbon (vervolg)'],fontSize:7,characterSpacing:1,color:FACT_GROEN,margin:[45,28,45,0]},
    footer:(page,aantal)=>({margin:[45,18,45,0],stack:[{canvas:[{type:'line',x1:0,y1:0,x2:505.28,y2:0,lineWidth:0.5,lineColor:lijn}],margin:[0,0,0,6]},
      {columns:[{text:[b.naam,b.onderNaam,b.adres+', '+b.postcode+' '+b.plaats,'T '+b.telefoon].filter(Boolean).join(' · '),fontSize:6.8,color:'#7a7a7a'},{text:'Pagina '+page+' van '+aantal,fontSize:6.8,color:'#7a7a7a',alignment:'right',width:90}]}]}),
    content:[
      {text:'',margin:[0,175,0,0]},
      {text:'KLANT',fontSize:6.6,bold:true,color:FACT_GROEN,characterSpacing:1.2,margin:[0,0,0,5]},
      {text:kl.naam||'',bold:true,fontSize:11},kl.adres?{text:kl.adres}:'',(kl.postcode||kl.plaats)?{text:[kl.postcode,kl.plaats].filter(Boolean).join('  ')}:'',
      {margin:[0,22,0,0],table:{headerRows:1,dontBreakRows:true,widths:[60,68,'*',54,50,52,46],
        body:[[th('Datum'),th('Medewerker'),th('Werkzaamheden'),th('Kenteken'),th('Tijd'),th('Aantal','right'),th('Gewogen','center')],
          ...lijst.map(k=>[{text:dagNaam(k.datum),noWrap:true},k.medewerkerNaam||'',{stack:[{text:(k.dienst&&k.dienst.naam)||'',bold:true},k.omschrijving?{text:k.omschrijving,color:grijs}:'']},k.kenteken||'',klusTijdTekst(k,'–'),{text:num2(k.aantal)+' '+eenhLabel(k.eenheid),alignment:'right',noWrap:true},{text:k.wegenMonsteren?'Ja':'Nee',alignment:'center'}])]},
        layout:{hLineWidth:i=>i===0?0:(i===1?1.2:0.5),hLineColor:i=>i===1?inkt:lijn,vLineWidth:()=>0,paddingLeft:i=>i===0?0:5,paddingRight:(i,n)=>i===n.table.widths.length-1?0:5,paddingTop:()=>5,paddingBottom:()=>5}},

    ]
  };
}
async function werkbonPdfBlob(klussen){
  if(!klussen.length)throw new Error('Geen klussen');
  const img=await pdfKlaarmaken();
  const doc=pdfMake.createPdf(werkbonPdfDef(klussen,bedrijf(),img));
  return await new Promise(ok=>doc.getBlob(ok));
}

// === KLANTEN IMPORTEREN (CSV-bestand of plakken uit Excel) ===
function normaliseerKop(h){return String(h||'').toLowerCase().replace(/["']/g,'').replace(/[^a-z]/g,'')}
const KLANT_KOLOMMEN={
  naam:['naam','klant','klantnaam','bedrijfsnaam','bedrijf','relatie','relatienaam','name','company','opdrachtgever','debiteur'],
  adres:['adres','straat','straatnaam','address','street','adres1','bezoekadres','adresregel1'],
  postcode:['postcode','zip','zipcode','postalcode'],
  plaats:['plaats','stad','woonplaats','city','town','vestigingsplaats'],
  contact:['contact','contactpersoon','contactpersoonnaam','naamcontactpersoon','tav','tennamevan'],
  email:['email','emailadres','mail','emailaddress','email1'],
  telefoon:['telefoon','telefoonnummer','tel','telefoonnr','phone','phonenumber','mobiel','gsm']
};
function splitsCSVRegel(regel,dl){
  const uit=[];let cur='';let q=false;
  for(let i=0;i<regel.length;i++){
    const c=regel[i];
    if(c==='"'){ if(q&&regel[i+1]==='"'){cur+='"';i++} else q=!q }
    else if(c===dl&&!q){uit.push(cur);cur=''}
    else cur+=c;
  }
  uit.push(cur);return uit.map(x=>x.trim());
}
// Leest geplakte of geüploade tekst en haalt er klanten uit.
// Herkent Nederlandse kolomkoppen; is er geen kop, dan is kolom 1 de naam.
function parseKlantenTekst(txt){
  const regels=String(txt||'').replace(/\r\n?/g,'\n').split('\n').filter(r=>r.trim()!=='');
  if(!regels.length)return{fout:'Geen regels gevonden'};
  const eerste=regels[0];
  const telling=[['\t',(eerste.match(/\t/g)||[]).length],[';',(eerste.match(/;/g)||[]).length],[',',(eerste.match(/,/g)||[]).length]];
  telling.sort((a,b)=>b[1]-a[1]);
  const dl=telling[0][1]>0?telling[0][0]:';';
  const kop=splitsCSVRegel(regels[0],dl);
  const kol={};
  Object.keys(KLANT_KOLOMMEN).forEach(veld=>{
    const i=kop.findIndex(h=>KLANT_KOLOMMEN[veld].includes(normaliseerKop(h)));
    if(i>=0)kol[veld]=i;
  });
  const heeftKop=Object.keys(kol).length>0;
  if(!heeftKop)kol.naam=0;
  const datarijen=heeftKop?regels.slice(1):regels;
  const klanten=[];
  datarijen.forEach(r=>{
    const c=splitsCSVRegel(r,dl);
    const naam=(c[kol.naam]||'').trim();
    if(!naam)return;
    const pak=v=>kol[v]!=null?(c[kol[v]]||'').trim():'';
    klanten.push({naam,adres:pak('adres'),postcode:pak('postcode'),plaats:pak('plaats'),contact:pak('contact'),email:pak('email'),telefoon:pak('telefoon'),actief:true});
  });
  return{klanten,heeftKop,kol,dl};
}

    }
    const bestaand=new Set(DB.list('klanten').map(k=>(k.naam||'').trim().toLowerCase()));

    const voorbeeld=nieuw.slice(0,5);

      <div class="text-xs text-gray-500 mt-1">Scheidingsteken: ${res.dl==='\t'?'tab':res.dl===';'?'puntkomma':'komma'}</div>

    const kan=nieuw.length>0;

  }

  $('kiCheck').onclick=controleer;

}
const normKent=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

function openMaterieelBulk(){
  document.body.insertAdjacentHTML('beforeend',`<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-30" id="matBulk"><div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 w-full max-w-lg mx-4"><h3 class="font-bold mb-2">Meerdere plakken</h3>
  <p class="text-sm text-gray-600 dark:text-gray-300 mb-2">Een per regel: kenteken, daarna eventueel een omschrijving (gescheiden door ; of tab of een streepje met spaties). Dubbele kentekens worden overgeslagen.</p>
  <textarea id="mb_tekst" rows="10" class="w-full border rounded-xl px-3 py-2 mb-3 font-mono text-sm bg-white dark:bg-gray-700 dark:border-gray-600" style="min-height:0" placeholder="12-ABC-3;Mestwagen Scania&#10;45-XYZ-6;Trekker John Deere&#10;Mestinjecteur"></textarea>
  <div class="flex gap-2"><button id="mbSave" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-medium min-h-[48px]">Toevoegen</button><button id="mbCancel" class="flex-1 bg-gray-200 dark:bg-gray-700 py-2 rounded-xl font-medium min-h-[48px]">Annuleren</button></div></div></div>`);
  $('mbCancel').onclick=()=>$('matBulk').remove();
  $('mbSave').onclick=()=>{
    const bestaand=new Set(DB.list('materieel').map(m=>normKent(m.kenteken)));let n=0,dubbel=0;
    $('mb_tekst').value.split(/\r?\n/).forEach(r=>{
      r=r.trim();if(!r)return;
      const d=r.split(/\s*[;\t]\s*|\s+-\s+/);
      const kent=(d[0]||'').trim().toUpperCase(),oms=d.slice(1).join(' ').trim();
      if(!kent)return;
      if(bestaand.has(normKent(kent))){dubbel++;return}
      bestaand.add(normKent(kent));DB.insert('materieel',{kenteken:kent,omschrijving:oms,actief:true});n++;
    });
    $('matBulk').remove();toast(n+' toegevoegd'+(dubbel?', '+dubbel+' al aanwezig':''),'success');renderCurrentView();
  };
}

// === ORDERS (verzamelorders / tickets, alleen beheer) ===
// Los van de klussen die medewerkers invoeren: een eigen overzicht voor klussen
// die meerdere dagen duren, met status, notities, foto's en regels met aantal x prijs.
const ORDER_STATUS=['Nieuw','Gepland','Bezig','Klaar','Gefactureerd'];
const ORDER_KLEUR={Nieuw:'bg-gray-200 text-gray-800',Gepland:'bg-blue-100 text-blue-800',Bezig:'bg-amber-100 text-amber-900',Klaar:'bg-emerald-100 text-emerald-800',Gefactureerd:'bg-purple-100 text-purple-800'};
const orderFilter={status:'open',q:''};
const eurO=n=>'€ '+(Number(n)||0).toFixed(2).replace('.',',');
const getal=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n};
const orderTotaal=o=>(o.regels||[]).reduce((s,r)=>s+getal(r.aantal)*getal(r.prijs),0);
const nieuwOrdernr=()=>{let m=0;DB.list('orders').forEach(o=>{const r=/^O(\d+)$/.exec(o.ordernr||'');if(r)m=Math.max(m,parseInt(r[1],10))});return 'O'+String(m+1).padStart(4,'0')};
const datumNL=d=>d?String(d).split('-').reverse().join('-'):'';
function renderOrders(){
  const alle=DB.list('orders').slice().sort((a,b)=>(b.ordernr||'').localeCompare(a.ordernr||''));
  const f=orderFilter,q=f.q.trim().toLowerCase();
  const lijst=alle.filter(o=>{
    if(f.status==='open'&&o.status==='Gefactureerd')return false;
    if(f.status!=='open'&&f.status!=='alles'&&o.status!==f.status)return false;
    if(q){const kl=DB.get('klanten',o.klantId);const hooi=[o.ordernr,o.titel,o.omschrijving,o.notities,kl&&kl.naam].join(' ').toLowerCase();if(!hooi.includes(q))return false}
    return true;
  });
  const tel=s=>alle.filter(o=>o.status===s).length;
  const chips=[['open','Lopend ('+alle.filter(o=>o.status!=='Gefactureerd').length+')'],...ORDER_STATUS.map(s=>[s,s+' ('+tel(s)+')']),['alles','Alles ('+alle.length+')']];
  $('main').innerHTML=`<div class="max-w-full mx-auto"><h2 class="text-xl font-bold mb-1 text-gray-800 dark:text-gray-100">Orders</h2>
  <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Je eigen tickets voor werk dat meerdere dagen duurt. Medewerkers zien dit niet en het staat los van de klussen.</p>
  <div class="flex flex-wrap gap-2 mb-3"><button id="btnNieuwOrder" class="px-4 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 min-h-[48px] font-medium">+ Nieuwe order</button>
  <input id="orderZoek" value="${esc(f.q)}" placeholder="Zoeken op klant, nummer of tekst" class="flex-1 min-w-[180px] border rounded-xl px-3 py-2 bg-white dark:bg-gray-700 dark:border-gray-600"></div>
  <div class="flex flex-wrap gap-2 mb-4">${chips.map(([k,t])=>`<button data-ofs="${k}" class="px-3 py-2 rounded-full text-sm min-h-[40px] border ${f.status===k?'bg-black text-white border-black dark:bg-white dark:text-black':'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600'}">${esc(t)}</button>`).join('')}</div>
  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${lijst.length?lijst.map(o=>{const kl=DB.get('klanten',o.klantId);const tot=orderTotaal(o);
    return `<button data-order="${o.id}" class="text-left bg-white dark:bg-gray-800 rounded-2xl shadow p-4 border border-gray-100 dark:border-gray-700 hover:border-gray-400">
    <div class="flex items-center justify-between gap-2 mb-1"><span class="text-xs font-mono text-gray-500">${esc(o.ordernr||'')}</span><span class="px-2 py-0.5 rounded-full text-xs font-medium ${ORDER_KLEUR[o.status]||ORDER_KLEUR.Nieuw}">${esc(o.status||'Nieuw')}</span></div>
    <div class="font-semibold text-gray-800 dark:text-gray-100">${esc(o.titel||'(zonder titel)')}</div>
    <div class="text-sm text-gray-600 dark:text-gray-300">${kl?esc(kl.naam):'<span class="text-gray-400">Geen klant</span>'}</div>
    ${o.startdatum||o.einddatum?`<div class="text-xs text-gray-500 mt-1">${esc(datumNL(o.startdatum))}${o.einddatum?' t/m '+esc(datumNL(o.einddatum)):''}</div>`:''}
    <div class="flex items-center justify-between mt-2 text-xs text-gray-500"><span>${(o.regels||[]).length} regel(s)${(o.fotos||[]).length?' · '+(o.fotos||[]).length+' foto\'s':''}</span><span class="font-semibold text-gray-800 dark:text-gray-100 text-sm">${tot?eurO(tot):''}</span></div></button>`}).join(''):'<p class="text-gray-400 py-8 md:col-span-2 xl:col-span-3 text-center">Geen orders gevonden.</p>'}</div></div>`;
  $('btnNieuwOrder').onclick=()=>openOrderEditor(null);
  $('orderZoek').oninput=e=>{orderFilter.q=e.target.value;const p=e.target.selectionStart;renderOrders();const z=$('orderZoek');z.focus();try{z.setSelectionRange(p,p)}catch(x){}};
  document.querySelectorAll('[data-ofs]').forEach(b=>b.onclick=()=>{orderFilter.status=b.dataset.ofs;renderOrders()});
  document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>openOrderEditor(b.dataset.order));
}

    <div><label class="block text-sm font-medium mb-1" for="oe_van">Startdatum</label><input type="date" id="oe_van" value="${esc(ex?ex.startdatum||'':'')}" class="w-full border rounded-xl px-3 py-2 bg-white dark:bg-gray-700 dark:border-gray-600"></div>

  document.body.appendChild(m);

function bindDienstenCRUD(items){
  $('btnAddDienst').onclick=()=>openDienstEditor(null,items);
  const schuif=(id,stap)=>{const l=items.slice();const i=l.findIndex(d=>d.id===id),j=i+stap;if(i<0||j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];
    l.forEach((d,n)=>{const v=(n+1)*10;if(d.volgorde!==v)DB.update('diensten',d.id,{...d,volgorde:v})});renderCurrentView()};
  document.querySelectorAll('[data-dienst-op]').forEach(b=>b.onclick=()=>schuif(b.dataset.dienstOp,-1));

let PLAN=(()=>{try{const s=JSON.parse(localStorage.getItem('wop_planning')||'null');if(s&&Array.isArray(s.regels))return s}catch(e){}return null})()||{datum:'',regels:[],notitie:'',groep:'klus'};
// Oudere planningen hadden 1 laad- en 1 loslocatie (laad/los); nu mogen het er meer zijn (laden/lossen).
const planNorm=r=>{if(!Array.isArray(r.laden))r.laden=[r.laad||''];if(!Array.isArray(r.lossen))r.lossen=[r.los||''];if(!r.laden.length)r.laden=[''];if(!r.lossen.length)r.lossen=[''];delete r.laad;delete r.los;return r};
PLAN.regels.forEach(planNorm);
const nieuwPlanRegel=()=>({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),tijd:'',klant:'',laadnr:'',laden:[''],lossen:[''],omschr:'',wie:[]});
function planBewaar(){try{localStorage.setItem('wop_planning',JSON.stringify(PLAN))}catch(e){}}
const planIngevuld=r=>(r.klant||'').trim()||(r.omschr||'').trim()||(r.laadnr||'').trim()||(r.laden||[]).some(x=>(x||'').trim())||(r.lossen||[]).some(x=>(x||'').trim());
const datumLang=iso=>{if(!iso)return '';const d=new Date(iso+'T12:00:00');return isNaN(d)?'':d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'})};
// Telefoonnummer -> internationaal formaat voor wa.me (06-12345678 -> 31612345678). Leeg = onbruikbaar.
function waNummer(t){
  const s=String(t||'').trim();if(!s)return '';
  let d=s.replace(/\D/g,'');
  if(/^\+/.test(s)){}
  else if(/^00/.test(s))d=d.slice(2);
  else if(d.startsWith('0'))d='31'+d.slice(1);
  else if(!(d.startsWith('31')&&d.length===11))return '';
  if(d.startsWith('31'))return d.length===11?d:'';
  return d.length>=8&&d.length<=15?d:'';
}
const locRegels=(arr,label,pre)=>{const v=(arr||[]).map(x=>(x||'').trim()).filter(Boolean);return v.map((x,i)=>(pre||'')+label+(v.length>1?' '+(i+1):'')+': '+x)};
function planContext(){
  const wn={};DB.list('werknemers').forEach(w=>wn[w.id]=w.naam);
  const kl=DB.list('klanten');
  const klantVan=t=>{t=(t||'').trim();if(!t)return null;const l=t.toLowerCase();return kl.find(k=>(k.naam+(k.plaats?' ('+k.plaats+')':'')).toLowerCase()===l)||kl.find(k=>(k.naam||'').toLowerCase()===l)||null};
  const plek=r=>{const k=klantVan(r.klant);if(!k)return (r.klant||'').trim();return k.naam+(klantAdres(k)?' - '+klantAdres(k):'')};
  const regels=PLAN.regels.filter(planIngevuld).slice().sort((a,b)=>(a.tijd||'99:99')<(b.tijd||'99:99')?-1:1);
  return {wn,plek,regels};
}
function planTekst(){
  const {wn,plek,regels}=planContext();
  const dat=datumLang(PLAN.datum);
  const uit=[];
  uit.push('*Planning'+(dat?' '+dat:'')+'*');
  if(PLAN.notitie.trim()){uit.push('');uit.push(PLAN.notitie.trim())}
  if(PLAN.groep==='klus'){
    regels.forEach(r=>{
      uit.push('');
      uit.push('*'+(r.tijd?r.tijd+' - ':'')+(plek(r)||'Klus')+'*');
      if((r.laadnr||'').trim())uit.push('Laadnummer: '+r.laadnr.trim());
      locRegels(r.laden,'Laden').forEach(x=>uit.push(x));
      locRegels(r.lossen,'Lossen').forEach(x=>uit.push(x));
      if((r.omschr||'').trim())uit.push(r.omschr.trim());
      const namen=(r.wie||[]).map(id=>wn[id]).filter(Boolean);
      if(namen.length)uit.push('Wie: '+namen.join(', '));
    });
  } else {
    const per={};
    regels.forEach(r=>{(r.wie||[]).forEach(id=>{(per[id]=per[id]||[]).push(r)})});
    Object.keys(per).sort((a,b)=>(wn[a]||'').localeCompare(wn[b]||'')).forEach(id=>{
      uit.push('');uit.push('*'+(wn[id]||'?')+'*');
      per[id].forEach(r=>{uit.push('- '+(r.tijd?r.tijd+' ':'')+(plek(r)||'Klus')+((r.laadnr||'').trim()?' (laadnr '+r.laadnr.trim()+')':'')+((r.omschr||'').trim()?': '+r.omschr.trim():''));locRegels(r.laden,'Laden','  ').concat(locRegels(r.lossen,'Lossen','  ')).forEach(x=>uit.push(x))});
    });
    const zonder=regels.filter(r=>!(r.wie||[]).length);
    if(zonder.length){uit.push('');uit.push('*Nog niemand ingedeeld*');zonder.forEach(r=>uit.push('- '+(r.tijd?r.tijd+' ':'')+(plek(r)||'Klus')+((r.laadnr||'').trim()?' (laadnr '+r.laadnr.trim()+')':'')))}
  }
  return uit.join('\n');
}
// Persoonlijk bericht: alleen de klussen van 1 medewerker.
function planTekstVoor(wid){
  const {wn,plek,regels}=planContext();
  const dat=datumLang(PLAN.datum);
  const uit=['*Planning'+(dat?' '+dat:'')+'*'];
  if(PLAN.notitie.trim()){uit.push('');uit.push(PLAN.notitie.trim())}
  regels.filter(r=>(r.wie||[]).includes(wid)).forEach(r=>{
    uit.push('');
    uit.push('*'+(r.tijd?r.tijd+' - ':'')+(plek(r)||'Klus')+'*');
    if((r.laadnr||'').trim())uit.push('Laadnummer: '+r.laadnr.trim());
    locRegels(r.laden,'Laden').forEach(x=>uit.push(x));
    locRegels(r.lossen,'Lossen').forEach(x=>uit.push(x));
    if((r.omschr||'').trim())uit.push(r.omschr.trim());
    const anderen=(r.wie||[]).filter(id=>id!==wid).map(id=>wn[id]).filter(Boolean);
    if(anderen.length)uit.push('Samen met: '+anderen.join(', '));
  });
  return uit.join('\n');
}

    <div class="flex gap-2 flex-wrap"><button id="plKopieer" class="px-4 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 min-h-[48px] font-medium">Kopieer bericht</button><button id="plWa" class="px-4 py-2 bg-green-600 text-white rounded-xl hover:bg-green-700 min-h-[48px] font-medium">Open in WhatsApp</button></div>
    <p class="text-xs text-gray-500 mt-2">Bij het algemene bericht kies je in WhatsApp zelf de groep of de personen. Wijzigt je planning, dan worden de berichten vanzelf opnieuw opgebouwd (handmatige aanpassingen gaan dan verloren).</p>
   </div>
  </div></div>`;
  $('plGroep').value=PLAN.groep;
  const tekenPer=()=>{
    const {regels}=planContext();
    const ids=[...new Set(regels.flatMap(r=>r.wie||[]))];
    const lijst=ids.map(id=>wn.find(w=>w.id===id)).filter(Boolean);
    const arch=DB.list('planningen');
    const zonder=regels.filter(r=>!(r.wie||[]).length).length;
    $('plPer').innerHTML=lijst.length?lijst.map(w=>{
      const nr=waNummer(w.telefoon);
      const eerder=arch.filter(p=>p.medewerkerId===w.id&&p.datum===PLAN.datum).sort((a,b)=>String(b.verstuurdOp).localeCompare(String(a.verstuurdOp)))[0];
      const n=regels.filter(r=>(r.wie||[]).includes(w.id)).length;
      return `<div class="border border-gray-200 dark:border-gray-700 rounded-xl p-3 mb-2">
        <div class="flex flex-wrap items-center gap-2 justify-between">
          <div><div class="font-medium">${esc(w.naam)} <span class="text-xs text-gray-500">· ${n} klus${n===1?'':'sen'}</span></div>
          ${nr?'':'<div class="text-xs text-red-600">Telefoonnummer ontbreekt of klopt niet (pas aan bij Werknemers)</div>'}
          ${eerder?`<div class="text-xs text-emerald-700 dark:text-emerald-400">✓ Geopend in WhatsApp ${esc(tijdKort(eerder.verstuurdOp))}</div>`:''}</div>
          <button data-pwa="${esc(w.id)}" ${nr?'':'disabled'} class="px-4 py-2 rounded-xl font-medium min-h-[48px] ${nr?'bg-green-600 text-white hover:bg-green-700':'bg-gray-200 text-gray-400 cursor-not-allowed'}">${eerder?'Opnieuw sturen':'Stuur via WhatsApp'}</button>
        </div>
        <details class="mt-2"><summary class="text-sm cursor-pointer text-blue-600">Bekijk of pas het bericht aan</summary>
        <textarea data-ptekst="${esc(w.id)}" rows="8" class="w-full border rounded-xl px-3 py-2 mt-2 font-mono text-sm dark:bg-gray-700 dark:border-gray-600" style="min-height:0">${esc(planTekstVoor(w.id))}</textarea></details></div>`}).join('')
      +(zonder?`<p class="text-xs text-amber-700">${zonder} klus${zonder===1?'':'sen'} nog zonder medewerker.</p>`:'')
      :'<p class="text-sm text-gray-500">Kies bij een klus de medewerker(s); dan verschijnt hier per persoon een knop.</p>';
  };
  const ververs=()=>{planBewaar();$('plTekst').value=planTekst();tekenPer()};
  ververs();
  $('plPer').onclick=e=>{
    const b=e.target.closest('[data-pwa]');if(!b||b.disabled)return;
    const w=wn.find(x=>x.id===b.dataset.pwa);if(!w)return;
    const ta=$('plPer').querySelector('[data-ptekst="'+w.id+'"]');
    const tekst=ta?ta.value:planTekstVoor(w.id);
    waOpen(waNummer(w.telefoon),tekst);
    planLog(w.id,w.naam,tekst,PLAN.datum,'versturen');
    setTimeout(tekenPer,300);
  };
  $('plDatum').onchange=e=>{PLAN.datum=e.target.value;ververs()};
  $('plGroep').onchange=e=>{PLAN.groep=e.target.value;ververs()};
  $('plNotitie').oninput=e=>{PLAN.notitie=e.target.value;ververs()};
  const r$=el=>PLAN.regels.find(r=>r.id===el.closest('[data-r]').dataset.r);
  const box=$('plRegels');
  try{localStorage.removeItem('wop_locaties')}catch(e){}  // oude onthouden locaties per klant: niet meer gebruikt
  box.oninput=e=>{const f=e.target.dataset.f;if(!f)return;const r=r$(e.target);if(!r)return;
    if(f==='laden'||f==='lossen')r[f][+e.target.dataset.i]=e.target.value;else r[f]=e.target.value;
    ververs()};
  box.onchange=e=>{
    if(e.target.dataset.wie===undefined)return;
    const r=r$(e.target);if(!r)return;r.wie=r.wie||[];const id=e.target.dataset.wie;
    r.wie=e.target.checked?[...new Set([...r.wie,id])]:r.wie.filter(x=>x!==id);ververs()};
  box.onclick=e=>{
    const t=e.target;
    if(t.dataset.addloc){const r=r$(t);if(r){r[t.dataset.addloc].push('');planBewaar();renderPlanning()}return}
    if(t.dataset.rmloc){const [v,i]=t.dataset.rmloc.split('|');const r=r$(t);if(r){r[v].splice(+i,1);if(!r[v].length)r[v]=[''];planBewaar();renderPlanning()}return}
    if(t.dataset.dup){const src=PLAN.regels.find(r=>r.id===t.dataset.dup);if(src){const i=PLAN.regels.indexOf(src);PLAN.regels.splice(i+1,0,{...src,id:nieuwPlanRegel().id,wie:[...(src.wie||[])],laden:[...src.laden],lossen:[...src.lossen]});planBewaar();renderPlanning()}return}
    if(t.dataset.del){PLAN.regels=PLAN.regels.filter(r=>r.id!==t.dataset.del);planBewaar();renderPlanning()}
  };
  $('plNieuw').onclick=()=>{PLAN.regels.push(nieuwPlanRegel());planBewaar();renderPlanning()};
  $('plWis').onclick=()=>{if(!PLAN.regels.length&&!PLAN.notitie||confirm('Alle klussen uit de planning wissen?')){PLAN.regels=[];PLAN.notitie='';planBewaar();renderPlanning()}};
  $('plKopieer').onclick=async()=>{const t=$('plTekst').value;try{await navigator.clipboard.writeText(t);toast('Bericht gekopieerd','success')}catch(e){$('plTekst').select();document.execCommand('copy');toast('Bericht gekopieerd','success')}};
  $('plWa').onclick=()=>{const t=$('plTekst').value;waOpen('',t);planLog(null,'Algemeen bericht',t,PLAN.datum,'algemeen')};
}

// === PLANNING-ARCHIEF ===
const ARCH={mw:'',van:'',tot:'',q:'',max:50};
function renderPlanArchief(){
  const wn=DB.list('werknemers').slice().sort((a,b)=>(a.naam||'').localeCompare(b.naam||''));
  const alle=DB.list('planningen').slice().sort((a,b)=>String(b.verstuurdOp).localeCompare(String(a.verstuurdOp)));
  const q=ARCH.q.trim().toLowerCase();
  const lijst=alle.filter(p=>{
    if(ARCH.mw==='__alg'){if(p.medewerkerId)return false}else if(ARCH.mw&&p.medewerkerId!==ARCH.mw)return false;
    if(ARCH.van&&(p.datum||'')<ARCH.van)return false;
    if(ARCH.tot&&(p.datum||'')>ARCH.tot)return false;
    if(q&&!((p.tekst||'')+' '+(p.medewerkerNaam||'')).toLowerCase().includes(q))return false;
    return true;
  });
  const toon=lijst.slice(0,ARCH.max);
  $('main').innerHTML=`<div class="max-w-full mx-auto"><h2 class="text-xl font-bold mb-1 text-gray-800 dark:text-gray-100">Planning-archief</h2>
  <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Elke keer dat je een planning in WhatsApp opent, wordt hij hier bewaard. Het archief laat zien dat je de knop hebt gebruikt; of je in WhatsApp echt op verzenden hebt gedrukt, kan ik niet zien.</p>
  <div class="flex flex-wrap gap-3 items-end mb-4">
    <div><label class="block text-xs font-medium mb-1" for="arMw">Medewerker</label><select id="arMw" class="border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600"><option value="">Iedereen</option><option value="__alg">Algemene berichten</option>${wn.map(w=>`<option value="${esc(w.id)}">${esc(w.naam)}</option>`).join('')}</select></div>
    <div><label class="block text-xs font-medium mb-1" for="arVan">Planning van</label><input type="date" id="arVan" value="${esc(ARCH.van)}" class="border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600"></div>
    <div><label class="block text-xs font-medium mb-1" for="arTot">tot en met</label><input type="date" id="arTot" value="${esc(ARCH.tot)}" class="border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600"></div>
    <div class="flex-1 min-w-[180px]"><label class="block text-xs font-medium mb-1" for="arQ">Zoeken in tekst</label><input id="arQ" value="${esc(ARCH.q)}" placeholder="Klant, laadnummer, ..." class="w-full border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600"></div>
  </div>
  <div class="space-y-3">${toon.length?toon.map(p=>`<div class="bg-white dark:bg-gray-800 rounded-2xl shadow border border-gray-100 dark:border-gray-700 p-4">
    <div class="flex flex-wrap items-start justify-between gap-2">
      <div><div class="font-semibold text-gray-800 dark:text-gray-100">${esc(p.medewerkerNaam||'Algemeen bericht')}${p.soort==='opnieuw'?' <span class="text-xs font-normal text-gray-500">(opnieuw gestuurd)</span>':''}${p.soort==='kopie'?' <span class="text-xs font-normal text-gray-500">(kopie van andere planning)</span>':''}</div>
      <div class="text-xs text-gray-500">Planning voor ${esc(datumLang(p.datum)||'—')} · geopend ${esc(tijdKort(p.verstuurdOp))}${p.verstuurdDoor?' door '+esc(p.verstuurdDoor):''}</div></div>
      <div class="flex flex-wrap gap-1">
        <button data-ar-again="${p.id}" class="px-3 py-2 rounded-xl bg-green-600 text-white text-sm min-h-[44px]">Opnieuw sturen</button>
        <button data-ar-copy="${p.id}" class="px-3 py-2 rounded-xl border border-gray-300 dark:border-gray-600 text-sm min-h-[44px]">Kopieer / naar andere medewerker</button>
        <button data-ar-del="${p.id}" class="px-2 text-red-500 text-sm min-h-[44px]">Verwijder</button></div></div>
    <details class="mt-2"><summary class="text-sm cursor-pointer text-blue-600">Bekijk bericht</summary><pre class="whitespace-pre-wrap text-sm mt-2 font-mono bg-gray-50 dark:bg-gray-900 rounded-xl p-3">${esc(p.tekst||'')}</pre></details></div>`).join(''):'<p class="text-gray-400 py-8 text-center">Nog niets in het archief.</p>'}</div>
  ${lijst.length>toon.length?`<button id="arMeer" class="mt-4 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl min-h-[48px]">Toon meer (${lijst.length-toon.length} verborgen)</button>`:''}</div>`;
  $('arMw').value=ARCH.mw;
  $('arMw').onchange=e=>{ARCH.mw=e.target.value;ARCH.max=50;renderPlanArchief()};
  $('arVan').onchange=e=>{ARCH.van=e.target.value;renderPlanArchief()};
  $('arTot').onchange=e=>{ARCH.tot=e.target.value;renderPlanArchief()};
  $('arQ').oninput=e=>{ARCH.q=e.target.value;const p=e.target.selectionStart;renderPlanArchief();const z=$('arQ');z.focus();try{z.setSelectionRange(p,p)}catch(x){}};
  if($('arMeer'))$('arMeer').onclick=()=>{ARCH.max+=50;renderPlanArchief()};
  document.querySelectorAll('[data-ar-again]').forEach(b=>b.onclick=()=>{
    const p=DB.get('planningen',b.dataset.arAgain);if(!p)return;
    const w=p.medewerkerId?DB.get('werknemers',p.medewerkerId):null;
    const nr=w?waNummer(w.telefoon):'';
    if(w&&!nr){toast('Telefoonnummer van '+w.naam+' ontbreekt of klopt niet','error');return}
    waOpen(nr,p.tekst);planLog(p.medewerkerId,p.medewerkerNaam,p.tekst,p.datum,'opnieuw');setTimeout(renderPlanArchief,300);
  });
  document.querySelectorAll('[data-ar-copy]').forEach(b=>b.onclick=()=>openPlanKopie(b.dataset.arCopy));
  document.querySelectorAll('[data-ar-del]').forEach(b=>b.onclick=()=>{if(confirm('Deze regel uit het archief verwijderen?')){DB.remove('planningen',b.dataset.arDel);renderPlanArchief()}});
}
function openPlanKopie(id){
  const p=DB.get('planningen',id);if(!p)return;
  const wn=DB.list('werknemers').filter(w=>w.actief!==false).sort((a,b)=>(a.naam||'').localeCompare(b.naam||''));
  const m=document.createElement('div');m.id='planKopie';m.className='fixed inset-0 bg-black/50 z-30 overflow-auto p-3';
  m.innerHTML=`<div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-5 w-full max-w-lg mx-auto my-4">
    <h3 class="font-bold mb-1">Planning kopiëren</h3>
    <p class="text-xs text-gray-500 mb-3">Planning voor ${esc(datumLang(p.datum)||'—')}. Kies wie hem krijgt en pas de tekst zo nodig aan.</p>
    <label class="block text-sm font-medium mb-1" for="pkMw">Sturen naar</label>
    <select id="pkMw" class="w-full border rounded-xl px-3 py-2 mb-3 bg-white dark:bg-gray-700 dark:border-gray-600"><option value="">— kies medewerker —</option>${wn.map(w=>`<option value="${esc(w.id)}">${esc(w.naam)}</option>`).join('')}</select>
    <label class="block text-sm font-medium mb-1" for="pkTekst">Bericht</label>
    <textarea id="pkTekst" rows="10" class="w-full border rounded-xl px-3 py-2 mb-3 font-mono text-sm bg-white dark:bg-gray-700 dark:border-gray-600" style="min-height:0">${esc(p.tekst||'')}</textarea>
    <div class="flex flex-wrap gap-2"><button id="pkWa" class="flex-1 bg-green-600 text-white py-2 rounded-xl font-medium min-h-[48px]">Open in WhatsApp</button><button id="pkKop" class="px-4 border border-gray-300 dark:border-gray-600 rounded-xl min-h-[48px]">Kopieer tekst</button><button id="pkX" class="px-4 bg-gray-200 dark:bg-gray-700 rounded-xl min-h-[48px]">Sluiten</button></div></div>`;
  document.body.appendChild(m);
  $('pkX').onclick=()=>m.remove();
  $('pkKop').onclick=async()=>{const t=$('pkTekst').value;try{await navigator.clipboard.writeText(t);toast('Bericht gekopieerd','success')}catch(e){$('pkTekst').select();document.execCommand('copy');toast('Bericht gekopieerd','success')}};
  $('pkWa').onclick=()=>{
    const w=wn.find(x=>x.id===$('pkMw').value);
    if(!w){toast('Kies eerst een medewerker','error');return}
    const nr=waNummer(w.telefoon);
    if(!nr){toast('Telefoonnummer van '+w.naam+' ontbreekt of klopt niet','error');return}
    const t=$('pkTekst').value;waOpen(nr,t);planLog(w.id,w.naam,t,p.datum,'kopie');m.remove();renderCurrentView();
  };
}

// === KEURINGEN & VERVALDATA (voertuigen en chauffeurs, alleen beheer) ===
const KEUR_SOORTEN={voertuig:['APK','Verzekering','Tachograaf-keuring','Onderhoudsbeurt','Overig'],chauffeur:['Rijbewijs','Code 95','Chauffeurskaart','VCA','Overig']};
const KEUR={toon:'open'};
const dagenTot=iso=>{if(!iso)return null;const a=new Date(iso+'T12:00:00'),b=new Date();b.setHours(12,0,0,0);return Math.round((a-b)/86400000)};
function keurLabel(v){
  if(v.type==='voertuig'){const m=DB.get('materieel',v.refId);return m?m.kenteken+(m.omschrijving?' · '+m.omschrijving:''):'(voertuig verwijderd)'}
  const w=DB.get('werknemers',v.refId);return w?w.naam:'(medewerker verwijderd)';
}
function keurStatus(dagen){
  if(dagen==null)return {t:'Geen datum',c:'bg-gray-100 text-gray-700'};
  if(dagen<0)return {t:'Verlopen ('+(-dagen)+' d)',c:'bg-red-100 text-red-800'};
  if(dagen<=30)return {t:'Nog '+dagen+' dagen',c:'bg-orange-100 text-orange-800'};
  if(dagen<=60)return {t:'Nog '+dagen+' dagen',c:'bg-amber-100 text-amber-900'};
  return {t:'Nog '+dagen+' dagen',c:'bg-emerald-100 text-emerald-800'};
}
function keuringBanner(){
  if(!isBeheer())return '';
  const kort=DB.list('vervaldata').filter(v=>{const d=dagenTot(v.vervaldatum);return d!=null&&d<=30}).sort((a,b)=>(a.vervaldatum||'').localeCompare(b.vervaldatum||''));
  if(!kort.length)return '';
  return `<div class="mb-4 rounded-2xl border border-orange-300 bg-orange-50 dark:bg-orange-950 dark:border-orange-800 p-4"><div class="flex items-center justify-between gap-2 mb-1"><div class="font-semibold text-orange-900 dark:text-orange-200">Binnenkort verlopen (${kort.length})</div><button data-gotab="keuringen" class="text-sm underline text-orange-900 dark:text-orange-200 min-h-[40px]">Alles bekijken</button></div>
  <ul class="text-sm text-orange-900 dark:text-orange-200 space-y-0.5">${kort.slice(0,5).map(v=>`<li>${esc(keurLabel(v))} – ${esc(v.soort==='Overig'&&v.omschrijving?v.omschrijving:v.soort)}: ${esc(keurStatus(dagenTot(v.vervaldatum)).t)}</li>`).join('')}${kort.length>5?`<li>… en ${kort.length-5} meer</li>`:''}</ul></div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-gotab]');if(b)switchTab(b.dataset.gotab)});
function renderKeuringen(){
  const alle=DB.list('vervaldata').slice().sort((a,b)=>(a.vervaldatum||'9999').localeCompare(b.vervaldatum||'9999'));
  const teller={v:0,k:0,z:0};
  alle.forEach(v=>{const d=dagenTot(v.vervaldatum);if(d==null)return;if(d<0)teller.v++;else if(d<=30)teller.k++;else if(d<=60)teller.z++});
  const lijst=KEUR.toon==='alles'?alle:alle.filter(v=>{const d=dagenTot(v.vervaldatum);return d==null||d<=90});
  $('main').innerHTML=`<div class="max-w-full mx-auto"><h2 class="text-xl font-bold mb-1 text-gray-800 dark:text-gray-100">Keuringen &amp; vervaldata</h2>
  <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">APK, verzekering, tachograaf, rijbewijs, code 95 en meer, per voertuig of chauffeur. Wat binnen 30 dagen verloopt zie je ook op het dashboard. De APK (en tachograaf, als de RDW die kent) wordt elke nacht automatisch bijgewerkt voor alle kentekens in Materieel.</p>
  <div class="grid grid-cols-3 gap-3 mb-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-4 border border-gray-100 dark:border-gray-700"><div class="text-xs text-gray-500">Verlopen</div><div class="text-2xl font-bold text-red-600">${teller.v}</div></div>
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-4 border border-gray-100 dark:border-gray-700"><div class="text-xs text-gray-500">Binnen 30 dagen</div><div class="text-2xl font-bold text-orange-600">${teller.k}</div></div>
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-4 border border-gray-100 dark:border-gray-700"><div class="text-xs text-gray-500">Binnen 60 dagen</div><div class="text-2xl font-bold text-amber-600">${teller.z}</div></div></div>
  <div class="flex flex-wrap gap-2 mb-4"><button id="kNieuw" class="px-4 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 min-h-[48px] font-medium">+ Nieuw</button>
    <button id="kRdw" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl min-h-[48px]">APK nu ophalen bij RDW</button>
    <button id="kToon" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl min-h-[48px]">${KEUR.toon==='alles'?'Alleen wat binnen 90 dagen verloopt':'Toon alles ('+alle.length+')'}</button></div>
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow overflow-hidden border border-gray-100 dark:border-gray-700 scroll-x"><table class="w-full text-sm"><thead class="bg-gray-50 dark:bg-gray-700"><tr><th class="px-3 py-2 text-left">Wat</th><th class="px-3 py-2 text-left">Soort</th><th class="px-3 py-2 text-left">Vervalt op</th><th class="px-3 py-2 text-left">Status</th><th class="px-3 py-2 text-left">Opmerking</th><th class="px-3 py-2">Acties</th></tr></thead><tbody>
  ${lijst.length?lijst.map(v=>{const s=keurStatus(dagenTot(v.vervaldatum));return `<tr class="border-t border-gray-100 dark:border-gray-700"><td class="px-3 py-2 font-medium whitespace-nowrap">${esc(keurLabel(v))}</td><td class="px-3 py-2">${esc(v.soort==='Overig'&&v.omschrijving?v.omschrijving:v.soort||'')}</td><td class="px-3 py-2 whitespace-nowrap">${esc(datumNL(v.vervaldatum))}</td><td class="px-3 py-2 whitespace-nowrap"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${s.c}">${esc(s.t)}</span></td><td class="px-3 py-2">${esc(v.opmerking||'')}</td>
  <td class="px-3 py-2 whitespace-nowrap"><button data-k-verleng="${v.id}" class="text-emerald-700 hover:text-emerald-900 text-xs mr-2 min-h-[48px]">Verlengd</button><button data-k-edit="${v.id}" class="text-blue-600 hover:text-blue-800 text-xs mr-2 min-h-[48px]">Wijzig</button><button data-k-del="${v.id}" class="text-red-500 hover:text-red-700 text-xs min-h-[48px]">Verwijder</button></td></tr>`}).join(''):'<tr><td colspan="6" class="px-3 py-8 text-center text-gray-400">Niets dat binnenkort verloopt. Voeg vervaldata toe met "+ Nieuw".</td></tr>'}</tbody></table></div></div>`;
  $('kNieuw').onclick=()=>openKeuringEditor(null);
  $('kToon').onclick=()=>{KEUR.toon=KEUR.toon==='alles'?'open':'alles';renderKeuringen()};
  $('kRdw').onclick=()=>apkOphalen($('kRdw'));
  document.querySelectorAll('[data-k-edit]').forEach(b=>b.onclick=()=>openKeuringEditor(b.dataset.kEdit));
  document.querySelectorAll('[data-k-del]').forEach(b=>b.onclick=()=>{if(confirm('Deze vervaldatum verwijderen?')){DB.remove('vervaldata',b.dataset.kDel);renderKeuringen()}});

// APK-datums ophalen bij de RDW via /api/apk (doet de server; die zet ze in vervaldata)
async function apkOphalen(knop){
  if(CONFIG.MODE!=='supabase'){toast('Werkt alleen met de database','error');return}
  if(navigator.onLine===false){toast('Geen internet','error');return}
  const oud=knop.textContent;knop.disabled=true;knop.textContent='Bezig bij de RDW…';
  try{
    await zorgVoorToken();
    const r=await fetch('/api/apk',{method:'POST',headers:{Authorization:'Bearer '+AUTH_TOKEN}});
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok||!j.ok)throw new Error(j.fout||('Fout '+r.status));
    try{const o=await sbREST('/rest/v1/vervaldata?select=*&limit=1000');CACHE.vervaldata=Array.isArray(o)?o:CACHE.vervaldata;cacheBewaar()}catch(e){}
    renderKeuringen();
    const delen=[j.gecontroleerd+' kenteken'+(j.gecontroleerd===1?'':'s')+' gecontroleerd'];
    if(j.nieuw.length)delen.push(j.nieuw.length+' nieuw');
    if(j.bijgewerkt.length)delen.push(j.bijgewerkt.length+' bijgewerkt');
    if(!j.nieuw.length&&!j.bijgewerkt.length)delen.push('alles was al actueel');
    toast(delen.join(', '),'success');
    if(j.nietGevonden.length||j.fouten.length)alert((j.nietGevonden.length?'Niet gevonden bij de RDW (controleer het kenteken in Materieel):\n- '+j.nietGevonden.join('\n- ')+'\n\n':'')+(j.fouten.length?'Mislukt:\n- '+j.fouten.join('\n- '):''));
  }catch(e){toast('Ophalen bij RDW mislukt: '+e.message,'error')}
  finally{knop.disabled=false;knop.textContent=oud}
}

// Volledige back-up: gegevens + bestanden + facturen als pdf, in één zip
async function downloadVolledigeBackup(knop){
  if(CONFIG.MODE!=='supabase'){toast('Werkt alleen met de database','error');return}
  if(navigator.onLine===false){toast('Geen internet','error');return}
  const oud=knop.textContent;knop.disabled=true;
  const stand=t=>{knop.textContent=t};
  try{
    stand('Voorbereiden…');
    if(!window.JSZip)await laadScript('/vendor/jszip.min.js');
    const zip=new JSZip();
    const nu=vandaagIso();
    zip.file('gegevens.json',JSON.stringify({gemaakt:new Date().toISOString(),gegevens:CACHE},null,1));
    // alle bekende bestanden: foto's bij klussen en orders, bijlagen bij facturen
    const paden=new Set();
    DB.list('dagstaten').forEach(d=>(d.klussen||[]).forEach(k=>(k.fotos||[]).forEach(p=>paden.add(p))));
    DB.list('orders').forEach(o=>(o.fotos||[]).forEach(p=>paden.add(p)));
    DB.list('facturen').forEach(f=>(f.bijlagen||[]).forEach(b=>{if(b.bron!=='klus'&&b.pad)paden.add(b.pad)}));
    const lijst=[...paden];let i=0,mis=0;
    for(const p of lijst){
      i++;stand('Bestanden '+i+' van '+lijst.length+'…');
      try{const r=await fetch(await fotoUrl(p));if(!r.ok)throw new Error();zip.file('bestanden/'+p,await r.blob())}catch(e){mis++}
    }
    const def=DB.list('facturen').filter(f=>f.status!=='concept'&&f.nummer);
    let j=0;
    for(const f of def){
      j++;stand('Facturen '+j+' van '+def.length+'…');
      try{const bl=await factuurPdf(f.id,'blob');const naam=((f.soort==='credit'?'Creditnota ':'Factuur ')+f.nummer+' - '+((f.klant&&f.klant.naam)||'')).replace(/[\\/:*?"<>|]/g,'').trim()+'.pdf';zip.file('facturen/'+(f.factuurdatum||'').slice(0,4)+'/'+naam,bl)}catch(e){mis++}
    }
    stand('Zip maken…');
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wempe-op-pad-backup-'+nu+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    toast('Back-up gedownload ('+mbF(blob.size)+')'+(mis?' — '+mis+' bestand(en) konden niet worden opgehaald':''),mis?'error':'success');
  }catch(e){toast('Back-up mislukt: '+e.message,'error')}
  finally{knop.disabled=false;knop.textContent=oud}
}

function exportCSV(dagen,werknemers,klanten,diensten){
  const wMap={},kMap={},dMap={};
  werknemers.forEach(w=>wMap[w.id]=w);klanten.forEach(k=>kMap[k.id]=k);diensten.forEach(d=>dMap[d.id]=d);
  const headers=['Medewerker','Personeelsnr','Datum','Starttijd','Eindtijd','Pauze (min)','Netto uren dag','Klantcode','Klant','Adres klant','Dienst','Kenteken/Materieel','Omschrijving','Aantal','Eenheid','Wegen monsteren','Status','Vertrek'];
  const rows=[];
  dagen.forEach(d=>{const w=wMap[d.medewerkerId]||{};d.klussen.forEach(k=>{const kl=kMap[k.klantId]||{},dv=dMap[k.dienstId]||{};rows.push([w.naam||'',w.persNr||'',d.datum,d.startTime,d.endTime,d.pauzeMin,d.nettoUren,kl.klantcode||'',kl.naam||'',esc(klantAdres(kl)),dv.naam||'',esc(k.kenteken||''),esc(k.omschrijving||''),k.aantal,k.eenheid||'',k.wegenMonsteren?'Ja':'Nee',d.status,esc(d.vertrek||'')].join(';'))});});
  const bom='\uFEFF';
  const csv=bom+headers.join(';')+'\n'+rows.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='urenadministratie_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);
  toast('CSV geëxporteerd','success');
}
function exportJSON(){const data={werknemers:DB.list('werknemers'),klanten:DB.list('klanten'),diensten:DB.list('diensten'),dagstaten:DB.list('dagstaten')};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uren_backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('JSON backup geëxporteerd','success')}
function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(data.werknemers)data.werknemers.forEach(w=>{const ex=DB.get('werknemers',w.id);ex?DB.update('werknemers',w.id,w):DB.insert('werknemers',w)});if(data.klanten)data.klanten.forEach(k=>{const ex=DB.get('klanten',k.id);ex?DB.update('klanten',k.id,k):DB.insert('klanten',k)});if(data.diensten)data.diensten.forEach(d=>{const ex=DB.get('diensten',d.id);ex?DB.update('diensten',d.id,d):DB.insert('diensten',d)});if(data.dagstaten)data.dagstaten.forEach(d=>{const ex=DB.get('dagstaten',d.id);ex?DB.update('dagstaten',d.id,d):DB.insert('dagstaten',d)});toast('Backup geïmporteerd','success');setTimeout(()=>renderCurrentView(),500)}catch(err){toast('Ongeldig JSON-bestand','error')}};reader.readAsText(file);e.target.value='';
}

// vanuit de browser (daarvoor is de service_role-sleutel nodig, die nooit in
// de browser mag staan), dus loopt dat via /api/admin-users op Vercel.

let SESSIE = null;        // {id,naam,rol,werknemer_id,gebruikersnaam}
let AUTH_TOKEN = null, AUTH_REFRESH = null, AUTH_VERLOOPT = 0;
const CACHE = {};
const TABELLEN = ['werknemers', 'klanten', 'diensten', 'dagstaten'];

const isBeheer = () => !!SESSIE && SESSIE.rol === 'beheer';
const isMedewerker = () => !!SESSIE && SESSIE.rol === 'medewerker';
// Account dat alleen bij de facturen van Mts. C.J. Wempe mag (voor de broer)
const isMts = () => !!SESSIE && SESSIE.rol === 'mts';
const naarEmail = g => { g = String(g || '').trim().toLowerCase(); return g.includes('@') ? g : g + '@' + EMAIL_DOMEIN };
// Alleen voor de demo-modus; echte wachtwoorden worden door Supabase beheerd.
function hashWachtwoord(p){ let h = 5381; const s = String(p) + '|urenapp'; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return 'demo-' + h.toString(16) }

    { id:'acc3', gebruikersnaam:'piet', naam:'Piet Visser', rol:'medewerker', werknemer_id:'w2', actief:true, wachtwoordHash:hashWachtwoord('welkom123') }
  ]);

// ---- sleutelconversie ----
// De database gebruikt snake_case kolommen (medewerker_id), de app werkt met
// camelCase (medewerkerId). Deze twee omzettertjes overbruggen dat verschil,
// ook binnen de klussen die als JSON in de dagstaat zitten.
const naarSnake = s => String(s).replace(/[A-Z]/g, c => '_' + c.toLowerCase());
const naarCamel = s => String(s).replace(/_([a-z0-9])/g, (m, c) => c.toUpperCase());
function sleutelsOm(o, fn){
  if (Array.isArray(o)) return o.map(x => sleutelsOm(x, fn));
  if (o && typeof o === 'object') { const u = {}; Object.keys(o).forEach(k => { u[fn(k)] = sleutelsOm(o[k], fn) }); return u }
  return o;
}

// ---- Supabase REST ----
// Een Supabase-sessie duurt ongeveer een uur. Wie de app langer open heeft staan
// (bijv. een hele werkdag) krijgt hier automatisch een nieuwe sleutel.
async function zorgVoorToken(){
  if (CONFIG.MODE !== 'supabase' || !AUTH_TOKEN || Date.now() < AUTH_VERLOOPT) return;
  const ok = await sbVernieuw();
  if (!ok) { toast('Je sessie is verlopen. Log opnieuw in.', 'error'); setTimeout(() => location.reload(), 1500); throw new Error('Sessie verlopen') }
}
async function sbREST(pad, opties){
  opties = opties || {};
  await zorgVoorToken();
  const h = Object.assign({ 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, opties.headers || {});
  h['Authorization'] = 'Bearer ' + (AUTH_TOKEN || CONFIG.SUPABASE_ANON_KEY);
  if (opties.prefer) h['Prefer'] = opties.prefer;
  const r = await fetch(CONFIG.SUPABASE_URL + pad, { method: opties.method || 'GET', headers: h, body: opties.body ? JSON.stringify(sleutelsOm(opties.body, naarSnake)) : undefined });
  const tekst = await r.text();
  let data = null;
  try { data = tekst ? JSON.parse(tekst) : null } catch (e) { data = null }
  if (!r.ok) throw new Error((data && (data.message || data.error_description || data.msg || data.hint)) || ('Fout ' + r.status));
  return opties.raw ? data : sleutelsOm(data, naarCamel);
}
async function sbLogin(gebruiker, wachtwoord){
  const r = await fetch(CONFIG.SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: naarEmail(gebruiker), password: wachtwoord })
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error_description || data.msg || data.error || 'Inloggen mislukt');
  AUTH_TOKEN = data.access_token; AUTH_REFRESH = data.refresh_token;
  AUTH_VERLOOPT = Date.now() + ((data.expires_in || 3600) * 1000) - 60000;
  localStorage.setItem('uren_auth', JSON.stringify({ r: AUTH_REFRESH, v: AUTH_VERLOOPT }));
  return data.user;
}
async function sbVernieuw(){
  const bewaard = JSON.parse(localStorage.getItem('uren_auth') || 'null');
  if (!bewaard || !bewaard.r) return false;
  const r = await fetch(CONFIG.SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST',
    headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: bewaard.r })
  });
  if (!r.ok) { localStorage.removeItem('uren_auth'); return false }
  const data = await r.json();
  AUTH_TOKEN = data.access_token; AUTH_REFRESH = data.refresh_token;
  AUTH_VERLOOPT = Date.now() + ((data.expires_in || 3600) * 1000) - 60000;
  localStorage.setItem('uren_auth', JSON.stringify({ r: AUTH_REFRESH, v: AUTH_VERLOOPT }));
  return true;
}
// Profiel (rol + koppeling aan een werknemer) ophalen bij de ingelogde gebruiker
async function sbProfiel(userId){
  const rijen = await sbREST('/rest/v1/profiles?id=eq.' + encodeURIComponent(userId) + '&select=*', { raw: true });
  return (rijen && rijen[0]) || null;
}
async function sbUitloggen(){
  try { await fetch(CONFIG.SUPABASE_URL + '/auth/v1/logout', { method: 'POST', headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + AUTH_TOKEN } }) } catch (e) {}
  localStorage.removeItem('uren_auth');
  AUTH_TOKEN = null; AUTH_REFRESH = null;
}

// ---- synchronisatielaag: synchrone cache bovenop Supabase ----
const CACHE_DB = {
  list(t){ return CACHE[t] || [] },
  get(t, id){ return this.list(t).find(r => r.id === id) },
  insert(t, o){ if (!o.id) o.id = uid(); (CACHE[t] = CACHE[t] || []).push(o); verstuur('insert', t, o); return o },
  update(t, id, o){ const a = CACHE[t] || []; const i = a.findIndex(x => x.id === id); if (i >= 0) a[i] = Object.assign({}, o, { id }); verstuur('update', t, id, o); return a[i] },
  remove(t, id){ CACHE[t] = (CACHE[t] || []).filter(x => x.id !== id); verstuur('remove', t, id); return CACHE[t] }
};
// ---- wachtrij: wijzigingen worden eerst bewaard op het toestel en daarna verstuurd ----
// Zo gaat er niets verloren als er geen bereik is; zodra er weer verbinding is
// worden ze in volgorde verstuurd.
const WACHTRIJ_KEY = 'wop_wachtrij';
const CACHE_KEY = 'wop_cache';
let wachtrijBezig = false, startteOffline = false;
function wachtrijLees(){ try { return JSON.parse(localStorage.getItem(WACHTRIJ_KEY) || '[]') } catch (e) { return [] } }
function wachtrijSchrijf(w){ try { localStorage.setItem(WACHTRIJ_KEY, JSON.stringify(w)) } catch (e) {} toonNetStatus() }
function cacheBewaar(){ if (CONFIG.MODE !== 'supabase' || !SESSIE) return; try { localStorage.setItem(CACHE_KEY, JSON.stringify({ gebruiker: SESSIE.id, t: Date.now(), data: CACHE })) } catch (e) {} }
function toonNetStatus(){
  const el = document.getElementById('netChip'); if (!el) return;
  const n = wachtrijLees().length, off = typeof navigator !== 'undefined' && navigator.onLine === false;
  if (off) { el.textContent = 'Geen bereik' + (n ? ' · ' + n + ' wacht op verzenden' : ''); el.className = 'text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-900'; }
  else if (n) { el.textContent = n + ' wacht op verzenden'; el.className = 'text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-900'; }
  else { el.textContent = ''; el.className = 'hidden'; }
}
async function voerUit(it){
  const { actie, tabel, a, b } = it;
  if (tabel === 'diensten' && (actie === 'insert' || actie === 'update')) {
    const obj = actie === 'insert' ? a : b, id = actie === 'insert' ? a.id : a;
    const { tarief, ...rest } = obj || {};
    if (actie === 'insert') await sbREST('/rest/v1/diensten', { method: 'POST', prefer: 'return=minimal', body: rest });
    else await sbREST('/rest/v1/diensten?id=eq.' + encodeURIComponent(id), { method: 'PATCH', prefer: 'return=minimal', body: rest });
    if (tarief !== undefined && tarief !== null && isBeheer()) {
      await sbREST('/rest/v1/diensten_tarief', { method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal', body: { dienstId: id, tarief: Number(tarief) || 0 } });
    }
    return;
  }
  if (actie === 'insert') await sbREST('/rest/v1/' + tabel, { method: 'POST', prefer: 'return=minimal', body: a });
  else if (actie === 'update') await sbREST('/rest/v1/' + tabel + '?id=eq.' + encodeURIComponent(a), { method: 'PATCH', prefer: 'return=minimal', body: b });
  else if (actie === 'remove') await sbREST('/rest/v1/' + tabel + '?id=eq.' + encodeURIComponent(a), { method: 'DELETE', prefer: 'return=minimal' });
}
async function verwerkWachtrij(){
  if (CONFIG.MODE !== 'supabase' || wachtrijBezig) return;
  wachtrijBezig = true;
  try {
    for (;;) {
      const w = wachtrijLees(); if (!w.length) break;
      if (!AUTH_TOKEN) { const ok = await sbVernieuw(); if (!ok) break; }
      try { await voerUit(w[0]) }
      catch (e) {
        const netwerk = e instanceof TypeError || (typeof navigator !== 'undefined' && navigator.onLine === false);
        if (netwerk) break;
        toast('Niet opgeslagen in de database: ' + e.message, 'error');   // bijv. geen rechten: niet blijven proberen
      }
      const rest = wachtrijLees(); rest.shift(); wachtrijSchrijf(rest);
    }
  } catch (e) { /* netwerkfout: later opnieuw */ }
  wachtrijBezig = false;
  toonNetStatus();
  if (!wachtrijLees().length && startteOffline && navigator.onLine !== false) {
    startteOffline = false;
    try { await laadAlles(); cacheBewaar(); renderCurrentView(); toast('Weer online: gegevens bijgewerkt', 'success') } catch (e) { startteOffline = true }
  }
}
function verstuur(actie, tabel, a, b){
  if (CONFIG.MODE !== 'supabase') return;
  const w = wachtrijLees(); w.push({ actie, tabel, a, b }); wachtrijSchrijf(w);
  cacheBewaar();
  verwerkWachtrij();
}
window.addEventListener('online', () => { toonNetStatus(); verwerkWachtrij() });
window.addEventListener('offline', toonNetStatus);
setInterval(() => { if (wachtrijLees().length) verwerkWachtrij() }, 30000);
// ---- Automatisch bijwerken: bij wisselen van tabblad, terugkomen in het venster en elke minuut ----
// Haalt de nieuwste gegevens op de achtergrond op (hooguit eens per 20 seconden) en tekent het scherm
// alleen opnieuw als er iets veranderd is en je niet midden in het invullen of bewerken zit.
let LAATST_GELADEN=Date.now(),VERVERS_BEZIG=false;
function magHerteken(){
  if(document.querySelector('#fMail,#klusWijzig,#klusNotitie,#orderEditor,#keurEditor,#planKopie,#pEditor,#fNieuwM,#fBedrijfM,#klantEditor,#matEditor,#matBulk,#fotoModal,#mtsGegM,#wnEditor,#vrKeuze,#perceelEditor,#scanKeuze,#dieselM'))return false;
  const a=document.activeElement;
  if(a&&a!==document.body&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('main')&&$('main').contains(a))return false;
  if(currentMode==='medewerker'&&currentView==='invoer')return false;
  if(currentMode==='beheer'&&currentBeheerTab==='facturen'&&typeof FACT_OPEN!=='undefined'&&FACT_OPEN){const f=DB.get('facturen',FACT_OPEN);if(f&&f.status==='concept')return false}
  if(currentMode==='beheer'&&currentBeheerTab==='planning')return false;
  if(currentMode==='beheer'&&currentBeheerTab==='mts'&&MTS_OPEN)return false;
  if(currentMode==='beheer'&&currentBeheerTab==='kaart')return false;
  if(currentMode==='beheer'&&currentBeheerTab==='scans')return false;   // niet storen tijdens het sorteren   // kaart niet opnieuw opbouwen (inzoomen blijft staan)
  return true;
}
async function verversAchtergrond(reden){
  if(CONFIG.MODE!=='supabase'||!SESSIE||VERVERS_BEZIG||navigator.onLine===false||document.hidden)return;
  if(reden!=='forceer'&&Date.now()-LAATST_GELADEN<20000)return;
  VERVERS_BEZIG=true;
  try{
    if(wachtrijLees().length){await verwerkWachtrij();if(wachtrijLees().length)return}   // eerst eigen wijzigingen versturen
    const voor=JSON.stringify(CACHE);
    await laadAlles();
    LAATST_GELADEN=Date.now();
    if(JSON.stringify(CACHE)!==voor){cacheBewaar();if(magHerteken()){const y=window.scrollY;renderCurrentView();try{window.scrollTo(0,y)}catch(e){}}}
  }catch(e){}
  finally{VERVERS_BEZIG=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)verversAchtergrond('terug')});
window.addEventListener('focus',()=>verversAchtergrond('terug'));
setInterval(()=>verversAchtergrond('interval'),60000);

async function laadAlles(){
  // Eerst versturen wat nog op het toestel wacht, anders overschrijft het laden die wijzigingen.
  if (!startteOffline) await verwerkWachtrij();
  // Supabase geeft standaard maximaal 1000 rijen per verzoek; daarom per pagina ophalen.
  for (const t of TABELLEN) {
    let alles = [], van = 0;
    for (;;) {
      const rijen = await sbREST('/rest/v1/' + t + '?select=*&order=id.asc&limit=1000&offset=' + van);
      if (!Array.isArray(rijen)) break;
      alles = alles.concat(rijen);
      if (rijen.length < 1000) break;
      van += 1000;
    }
    CACHE[t] = alles;
  }
  // Materieel (kentekens): mag ontbreken zolang de tabel nog niet is aangemaakt.
  try {
    const m = await sbREST('/rest/v1/materieel?select=*&order=kenteken.asc&limit=1000');
    CACHE.materieel = Array.isArray(m) ? m : [];
  } catch (e) { CACHE.materieel = CACHE.materieel || [] }
  // Account voor Mts. Wempe: alleen de eigen facturen en gegevens
  if (isMts()) {
    for (const t of ['facturen_mts', 'instellingen']) { try { const o = await sbREST('/rest/v1/' + t + '?select=*&limit=1000'); CACHE[t] = Array.isArray(o) ? o : [] } catch (e) { CACHE[t] = CACHE[t] || [] } }
  }
  // Orders (verzamelorders): alleen beheer; mag ontbreken zolang de tabel nog niet is aangemaakt.
  if (isBeheer()) {
    try {
      const o = await sbREST('/rest/v1/orders?select=*&order=ordernr.asc&limit=1000');
      CACHE.orders = Array.isArray(o) ? o : [];
    } catch (e) { CACHE.orders = CACHE.orders || [] }
  }
  // Planning-archief en vervaldata: alleen beheer; mogen ontbreken zolang de tabellen niet zijn aangemaakt.
  if (isBeheer()) {
    for (const t of ['planningen', 'vervaldata', 'klus_notities', 'producten', 'facturen', 'facturen_mts', 'instellingen', 'factuur_teller']) {
      try {
        const o = await sbREST('/rest/v1/' + t + '?select=*&limit=1000');
        CACHE[t] = Array.isArray(o) ? (t === 'factuur_teller' ? o.map(x => Object.assign({}, x, { id: String(x.id) })) : o) : [];
      } catch (e) { CACHE[t] = CACHE[t] || [] }
    }
  }
  // Vrachten uit eVDM (alleen beheer; tabel mag nog ontbreken)
  if (isBeheer()) { try { await laadVrachten() } catch (e) { CACHE.vrachten = CACHE.vrachten || [] } }
  if (isBeheer()) { try { await laadTol() } catch (e) { CACHE.tolposten = CACHE.tolposten || [] } }   // tabel mag nog ontbreken
  if (isBeheer()) {
    try { const o = await sbREST('/rest/v1/scans?select=*&order=ontvangen_op.desc&limit=2000'); CACHE.scans = Array.isArray(o) ? o : [] } catch (e) { CACHE.scans = CACHE.scans || [] }
    for (const t of ['percelen', 'geocache']) { try { const o = await sbREST('/rest/v1/' + t + '?select=*&limit=5000'); CACHE[t] = Array.isArray(o) ? (t === 'geocache' ? o.map(x => Object.assign({}, x, { id: x.adres })) : o) : [] } catch (e) { CACHE[t] = CACHE[t] || [] } }
  }
  // Tarieven staan in een aparte tabel die alleen de beheerder mag lezen.
  if (isBeheer()) {
    try {
      const tr = await sbREST('/rest/v1/diensten_tarief?select=*&limit=1000');
      const m = {}; (tr || []).forEach(x => m[x.dienstId] = Number(x.tarief));
      (CACHE.diensten || []).forEach(d => { d.tarief = d.id in m ? m[d.id] : 35 });
    } catch (e) { (CACHE.diensten || []).forEach(d => { if (d.tarief == null) d.tarief = 35 }) }
  }
  cacheBewaar();
}

  const s = document.getElementById('loginScreen');
  if (!s) return;
  s.innerHTML = '';

  // het hele scherm (fixed inset-0), dus een lege laag dekt de app alsnog af.
  s.classList.add('hidden');
  s.style.display = 'none';

async function inloggen(gebruiker, wachtwoord){
  if (!gebruiker || !wachtwoord) throw new Error('Vul je gebruikersnaam en wachtwoord in');
  if (CONFIG.MODE === 'local') {
    const acc = accounts().find(a => a.gebruikersnaam.toLowerCase() === String(gebruiker).trim().toLowerCase());
    if (!acc || acc.wachtwoordHash !== hashWachtwoord(wachtwoord)) throw new Error('Onbekende gebruikersnaam of verkeerd wachtwoord');
    if (acc.actief === false) throw new Error('Dit account is gedeactiveerd');
    SESSIE = { id: acc.id, naam: acc.naam, rol: acc.rol, werknemer_id: acc.werknemer_id || '', gebruikersnaam: acc.gebruikersnaam };
  } else {
    const user = await sbLogin(gebruiker, wachtwoord);
    const profiel = await sbProfiel(user.id);
    if (!profiel) throw new Error('Dit account heeft nog geen profiel. Vraag de beheerder om toegang.');
    if (profiel.actief === false) throw new Error('Dit account is gedeactiveerd');
    const gn = String(gebruiker).trim().toLowerCase();
    SESSIE = { id: user.id, naam: profiel.naam || gn, rol: profiel.rol || 'medewerker', werknemer_id: profiel.werknemer_id || '', gebruikersnaam: gn };
    toast('Gegevens laden…', 'info');
    await laadAlles();
  }
  localStorage.setItem('uren_sessie', JSON.stringify(SESSIE));
  verbergLogin();
  startApp();
}
async function uitloggen(){
  if (CONFIG.MODE === 'supabase') await sbUitloggen();
  SESSIE = null;
  localStorage.removeItem('uren_sessie');
  localStorage.removeItem('uren_concept');
  location.reload();
}

// ---- bestaande sessie hervatten (supabase) ----
async function hervatSessie(){
  const bewaard=JSON.parse(localStorage.getItem('uren_auth')||'null');
  if(!bewaard||!bewaard.r){ toonLogin(); return }
  try{
    if(!AUTH_TOKEN){ const ok=await sbVernieuw(); if(!ok){ toonLogin(); return } }
    const u=await sbREST('/auth/v1/user');
    if(!u||!u.id){ toonLogin(); return }
    const profiel=await sbProfiel(u.id);
    if(!profiel||profiel.actief===false){ toonLogin(); return }
    SESSIE={id:u.id,naam:profiel.naam||u.email,rol:profiel.rol||'medewerker',werknemer_id:profiel.werknemer_id||'',gebruikersnaam:u.email};
    await laadAlles();
    verbergLogin();
    startApp();
  }catch(e){
    // Geen verbinding: werk met de laatst opgeslagen gegevens op dit toestel.
    const netwerk = e instanceof TypeError || navigator.onLine === false;
    let snap = null, sess = null;
    try { snap = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); sess = JSON.parse(localStorage.getItem('uren_sessie') || 'null') } catch (x) {}
    if (netwerk && snap && sess && snap.gebruiker === sess.id && snap.data) {
      SESSIE = sess; Object.keys(snap.data).forEach(t => { CACHE[t] = snap.data[t] });
      startteOffline = true;
      verbergLogin(); startApp();
      toast('Geen bereik: je werkt met de laatst opgehaalde gegevens. Wat je invult wordt verstuurd zodra er weer bereik is.', 'info');
      toonNetStatus();
    } else toonLogin();
  }
}

async function apiAccounts(payload){
  await zorgVoorToken();
  const r = await fetch('/api/admin-users', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN },
    body: JSON.stringify(payload)
  });
  let d = null;
  try { d = await r.json() } catch (e) { d = null }
  if (!r.ok) throw new Error((d && (d.fout || d.message)) || 'Actie mislukt (' + r.status + ')');
  return d;
}

async function accountAanmaken(d){
  if (CONFIG.MODE === 'local') {
    const a = accounts();
    if (a.some(x => x.gebruikersnaam.toLowerCase() === d.gebruikersnaam.toLowerCase())) throw new Error('Die gebruikersnaam bestaat al');
    a.push({ id: uid(), gebruikersnaam: d.gebruikersnaam, naam: d.naam, rol: d.rol, werknemer_id: d.werknemer_id, actief: true, wachtwoordHash: hashWachtwoord(d.wachtwoord) });
    bewaarAccounts(a);
  } else {
    await apiAccounts(Object.assign({ actie: 'create' }, d));
  }
}

    </td></tr>`).join('');
  body.querySelectorAll('[data-acc-reset]').forEach(b => b.onclick = async () => {
    const nieuw = prompt('Nieuw wachtwoord (min. 6 tekens):');

// Na elke render de rolregels toepassen (medewerker = alleen eigen uren)
function naRender(){ try{pasRolToe()}catch(e){} }
// Terugknop van de browser: elke pagina (tabblad) krijgt een eigen plek in de browsergeschiedenis.
const BEHEER_TABS=['dashboard','klussen','facturen','producten','mts','vrachten','tol','kaart','scans','orders','klanten','diensten','materieel','keuringen','werknemers','planning','planarchief','uren','export','accounts'];
const BEHEER_ALLEEN=['accounts','orders','planarchief','keuringen','facturen','producten','mts','vrachten','tol','kaart','scans'];
function navStaat(){return {m:currentMode,v:currentView,t:currentBeheerTab}}
function navPush(vervang){
  try{
    const st=navStaat(),h='#/'+(st.m==='beheer'?'beheer/'+st.t:'medewerker/'+st.v),o=history.state;
    if(vervang||!o){history.replaceState(st,'',h);return}
    if(o.m===st.m&&o.v===st.v&&o.t===st.t)return;
    history.pushState(st,'',h);
  }catch(e){}
}
function zetTabMarkering(){document.querySelectorAll('.tab-btn').forEach(b=>{const a=b.dataset.tab===currentBeheerTab;b.classList.toggle('border-emerald-600',a);b.classList.toggle('text-emerald-700',a);b.classList.toggle('border-transparent',!a)})}
window.addEventListener('popstate',e=>{
  const st=e.state;if(!st||!SESSIE)return;
  if(st.m==='beheer'&&(!isBeheer()||(BEHEER_ALLEEN.includes(st.t)&&!isBeheer())))return;
  currentMode=st.m==='beheer'?'beheer':'medewerker';currentView=st.v||'invoer';currentBeheerTab=st.t||'dashboard';
  const mt=$('modeToggle');if(mt)mt.value=currentMode;
  renderBottomNav();renderCurrentView();zetNav(currentView);zetTabMarkering();
});
function switchView(view){currentView=view;navPush();renderCurrentView();verversAchtergrond('tab')}
function switchTab(tab){
  if(isMts())tab='mts';
  if(BEHEER_ALLEEN.includes(tab)&&!isBeheer()&&!(tab==='mts'&&isMts())){toast('Alleen voor beheerders','error');return}
  // Een beheertabblad aanklikken betekent ook echt naar de beheermodus.
  currentMode='beheer';
  const mt=$('modeToggle');if(mt)mt.value='beheer';
  currentBeheerTab=tab;
  navPush();
  renderBottomNav();
  renderCurrentView();
  zetTabMarkering();
  verversAchtergrond('tab');
}

// === PWA ===
function initPWA(){
  try{
    const manifest={name:'Wempe op Pad',short_name:'Wempe op Pad',start_url:'.',display:'standalone',theme_color:'#2f6b45',background_color:'#ffffff',icons:[{src:location.origin+'/icon-192.png',sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:location.origin+'/icon-512.png',sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
    const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(blob);document.head.appendChild(link);
    // Service worker
    const swCode=`const CACHE='uren-v1';self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.add('/')))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`;
    const swBlob=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker?.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }catch(e){console.log('PWA registration skipped:',e.message)}
}

function bindChrome(){
  $('modeToggle').onchange=e=>{currentMode=e.target.value;navPush();renderBottomNav();renderCurrentView();zetTabMarkering()};
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{switchView(b.dataset.view);document.querySelectorAll('[data-view]').forEach(x=>{x.classList.toggle('text-emerald-700',x.dataset.view===currentView);x.classList.toggle('text-gray-500',x.dataset.view!==currentView)})});
  document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='facturen')FACT_OPEN=null;if(b.dataset.tab==='klanten')KLANT_OPEN=null;switchTab(b.dataset.tab)});
  const uit=$('logoutBtn');
  if(uit)uit.onclick=()=>{ if(confirm('Weet je zeker dat je wilt uitloggen?')) uitloggen() };
}
function startApp(){
  // Beheerder begint in het dashboard, medewerker in de invoer.
  currentMode=isBeheer()?'beheer':'medewerker';
  // Na een verversing terug naar de pagina waar je was (staat in het adres, bijv. #/beheer/klussen).
  const mh=/^#\/(beheer|medewerker)\/([\w-]+)/.exec(location.hash||'');
  if(mh){
    if(mh[1]==='beheer'&&isBeheer()&&BEHEER_TABS.includes(mh[2])){currentMode='beheer';currentBeheerTab=mh[2]}
    else if(mh[1]==='medewerker'&&['invoer','mijnuren'].includes(mh[2])){currentMode='medewerker';currentView=mh[2]}
  }
  const mt=$('modeToggle');if(mt)mt.value=currentMode;
  renderBottomNav();
  naRender();
  renderCurrentView();
  zetNav(currentView);zetTabMarkering();
  navPush(true);
}

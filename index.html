// === DB LAYER ===
const LS_DB={
  _k:prefix=>'uren_'+prefix,
  list(t){return JSON.parse(localStorage.getItem(this._k(t))||'[]')},
  get(t,id){return this.list(t).find(r=>r.id===id)},
  insert(t,o){if(!o.id)o.id=uid();const r=this.list(t);r.push(o);localStorage.setItem(this._k(t),JSON.stringify(r));return o},
  update(t,id,o){const r=this.list(t);const i=r.findIndex(x=>x.id===id);if(i>=0)r[i]={...o,id};localStorage.setItem(this._k(t),JSON.stringify(r));return r[i]},
  remove(t,id){const r=this.list(t).filter(x=>x.id!==id);localStorage.setItem(this._k(t),JSON.stringify(r));return r}
};
const SB_DB={
  async list(t){const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${t}`,{headers:{'apikey':CONFIG.SUPABASE_ANON_KEY,'Authorization':`Bearer ${CONFIG.SUPABASE_ANON_KEY}`,'Content-Type':'application/json'}});return r.json()},
  async get(t,id){const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${t}?id=eq.${id}`,{headers:{'apikey':CONFIG.SUPABASE_ANON_KEY,'Authorization':`Bearer ${CONFIG.SUPABASE_ANON_KEY}`}});return (await r.json())[0]},
  async insert(t,o){if(!o.id)o.id=uid();const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${t}`,{method:'POST',headers:{'apikey':CONFIG.SUPABASE_ANON_KEY,'Authorization':`Bearer ${CONFIG.SUPABASE_ANON_KEY}`,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(o)});return r.json()},
  async update(t,id,o){const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${t}?id=eq.${id}`,{method:'PATCH',headers:{'apikey':CONFIG.SUPABASE_ANON_KEY,'Authorization':`Bearer ${CONFIG.SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(o)});return r.json()},
  async remove(t,id){await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${t}?id=eq.${id}`,{method:'DELETE',headers:{'apikey':CONFIG.SUPABASE_ANON_KEY,'Authorization':`Bearer ${CONFIG.SUPABASE_ANON_KEY}`}})}
};
// De keuze gebeurt pas bij gebruik: CACHE_DB wordt verderop in dit bestand
// gedefinieerd en bestaat hier nog niet.
const DB={
  _b(){return CONFIG.MODE==='supabase'?CACHE_DB:LS_DB},
  list(t){return this._b().list(t)},
  get(t,id){return this._b().get(t,id)},
  insert(t,o){return this._b().insert(t,o)},
  update(t,id,o){return this._b().update(t,id,o)},
  remove(t,id){return this._b().remove(t,id)}
};

// === MIGRATIE: adres + postcode toevoegen aan bestaande klanten (behoudt ingevoerde data) ===
function migrateKlanten(){
  const adressen={
    'Loonbedrijf Van Dijk':['Havenweg 12','1043 AB','Amsterdam'],
    'Melkveebedrijf De Vries':['Zuiderdijk 84','1509 GH','Zaandam'],
    'Gemeente Waadhoeke':['Harlingerstraatweg 113','8801 PX','Franeker'],
    'Gemeente Waadfaeke':['Harlingerstraatweg 113','8801 PX','Franeker'],
    'Aannemersbedrijf Postma':['Friesestraat 47','8911 BZ','Leeuwarden'],
    'Akkerbouw Havinga':['Oude Nijeveenseweg 8','8441 PL','Heerenveen'],
    'Zuivelboerderij Nicolai':['Hemdijk 25','8601 XX','Sneek']
  };
  DB.list('klanten').forEach(k=>{
    const fix=adressen[k.naam];let nieuw=false;
    if(fix){if(!k.adres){k.adres=fix[0];nieuw=true}if(!k.postcode){k.postcode=fix[1];nieuw=true}if(!k.plaats){k.plaats=fix[2];nieuw=true}}
    if(k.naam==='Gemeente Waadfaeke'){k.naam='Gemeente Waadhoeke';nieuw=true}
    if(nieuw)DB.update('klanten',k.id,{...k});
  });
}

// === MIGRATIE: oude voorbeelddata naar recente datums schuiven ===
// Alleen wanneer ALLE dagstaten ouder zijn dan 60 dagen (dus ongebruikte seed-data),
// zodat echte invoer van de gebruiker nooit wordt aangeraakt.
function migrateDagstaten(){
  if(localStorage.getItem('uren_dates_shifted'))return;
  const rows=DB.list('dagstaten');if(!rows.length){localStorage.setItem('uren_dates_shifted','1');return}
  const vandaag=new Date();vandaag.setHours(0,0,0,0);
  const nieuwste=rows.map(r=>r.datum).sort().pop();
  const dagen=(vandaag-new Date(nieuwste+'T00:00:00'))/86400000;
  if(dagen<=60){localStorage.setItem('uren_dates_shifted','1');return}
  const verschuif=Math.floor(dagen)-1;
  rows.forEach(r=>{const d=new Date(r.datum+'T00:00:00');d.setDate(d.getDate()+verschuif);DB.update('dagstaten',r.id,{...r,datum:iso(d)})});
  localStorage.setItem('uren_dates_shifted','1');
}

function migrateFacturatie(){
  DB.list('dagstaten').forEach(d=>{

      if(typeof k.gefactureerd!=='boolean'||typeof k.wegenMonsteren!=='boolean'){

// Thema's: licht -> donker -> roze -> licht (per toestel onthouden)
const THEMAS=['licht','donker','roze'];
function zetThema(t){
  const h=document.documentElement;
  h.classList.toggle('dark',t==='donker');h.classList.toggle('roze',t==='roze');
  try{localStorage.setItem('uren_thema',t);localStorage.setItem('uren_dark',t==='donker'?'1':'0')}catch(e){}

  const knop=$('darkToggle');if(knop){knop.textContent=volgende.charAt(0).toUpperCase()+volgende.slice(1);knop.setAttribute('aria-label','Wissel naar thema '+volgende)}
  const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.setAttribute('content',t==='roze'?'#db2777':t==='donker'?'#111827':'#000000');
}
function initDarkMode(){
  let t='licht';
  try{t=localStorage.getItem('uren_thema')||(localStorage.getItem('uren_dark')==='1'?'donker':'licht')}catch(e){}
  if(!THEMAS.includes(t))t='licht';
  zetThema(t);
  $('darkToggle').onclick=()=>{
    const nu=document.documentElement.classList.contains('dark')?'donker':document.documentElement.classList.contains('roze')?'roze':'licht';
    zetThema(THEMAS[(THEMAS.indexOf(nu)+1)%THEMAS.length]);

// === FOTO'S BIJ EEN KLUS (weegbon, schade, ...) ===
// Opslag in een besloten Supabase Storage-bucket "bijlagen"; in de klus staat alleen het pad.
function fotoVerkleinen(file){
  return new Promise((ok,nok)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1400,f=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*f);c.height=Math.round(img.height*f);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(b=>b?ok(b):nok(new Error('Foto verkleinen mislukt')),'image/jpeg',0.72);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);nok(new Error('Dit bestand is geen foto'))};
    img.src=url;
  });
}
async function fotoUpload(file,werknemerId,klusId){
  if(CONFIG.MODE!=='supabase')throw new Error('Foto\'s werken alleen met de database (niet in demo-modus)');
  if(navigator.onLine===false)throw new Error('Geen bereik: voeg de foto toe zodra je weer internet hebt');
  await zorgVoorToken();
  const blob=await fotoVerkleinen(file);
  const pad=(werknemerId||'x')+'/'+klusId+'-'+Date.now().toString(36)+'.jpg';
  const r=await fetch(CONFIG.SUPABASE_URL+'/storage/v1/object/bijlagen/'+pad.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+AUTH_TOKEN,'Content-Type':'image/jpeg'},body:blob});
  if(!r.ok){let m='Uploaden mislukt';try{const j=await r.json();m=j.message||j.error||m}catch(e){}throw new Error(m)}
  return pad;
}
async function fotoUrl(pad){
  await zorgVoorToken();
  const r=await fetch(CONFIG.SUPABASE_URL+'/storage/v1/object/sign/bijlagen/'+pad.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+AUTH_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});
  const j=await r.json();if(!r.ok||!j.signedURL)throw new Error('Foto niet beschikbaar');
  return CONFIG.SUPABASE_URL+'/storage/v1'+j.signedURL;
}

}

        const exact=DB.list('klanten').find(x=>x.naam.toLowerCase()===t);
        hi.value=exact?exact.id:'';
        toonAdres(hi.value);klantResultaat(k.id);saveConcept();
      };
      zo.onfocus=()=>{zo.select();klantResultaat(k.id)};
      bx.onmousedown=e=>{
        const b=e.target.closest('[data-pick]');if(!b)return;
        e.preventDefault();
        const kk=DB.get('klanten',b.dataset.pick);
        hi.value=b.dataset.pick;zo.value=kk?kk.naam:'';
        toonAdres(b.dataset.pick);bx.classList.add('hidden');saveConcept();
      };
    });
    if(!document.body.dataset.klBuiten){
      document.body.dataset.klBuiten='1';
      document.addEventListener('mousedown',e=>{
        if(e.target.closest('[id^="kres_"]')||e.target.closest('[id^="kzoek_"]'))return;
        document.querySelectorAll('[id^="kres_"]').forEach(b=>b.classList.add('hidden'));
      });
    }
  }
  const naarMin=t=>{const [u,m]=String(t).split(':').map(Number);return u*60+m};
  const klusTijdRekenen=kid=>{
    const s=$('kbeg_'+kid),e=$('keind_'+kid),hint=$('khint_'+kid);if(!s||!e)return;
    if(!s.value||!e.value){if(hint)hint.textContent='Vul start en eind in, dan wordt het aantal uren automatisch berekend.';return}
    let m=naarMin(e.value)-naarMin(s.value);let nacht=false;
    if(m<0){m+=1440;nacht=true}
    if(m===0){if(hint)hint.textContent='Start en eind zijn gelijk.';return}
    const uren=Math.round(m/60*100)/100;
    $('aant_'+kid).value=uren;if($('een_'+kid))$('een_'+kid).value='uur';
    if(hint)hint.textContent='Berekend: '+fmtNum(uren)+' uur ('+Math.floor(m/60)+' u '+String(m%60).padStart(2,'0')+' min)'+(nacht?', over middernacht':'');
  };
  $('main').oninput=e=>{if(e.target.id&&(e.target.id.startsWith('kbeg_')||e.target.id.startsWith('keind_'))){klusTijdRekenen(e.target.id.slice(e.target.id.indexOf('_')+1));saveConcept();calcAndRender();return}
    if(['inDatum','inMedew','inStart','inEind','inPauze'].includes(e.target.id)){saveConcept();calcAndRender()}if(e.target.id.startsWith('klant_')||e.target.id.startsWith('dienst_')||e.target.id.startsWith('ket_')||e.target.id.startsWith('oms_')||e.target.id.startsWith('aant_')||e.target.id.startsWith('een_')){saveConcept();calcAndRender()}};
  $('main').onchange=async e=>{
    if(e.target.id&&e.target.id.startsWith('foto_')){
      const kid=e.target.id.slice(5),f=e.target.files&&e.target.files[0];if(!f)return;
      toast('Foto uploaden…','info');
      try{
        const wId=($('inMedew')&&$('inMedew').value)||(SESSIE&&SESSIE.werknemer_id)||'';
        const pad=await fotoUpload(f,wId,kid);
        ds.klussen=getKlussen().map(k=>k.id===kid?{...k,fotos:[...(k.fotos||[]),pad]}:k);
        saveConcept();renderKlussen();calcAndRender();toast('Foto toegevoegd','success');
      }catch(err){toast(err.message,'error')}
      return;
    }
    saveConcept();calcAndRender();
  };
  $('main').onclick=e=>{
    if(e.target.dataset.pauze!==undefined){$('inPauze').value=e.target.dataset.pauze;saveConcept();calcAndRender()}
    if(e.target.dataset.rmFoto){const [kid,fi]=e.target.dataset.rmFoto.split('|');ds.klussen=getKlussen().map(k=>k.id===kid?{...k,fotos:(k.fotos||[]).filter((_,i)=>i!==+fi)}:k);saveConcept();renderKlussen();return}
    if(e.target.dataset.removeKlus){ds.klussen=ds.klussen.filter(k=>k.id!==e.target.dataset.removeKlus);saveConcept();renderKlussen();calcAndRender()}
    if(e.target.id==='btnAnnuleerWijzig'){localStorage.removeItem('uren_concept');gaNaarMijnUren();return}
    if(e.target.id==='btnAddKlus'){ds.klussen.push({id:uid(),klantId:'',dienstId:(diensten[0]?diensten[0].id:''),kenteken:'',omschrijving:'',aantal:1,eenheid:'uur',gefactureerd:false,factuurdatum:'',wegenMonsteren:false});saveConcept();renderKlussen()}
    if(e.target.id==='btnSubmit'){
      // Alles uit het formulier lezen: ds is alleen de beginwaarde, niet de invoer.
      const wId=$('inMedew').value,datum=$('inDatum').value,st=$('inStart').value,et=$('inEind').value,pauze=(+$('inPauze').value)||0;
      const w=werknemers.find(x=>x.id===wId);if(!w){toast('Kies een medewerker','error');return}
      if(!datum){toast('Kies een datum','error');return}
      const klussen=getKlussen();
      if(klussen.length===0){toast('Voeg minstens 1 klus toe','error');return}
      if(klussen.some(k=>!k.klantId)){toast('Kies bij elke klus een klant','error');return}
      if(!st||!et||st>=et){toast('Eindtijd moet na starttijd zijn','error');return}
      const bestaat=DB.list('dagstaten').some(d=>d.medewerkerId===wId&&d.datum===datum&&d.id!==ds.editId);
      if(bestaat&&!confirm('Er staat al een dagstaat voor deze medewerker op '+datum+'. Toch doorgaan?'))return;
      const nettoDag=Math.max(0,calcBruto(st,et)-pauze/60);
      // Controle op de invoer: waarschuwen, niet blokkeren (een lange dag kan kloppen).
      const waarsch=[];
      const vandaag=new Date();vandaag.setHours(12,0,0,0);
      const dagVerschil=Math.round((new Date(datum+'T12:00:00')-vandaag)/86400000);
      if(dagVerschil>0)waarsch.push('De datum ligt in de toekomst ('+datum+').');
      if(dagVerschil<-7)waarsch.push('De datum ligt meer dan een week terug ('+datum+').');
      if(nettoDag>14)waarsch.push('Je werkdag is '+nettoDag.toFixed(1)+' uur netto. Dat is erg lang.');
      if(calcBruto(st,et)>6&&pauze===0)waarsch.push('Je hebt geen pauze ingevuld bij een dag van meer dan 6 uur.');
      if(klussen.some(k=>!(Number(k.aantal)>0)))waarsch.push('Bij een klus staat geen aantal ingevuld (of 0).');
      const metTijd=klussen.filter(k=>k.startTijd&&k.eindTijd);
      if(metTijd.some(k=>k.startTijd<st||k.eindTijd>et))waarsch.push('Een klus valt (deels) buiten je werkdag ('+st+' - '+et+').');
      const gesorteerd=metTijd.filter(k=>k.startTijd<k.eindTijd).sort((a,b)=>a.startTijd<b.startTijd?-1:1);
      if(gesorteerd.some((k,i)=>i>0&&k.startTijd<gesorteerd[i-1].eindTijd))waarsch.push('Twee klussen overlappen elkaar in tijd.');
      if(klussen.every(k=>(k.eenheid||'uur')==='uur')){const som=klussen.reduce((s,k)=>s+(Number(k.aantal)||0),0);if(Math.abs(som-nettoDag)>0.5)waarsch.push('Je klussen tellen op tot '+som.toFixed(1)+' uur, maar je werkdag is '+nettoDag.toFixed(1)+' uur netto.')}
      if(waarsch.length&&!confirm('Controleer even:\n\n- '+waarsch.join('\n- ')+'\n\nToch opslaan?'))return;
      if(ds.editId){
        const oud=DB.get('dagstaten',ds.editId);
        if(!oud){toast('Deze dagstaat bestaat niet meer','error');localStorage.removeItem('uren_concept');renderInvoer();return}
        if(oud.status==='verwerkt'){toast('Deze dag is al verwerkt en kan niet meer gewijzigd worden','error');return}
        if(oud.status==='goedgekeurd'&&!confirm('Deze werkdag was al goedgekeurd. Na je wijziging moet de beheerder hem opnieuw goedkeuren. Doorgaan?'))return;
        DB.update('dagstaten',ds.editId,{...oud,datum,startTime:st,endTime:et,pauzeMin:pauze,nettoUren:+nettoDag.toFixed(1),status:'in_afwachting',klussen:klussen.map(k=>({...k}))});
        localStorage.removeItem('uren_concept');
        toast('Wijziging opgeslagen','success');
        gaNaarMijnUren();
        return;
      }
      const dag={id:uid(),medewerkerId:wId,medewerkerNaam:w.naam,datum,startTime:st,endTime:et,pauzeMin:pauze,nettoUren:+nettoDag.toFixed(1),status:'in_afwachting',klussen:klussen.map(k=>({...k,gefactureerd:false,factuurdatum:''}))};
      DB.insert('dagstaten',dag);
      localStorage.removeItem('uren_concept');
      toast('Werkdag ingediend!','success');
      renderInvoer();
    }
  };
  // Datalist for kenteken suggestions
  const existing=DB.list('dagstaten').flatMap(d=>d.klussen.filter(k=>k.kenteken).map(k=>k.kenteken));
  const unique=[...new Set(existing)];
  const mat=DB.list('materieel').filter(m=>m.actief!==false).sort((a,b)=>(a.kenteken||'').localeCompare(b.kenteken||''));
  const matSet=new Set(mat.map(m=>(m.kenteken||'').toUpperCase()));
  const opties=mat.map(m=>`<option value="${esc(m.kenteken)}">${esc(m.omschrijving||'')}</option>`).join('')+unique.filter(k=>!matSet.has(String(k).toUpperCase())).map(k=>`<option value="${esc(k)}"></option>`).join('');
  if(opties)$('main').insertAdjacentHTML('beforeend',`<datalist id="ddKenteken">${opties}</datalist>`);
  renderKlussen();calcAndRender();
}

function calcBruto(st,et){
  if(!st||!et)return 0;
  const [sh,sm]=st.split(':').map(Number),[eh,em]=et.split(':').map(Number);
  return(Math.max(0,(eh*60+em)-(sh*60+sm)))/60;
}

function renderDagKaart(d){

  return`<div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-4 border border-gray-100 dark:border-gray-700"><div class="flex justify-between items-center"><div><span class="font-semibold">${esc(d.medewerkerNaam)}</span> <span class="text-gray-400 text-sm">${d.datum}</span></div><span class="badge ${badgeClass}">${statusLabel}</span></div>
  <div class="mt-2 text-sm text-gray-600 dark:text-gray-300">${d.startTime} – ${d.endTime} · pauze ${d.pauzeMin}m · <strong>${fmtNum(d.nettoUren)}u netto</strong> · ${totalKlussen} klus${totalKlussen!==1?'sen':''}</div>

  <div id="muDet_${d.id}" class="hidden mt-3 space-y-2 border-t border-gray-100 dark:border-gray-700 pt-3">${d.klussen.map(k=>{const kd=DB.get('klanten',k.klantId);const dd=DB.get('diensten',k.dienstId);return`<div class="text-sm bg-gray-50 dark:bg-gray-700 rounded-lg p-2"><div class="font-medium text-gray-800 dark:text-gray-100">${kd?esc(kd.naam):'Onbekend'}</div>${kd&&klantAdres(kd)?`<div class="text-xs text-gray-500 dark:text-gray-400">${esc(klantAdres(kd))}</div>`:''}<div class="text-xs text-gray-500 dark:text-gray-400 mt-1">${dd?esc(dd.naam):'Onbekend'} · ${esc(k.kenteken||'—')} · ${esc(k.omschrijving||'—')} · ${k.startTijd&&k.eindTijd?esc(k.startTijd)+'-'+esc(k.eindTijd)+' · ':''}${k.aantal} ${esc(k.eenheid||'uur')}</div>${k.wegenMonsteren?'<div class="text-xs mt-1"><span class="px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 font-medium">Wegen monsteren</span></div>':''}${fotoKnop(k)?'<div class="mt-1">'+fotoKnop(k)+'</div>':''}</div>`}).join('')}</div></div>`;
}

function getDashFilter(){

// Geeft {start,end} (jjjj-mm-dd) voor een gekozen periode, of null voor "alles".
function periodeBereik(periode,van,tot){
  const n=new Date();
  if(periode==='week'){const dag=(n.getDay()+6)%7;const ma=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dag);const zo=new Date(ma.getFullYear(),ma.getMonth(),ma.getDate()+6);return{start:lokaalIso(ma),end:lokaalIso(zo)}}
  if(periode==='maand')return{start:lokaalIso(new Date(n.getFullYear(),n.getMonth(),1)),end:lokaalIso(new Date(n.getFullYear(),n.getMonth()+1,0))};
  if(periode==='vorige')return{start:lokaalIso(new Date(n.getFullYear(),n.getMonth()-1,1)),end:lokaalIso(new Date(n.getFullYear(),n.getMonth(),0))};
  if(periode==='eigen')return{start:van||'0000-01-01',end:tot||'9999-12-31'};
  return null;
}
function inPeriode(datum,periode,van,tot){const r=periodeBereik(periode,van,tot);return !r||(datum>=r.start&&datum<=r.end)}
// Periodeknoppen + (bij "eigen periode") twee datumvelden; gedeeld door Dashboard en Klussen.
function periodeKiezer(klasse,f){
  const knop=(val,label)=>`<button class="${klasse} px-3 py-1.5 text-sm rounded-lg font-medium ${f.periode===val?'bg-emerald-100 dark:bg-emerald-900 text-emerald-800 dark:text-emerald-200':'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200'}" data-filter="${val}">${label}</button>`;
  return knop('week','Deze week')+knop('maand','Deze maand')+knop('vorige','Vorige maand')+knop('eigen','Eigen periode')+knop('alles','Alles')+
    (f.periode==='eigen'?`<span class="flex items-center gap-1 text-sm"><input type="date" id="${klasse}Van" value="${f.van||''}" class="border rounded-lg px-2 dark:bg-gray-700 dark:border-gray-600" aria-label="Van"> t/m <input type="date" id="${klasse}Tot" value="${f.tot||''}" class="border rounded-lg px-2 dark:bg-gray-700 dark:border-gray-600" aria-label="Tot en met"></span>`:'');
}
function matchesFilter(d,f){
  if(f.wId&&d.medewerkerId!==f.wId)return false;
  if(f.status&&d.status!==f.status)return false;
  return inPeriode(d.datum,f.period,f.van,f.tot);
}

// === BEHEER: KLUSSEN & FACTURATIE ===
let klusFilter={factuur:'open',periode:'maand',van:lokaalIso(new Date(new Date().getFullYear(),new Date().getMonth(),1)),tot:lokaalIso(new Date()),klant:'',dienst:'',werknemer:'',mono:''};
let klusSelectie=new Set();

// Alle klusregels uit alle dagstaten, platgeslagen tot losse regels
function alleKlussen(){
  const kMap={};DB.list('klanten').forEach(k=>kMap[k.id]=k);
  const dMap={};DB.list('diensten').forEach(d=>dMap[d.id]=d);
  const out=[];
  DB.list('dagstaten').forEach(d=>(d.klussen||[]).forEach(k=>out.push({
    ...k,dagId:d.id,datum:d.datum,medewerkerId:d.medewerkerId,medewerkerNaam:d.medewerkerNaam,dagStatus:d.status,
    klant:kMap[k.klantId]||null,dienst:dMap[k.dienstId]||null
  })));
  return out.sort((a,b)=>(b.datum||'').localeCompare(a.datum||''));
}
function klusBedrag(k){const t=k.dienst&&k.dienst.tarief?Number(k.dienst.tarief):0;return t*(Number(k.aantal)||0)}
function klusMatch(k,f){
  if(f.klant&&k.klantId!==f.klant)return false;
  if(f.dienst&&k.dienstId!==f.dienst)return false;
  if(f.werknemer&&k.medewerkerId!==f.werknemer)return false;
  if(f.factuur==='open'&&k.gefactureerd)return false;
  if(f.factuur==='klaar'&&!k.gefactureerd)return false;
  if(f.mono==='wel'&&!k.wegenMonsteren)return false;
  if(f.mono==='niet'&&k.wegenMonsteren)return false;
  if(!inPeriode(k.datum,f.periode,f.van,f.tot))return false;
  return true;
}
// Facturatiestatus van klusregels wegschrijven naar de dagstaat
function zetFacturatieBulk(paren,waarde){
  const perDag={};
  paren.forEach(p=>{(perDag[p.dagId]=perDag[p.dagId]||[]).push(p.klusId)});
  Object.keys(perDag).forEach(dagId=>{
    const d=DB.get('dagstaten',dagId);if(!d)return;
    const ids=perDag[dagId];
    const klussen=(d.klussen||[]).map(k=>ids.includes(k.id)?{...k,gefactureerd:!!waarde,factuurdatum:waarde?today():''}:k);
    DB.update('dagstaten',dagId,{...d,klussen});
  });
}
// "Wegen monsteren" van klusregels wegschrijven naar de dagstaat
function zetMono(paren,waarde){
  const perDag={};
  paren.forEach(p=>{(perDag[p.dagId]=perDag[p.dagId]||[]).push(p.klusId)});
  Object.keys(perDag).forEach(dagId=>{
    const d=DB.get('dagstaten',dagId);if(!d)return;
    const ids=perDag[dagId];
    const klussen=(d.klussen||[]).map(k=>ids.includes(k.id)?{...k,wegenMonsteren:!!waarde}:k);
    DB.update('dagstaten',dagId,{...d,klussen});
  });
}

function verwijderKlussen(paren){
  const perDag={};
  paren.forEach(p=>{(perDag[p.dagId]=perDag[p.dagId]||[]).push(p.klusId)});
  let klussen=0,dagen=0;
  Object.keys(perDag).forEach(dagId=>{
    const d=DB.get('dagstaten',dagId);if(!d)return;
    const ids=perDag[dagId];
    ids.forEach(kid=>{if(DB.get('klus_notities',kid))DB.remove('klus_notities',kid)});
    const rest=(d.klussen||[]).filter(k=>!ids.includes(k.id));
    klussen+=(d.klussen||[]).length-rest.length;
    if(!rest.length){DB.remove('dagstaten',dagId);dagen++}
    else DB.update('dagstaten',dagId,{...d,klussen:rest});
  });
  return{klussen,dagen};
}
function vraagVerwijderen(paren){
  const perDag={};paren.forEach(p=>{(perDag[p.dagId]=perDag[p.dagId]||[]).push(p.klusId)});
  let dagen=0;Object.keys(perDag).forEach(id=>{const d=DB.get('dagstaten',id);if(d&&(d.klussen||[]).every(k=>perDag[id].includes(k.id)))dagen++});
  const n=paren.length;
  return confirm('Weet je zeker dat je '+(n===1?'deze klus':n+' klussen')+' definitief wilt verwijderen?'+(dagen?'\n\nLet op: bij '+dagen+' werkdag'+(dagen>1?'en':'')+' is dit de laatste klus. Dan wordt de hele werkdag (en de uren) ook verwijderd.':'')+'\n\nDit kan niet ongedaan worden gemaakt.');
}

// Facturatielijst als CSV (puntkomma + UTF-8 BOM, opent goed in Nederlandse Excel)
function exportKlussenCSV(rows){
  const headers=['Datum','Medewerker','Klantcode','Klant','Adres klant','Dienst','Kenteken/Materieel','Omschrijving','Aantal','Eenheid','Uurtarief','Indicatief bedrag','Wegen monsteren','Facturatiestatus','Factuurdatum','Dagstaatstatus','Opmerking beheer'];
  const lijnen=rows.map(k=>{
    const tarief=k.dienst&&k.dienst.tarief?Number(k.dienst.tarief):0;
    const bud=klusBedrag(k);
    return [k.datum,k.medewerkerNaam||'',k.klant?esc(k.klant.klantcode||''):'',k.klant?esc(k.klant.naam):'',esc(k.klant?klantAdres(k.klant):''),k.dienst?esc(k.dienst.naam):'',esc(k.kenteken||''),esc(k.omschrijving||''),k.aantal,k.eenheid||'uur',tarief?tarief.toFixed(2):'',bud?bud.toFixed(2):'',k.wegenMonsteren?'Ja':'Nee',k.gefactureerd?'Gefactureerd':'Te factureren',k.factuurdatum||'',k.dagStatus||'',esc(((DB.get('klus_notities',k.id)||{}).tekst||'').replace(/\s+/g,' '))].join(';');
  });
  const csv='\uFEFF'+headers.join(';')+'\n'+lijnen.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='facturatielijst_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);
  toast('Facturatielijst geëxporteerd ('+rows.length+' regels)','success');
}

// === KLANTEN IMPORTEREN (CSV-bestand of plakken uit Excel) ===
function normaliseerKop(h){return String(h||'').toLowerCase().replace(/["']/g,'').replace(/[^a-z]/g,'')}
const KLANT_KOLOMMEN={
  naam:['naam','klant','klantnaam','bedrijfsnaam','bedrijf','relatie','relatienaam','name','company','opdrachtgever','debiteur'],
  adres:['adres','straat','straatnaam','address','street','adres1','bezoekadres','adresregel1'],
  postcode:['postcode','zip','zipcode','postalcode'],
  plaats:['plaats','stad','woonplaats','city','town','vestigingsplaats'],
  contact:['contact','contactpersoon','contactpersoonnaam','naamcontactpersoon','tav','tennamevan'],
  email:['email','emailadres','mail','emailaddress','email1'],
  telefoon:['telefoon','telefoonnummer','tel','telefoonnr','phone','phonenumber','mobiel','gsm']
};
function splitsCSVRegel(regel,dl){
  const uit=[];let cur='';let q=false;
  for(let i=0;i<regel.length;i++){
    const c=regel[i];
    if(c==='"'){ if(q&&regel[i+1]==='"'){cur+='"';i++} else q=!q }
    else if(c===dl&&!q){uit.push(cur);cur=''}
    else cur+=c;
  }
  uit.push(cur);return uit.map(x=>x.trim());
}
// Leest geplakte of geüploade tekst en haalt er klanten uit.
// Herkent Nederlandse kolomkoppen; is er geen kop, dan is kolom 1 de naam.
function parseKlantenTekst(txt){
  const regels=String(txt||'').replace(/\r\n?/g,'\n').split('\n').filter(r=>r.trim()!=='');
  if(!regels.length)return{fout:'Geen regels gevonden'};
  const eerste=regels[0];
  const telling=[['\t',(eerste.match(/\t/g)||[]).length],[';',(eerste.match(/;/g)||[]).length],[',',(eerste.match(/,/g)||[]).length]];
  telling.sort((a,b)=>b[1]-a[1]);
  const dl=telling[0][1]>0?telling[0][0]:';';
  const kop=splitsCSVRegel(regels[0],dl);
  const kol={};
  Object.keys(KLANT_KOLOMMEN).forEach(veld=>{
    const i=kop.findIndex(h=>KLANT_KOLOMMEN[veld].includes(normaliseerKop(h)));
    if(i>=0)kol[veld]=i;
  });
  const heeftKop=Object.keys(kol).length>0;
  if(!heeftKop)kol.naam=0;
  const datarijen=heeftKop?regels.slice(1):regels;
  const klanten=[];
  datarijen.forEach(r=>{
    const c=splitsCSVRegel(r,dl);
    const naam=(c[kol.naam]||'').trim();
    if(!naam)return;
    const pak=v=>kol[v]!=null?(c[kol[v]]||'').trim():'';
    klanten.push({naam,adres:pak('adres'),postcode:pak('postcode'),plaats:pak('plaats'),contact:pak('contact'),email:pak('email'),telefoon:pak('telefoon'),actief:true});
  });
  return{klanten,heeftKop,kol,dl};
}

const normKent=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function openMaterieelEditor(id){
  const ex=id?DB.get('materieel',id):null;
  document.body.insertAdjacentHTML('beforeend',`<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-30" id="matEditor"><div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 w-full max-w-md mx-4"><h3 class="font-bold mb-4">${ex?'Materieel wijzigen':'Nieuw materieel'}</h3>

  <label class="flex items-center gap-2 mb-4"><input type="checkbox" id="mt_actief" ${ex?.actief!==false?'checked':''}> Actief</label>
  <div class="flex gap-2"><button id="mtSave" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-medium min-h-[48px]">Opslaan</button><button id="mtCancel" class="flex-1 bg-gray-200 dark:bg-gray-700 py-2 rounded-xl font-medium min-h-[48px]">Annuleren</button></div></div></div>`);

    if(DB.list('materieel').some(m=>m.id!==id&&normKent(m.kenteken)===normKent(kent))){toast('Dit kenteken staat al in de lijst','error');return}
    const data={kenteken:kent,omschrijving:$('mt_oms').value.trim(),actief:$('mt_actief').checked};
    if(ex)DB.update('materieel',id,data);else DB.insert('materieel',data);

function openMaterieelBulk(){
  document.body.insertAdjacentHTML('beforeend',`<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-30" id="matBulk"><div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 w-full max-w-lg mx-4"><h3 class="font-bold mb-2">Meerdere plakken</h3>
  <p class="text-sm text-gray-600 dark:text-gray-300 mb-2">Een per regel: kenteken, daarna eventueel een omschrijving (gescheiden door ; of tab of een streepje met spaties). Dubbele kentekens worden overgeslagen.</p>
  <textarea id="mb_tekst" rows="10" class="w-full border rounded-xl px-3 py-2 mb-3 font-mono text-sm bg-white dark:bg-gray-700 dark:border-gray-600" style="min-height:0" placeholder="12-ABC-3;Mestwagen Scania&#10;45-XYZ-6;Trekker John Deere&#10;Mestinjecteur"></textarea>
  <div class="flex gap-2"><button id="mbSave" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-medium min-h-[48px]">Toevoegen</button><button id="mbCancel" class="flex-1 bg-gray-200 dark:bg-gray-700 py-2 rounded-xl font-medium min-h-[48px]">Annuleren</button></div></div></div>`);
  $('mbCancel').onclick=()=>$('matBulk').remove();
  $('mbSave').onclick=()=>{
    const bestaand=new Set(DB.list('materieel').map(m=>normKent(m.kenteken)));let n=0,dubbel=0;
    $('mb_tekst').value.split(/\r?\n/).forEach(r=>{
      r=r.trim();if(!r)return;
      const d=r.split(/\s*[;\t]\s*|\s+-\s+/);
      const kent=(d[0]||'').trim().toUpperCase(),oms=d.slice(1).join(' ').trim();
      if(!kent)return;
      if(bestaand.has(normKent(kent))){dubbel++;return}
      bestaand.add(normKent(kent));DB.insert('materieel',{kenteken:kent,omschrijving:oms,actief:true});n++;
    });
    $('matBulk').remove();toast(n+' toegevoegd'+(dubbel?', '+dubbel+' al aanwezig':''),'success');renderCurrentView();
  };
}

// === ORDERS (verzamelorders / tickets, alleen beheer) ===
// Los van de klussen die medewerkers invoeren: een eigen overzicht voor klussen
// die meerdere dagen duren, met status, notities, foto's en regels met aantal x prijs.
const ORDER_STATUS=['Nieuw','Gepland','Bezig','Klaar','Gefactureerd'];
const ORDER_KLEUR={Nieuw:'bg-gray-200 text-gray-800',Gepland:'bg-blue-100 text-blue-800',Bezig:'bg-amber-100 text-amber-900',Klaar:'bg-emerald-100 text-emerald-800',Gefactureerd:'bg-purple-100 text-purple-800'};
const orderFilter={status:'open',q:''};
const eurO=n=>'€ '+(Number(n)||0).toFixed(2).replace('.',',');
const getal=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(n)?0:n};
const orderTotaal=o=>(o.regels||[]).reduce((s,r)=>s+getal(r.aantal)*getal(r.prijs),0);
const nieuwOrdernr=()=>{let m=0;DB.list('orders').forEach(o=>{const r=/^O(\d+)$/.exec(o.ordernr||'');if(r)m=Math.max(m,parseInt(r[1],10))});return 'O'+String(m+1).padStart(4,'0')};
const datumNL=d=>d?String(d).split('-').reverse().join('-'):'';
function renderOrders(){
  const alle=DB.list('orders').slice().sort((a,b)=>(b.ordernr||'').localeCompare(a.ordernr||''));
  const f=orderFilter,q=f.q.trim().toLowerCase();
  const lijst=alle.filter(o=>{
    if(f.status==='open'&&o.status==='Gefactureerd')return false;
    if(f.status!=='open'&&f.status!=='alles'&&o.status!==f.status)return false;
    if(q){const kl=DB.get('klanten',o.klantId);const hooi=[o.ordernr,o.titel,o.omschrijving,o.notities,kl&&kl.naam].join(' ').toLowerCase();if(!hooi.includes(q))return false}
    return true;
  });
  const tel=s=>alle.filter(o=>o.status===s).length;
  const chips=[['open','Lopend ('+alle.filter(o=>o.status!=='Gefactureerd').length+')'],...ORDER_STATUS.map(s=>[s,s+' ('+tel(s)+')']),['alles','Alles ('+alle.length+')']];
  $('main').innerHTML=`<div class="max-w-full mx-auto"><h2 class="text-xl font-bold mb-1 text-gray-800 dark:text-gray-100">Orders</h2>
  <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Je eigen tickets voor werk dat meerdere dagen duurt. Medewerkers zien dit niet en het staat los van de klussen.</p>
  <div class="flex flex-wrap gap-2 mb-3"><button id="btnNieuwOrder" class="px-4 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 min-h-[48px] font-medium">+ Nieuwe order</button>
  <input id="orderZoek" value="${esc(f.q)}" placeholder="Zoeken op klant, nummer of tekst" class="flex-1 min-w-[180px] border rounded-xl px-3 py-2 bg-white dark:bg-gray-700 dark:border-gray-600"></div>
  <div class="flex flex-wrap gap-2 mb-4">${chips.map(([k,t])=>`<button data-ofs="${k}" class="px-3 py-2 rounded-full text-sm min-h-[40px] border ${f.status===k?'bg-black text-white border-black dark:bg-white dark:text-black':'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-600'}">${esc(t)}</button>`).join('')}</div>
  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${lijst.length?lijst.map(o=>{const kl=DB.get('klanten',o.klantId);const tot=orderTotaal(o);
    return `<button data-order="${o.id}" class="text-left bg-white dark:bg-gray-800 rounded-2xl shadow p-4 border border-gray-100 dark:border-gray-700 hover:border-gray-400">
    <div class="flex items-center justify-between gap-2 mb-1"><span class="text-xs font-mono text-gray-500">${esc(o.ordernr||'')}</span><span class="px-2 py-0.5 rounded-full text-xs font-medium ${ORDER_KLEUR[o.status]||ORDER_KLEUR.Nieuw}">${esc(o.status||'Nieuw')}</span></div>
    <div class="font-semibold text-gray-800 dark:text-gray-100">${esc(o.titel||'(zonder titel)')}</div>
    <div class="text-sm text-gray-600 dark:text-gray-300">${kl?esc(kl.naam):'<span class="text-gray-400">Geen klant</span>'}</div>
    ${o.startdatum||o.einddatum?`<div class="text-xs text-gray-500 mt-1">${esc(datumNL(o.startdatum))}${o.einddatum?' t/m '+esc(datumNL(o.einddatum)):''}</div>`:''}
    <div class="flex items-center justify-between mt-2 text-xs text-gray-500"><span>${(o.regels||[]).length} regel(s)${(o.fotos||[]).length?' · '+(o.fotos||[]).length+' foto\'s':''}</span><span class="font-semibold text-gray-800 dark:text-gray-100 text-sm">${tot?eurO(tot):''}</span></div></button>`}).join(''):'<p class="text-gray-400 py-8 md:col-span-2 xl:col-span-3 text-center">Geen orders gevonden.</p>'}</div></div>`;
  $('btnNieuwOrder').onclick=()=>openOrderEditor(null);
  $('orderZoek').oninput=e=>{orderFilter.q=e.target.value;const p=e.target.selectionStart;renderOrders();const z=$('orderZoek');z.focus();try{z.setSelectionRange(p,p)}catch(x){}};
  document.querySelectorAll('[data-ofs]').forEach(b=>b.onclick=()=>{orderFilter.status=b.dataset.ofs;renderOrders()});
  document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>openOrderEditor(b.dataset.order));
}

// === PLANNING: invullen en per medewerker (of als 1 bericht) naar WhatsApp ===
let PLAN=(()=>{try{const s=JSON.parse(localStorage.getItem('wop_planning')||'null');if(s&&Array.isArray(s.regels))return s}catch(e){}return null})()||{datum:'',regels:[],notitie:'',groep:'klus'};
// Oudere planningen hadden 1 laad- en 1 loslocatie (laad/los); nu mogen het er meer zijn (laden/lossen).
const planNorm=r=>{if(!Array.isArray(r.laden))r.laden=[r.laad||''];if(!Array.isArray(r.lossen))r.lossen=[r.los||''];if(!r.laden.length)r.laden=[''];if(!r.lossen.length)r.lossen=[''];delete r.laad;delete r.los;return r};
PLAN.regels.forEach(planNorm);
const nieuwPlanRegel=()=>({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),tijd:'',klant:'',laadnr:'',laden:[''],lossen:[''],omschr:'',wie:[]});
function planBewaar(){try{localStorage.setItem('wop_planning',JSON.stringify(PLAN))}catch(e){}}
const planIngevuld=r=>(r.klant||'').trim()||(r.omschr||'').trim()||(r.laadnr||'').trim()||(r.laden||[]).some(x=>(x||'').trim())||(r.lossen||[]).some(x=>(x||'').trim());
const datumLang=iso=>{if(!iso)return '';const d=new Date(iso+'T12:00:00');return isNaN(d)?'':d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'})};
// Telefoonnummer -> internationaal formaat voor wa.me (06-12345678 -> 31612345678). Leeg = onbruikbaar.
function waNummer(t){
  const s=String(t||'').trim();if(!s)return '';
  let d=s.replace(/\D/g,'');
  if(/^\+/.test(s)){}
  else if(/^00/.test(s))d=d.slice(2);
  else if(d.startsWith('0'))d='31'+d.slice(1);
  else if(!(d.startsWith('31')&&d.length===11))return '';
  if(d.startsWith('31'))return d.length===11?d:'';
  return d.length>=8&&d.length<=15?d:'';
}
const locRegels=(arr,label,pre)=>{const v=(arr||[]).map(x=>(x||'').trim()).filter(Boolean);return v.map((x,i)=>(pre||'')+label+(v.length>1?' '+(i+1):'')+': '+x)};
function planContext(){
  const wn={};DB.list('werknemers').forEach(w=>wn[w.id]=w.naam);
  const kl=DB.list('klanten');
  const klantVan=t=>{t=(t||'').trim();if(!t)return null;const l=t.toLowerCase();return kl.find(k=>(k.naam+(k.plaats?' ('+k.plaats+')':'')).toLowerCase()===l)||kl.find(k=>(k.naam||'').toLowerCase()===l)||null};
  const plek=r=>{const k=klantVan(r.klant);if(!k)return (r.klant||'').trim();return k.naam+(klantAdres(k)?' - '+klantAdres(k):'')};
  const regels=PLAN.regels.filter(planIngevuld).slice().sort((a,b)=>(a.tijd||'99:99')<(b.tijd||'99:99')?-1:1);
  return {wn,plek,regels};
}
function planTekst(){
  const {wn,plek,regels}=planContext();
  const dat=datumLang(PLAN.datum);
  const uit=[];
  uit.push('*Planning'+(dat?' '+dat:'')+'*');
  if(PLAN.notitie.trim()){uit.push('');uit.push(PLAN.notitie.trim())}
  if(PLAN.groep==='klus'){
    regels.forEach(r=>{
      uit.push('');
      uit.push('*'+(r.tijd?r.tijd+' - ':'')+(plek(r)||'Klus')+'*');
      if((r.laadnr||'').trim())uit.push('Laadnummer: '+r.laadnr.trim());
      locRegels(r.laden,'Laden').forEach(x=>uit.push(x));
      locRegels(r.lossen,'Lossen').forEach(x=>uit.push(x));
      if((r.omschr||'').trim())uit.push(r.omschr.trim());
      const namen=(r.wie||[]).map(id=>wn[id]).filter(Boolean);
      if(namen.length)uit.push('Wie: '+namen.join(', '));
    });
  } else {
    const per={};
    regels.forEach(r=>{(r.wie||[]).forEach(id=>{(per[id]=per[id]||[]).push(r)})});
    Object.keys(per).sort((a,b)=>(wn[a]||'').localeCompare(wn[b]||'')).forEach(id=>{
      uit.push('');uit.push('*'+(wn[id]||'?')+'*');
      per[id].forEach(r=>{uit.push('- '+(r.tijd?r.tijd+' ':'')+(plek(r)||'Klus')+((r.laadnr||'').trim()?' (laadnr '+r.laadnr.trim()+')':'')+((r.omschr||'').trim()?': '+r.omschr.trim():''));locRegels(r.laden,'Laden','  ').concat(locRegels(r.lossen,'Lossen','  ')).forEach(x=>uit.push(x))});
    });
    const zonder=regels.filter(r=>!(r.wie||[]).length);
    if(zonder.length){uit.push('');uit.push('*Nog niemand ingedeeld*');zonder.forEach(r=>uit.push('- '+(r.tijd?r.tijd+' ':'')+(plek(r)||'Klus')+((r.laadnr||'').trim()?' (laadnr '+r.laadnr.trim()+')':'')))}
  }
  return uit.join('\n');
}
// Persoonlijk bericht: alleen de klussen van 1 medewerker.
function planTekstVoor(wid){
  const {wn,plek,regels}=planContext();
  const dat=datumLang(PLAN.datum);
  const uit=['*Planning'+(dat?' '+dat:'')+'*'];
  if(PLAN.notitie.trim()){uit.push('');uit.push(PLAN.notitie.trim())}
  regels.filter(r=>(r.wie||[]).includes(wid)).forEach(r=>{
    uit.push('');
    uit.push('*'+(r.tijd?r.tijd+' - ':'')+(plek(r)||'Klus')+'*');
    if((r.laadnr||'').trim())uit.push('Laadnummer: '+r.laadnr.trim());
    locRegels(r.laden,'Laden').forEach(x=>uit.push(x));
    locRegels(r.lossen,'Lossen').forEach(x=>uit.push(x));
    if((r.omschr||'').trim())uit.push(r.omschr.trim());
    const anderen=(r.wie||[]).filter(id=>id!==wid).map(id=>wn[id]).filter(Boolean);
    if(anderen.length)uit.push('Samen met: '+anderen.join(', '));
  });
  return uit.join('\n');
}

function planLog(wid,naam,tekst,datum,soort){

}
function waOpen(nr,tekst){window.open('https://wa.me/'+(nr||'')+'?text='+encodeURIComponent(tekst),'_blank','noopener')}
const tijdKort=iso=>{const d=new Date(iso);if(isNaN(d))return '';const vandaag=new Date().toDateString()===d.toDateString();return (vandaag?'vandaag':d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'}))+' '+d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})};
function renderPlanning(){
  if(!PLAN.datum){const m=new Date();m.setDate(m.getDate()+1);PLAN.datum=m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(m.getDate()).padStart(2,'0')}
  PLAN.regels.forEach(planNorm);
  const wn=DB.list('werknemers').filter(w=>w.actief!==false).sort((a,b)=>(a.naam||'').localeCompare(b.naam||''));
  const kl=DB.list('klanten').filter(k=>k.actief!==false);
  const locBlok=(r,veld,label,knop)=>`<div>${r[veld].map((v,i)=>`<div class="flex gap-1 mb-1"><input data-f="${veld}" data-i="${i}" value="${esc(v)}" placeholder="${label}${r[veld].length>1?' '+(i+1):''} (Google Maps-link)" class="flex-1 min-w-0 border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600" aria-label="${label} ${i+1}">${r[veld].length>1?`<button data-rmloc="${veld}|${i}" class="text-red-500 px-2 min-h-[48px]" aria-label="Adres verwijderen">✕</button>`:''}</div>`).join('')}<button data-addloc="${veld}" class="text-sm text-blue-600 hover:text-blue-800 min-h-[40px]">+ ${knop}</button></div>`;
  const regelHtml=r=>`<div class="border border-gray-200 dark:border-gray-700 rounded-xl p-3 mb-3 bg-white dark:bg-gray-800" data-r="${r.id}">
    <div class="flex flex-wrap gap-2 mb-2">
      <input type="time" data-f="tijd" value="${esc(r.tijd||'')}" class="border rounded-lg px-2 dark:bg-gray-700 dark:border-gray-600" aria-label="Tijd">
      <input list="plKlanten" data-f="klant" value="${esc(r.klant||'')}" placeholder="Klant (zoek op naam)" class="flex-1 min-w-[200px] border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600" aria-label="Klant">
      <button data-dup="${r.id}" class="text-sm px-2 min-h-[48px] text-blue-600 hover:text-blue-800">Kopieer klus</button><button data-del="${r.id}" class="text-red-500 hover:text-red-700 text-sm px-2 min-h-[48px]">Verwijder</button>
    </div>
    <input data-f="laadnr" value="${esc(r.laadnr||'')}" placeholder="Laadnummer" class="w-full border rounded-lg px-3 mb-2 dark:bg-gray-700 dark:border-gray-600" aria-label="Laadnummer">
    <div class="grid sm:grid-cols-2 gap-2 mb-2">${locBlok(r,'laden','Laadlocatie','Laadadres toevoegen')}${locBlok(r,'lossen','Loslocatie','Losadres toevoegen')}</div>

    <div class="flex flex-wrap gap-2">${wn.map(w=>`<label class="flex items-center gap-1 text-sm border border-gray-200 dark:border-gray-600 rounded-full px-3 py-1 cursor-pointer"><input type="checkbox" data-wie="${esc(w.id)}" ${(r.wie||[]).includes(w.id)?'checked':''} style="min-height:auto"> ${esc(w.naam)}</label>`).join('')||'<span class="text-sm text-gray-500">Nog geen werknemers aangemaakt.</span>'}</div>
  </div>`;
  $('main').innerHTML=`<div class="max-w-full mx-auto"><h2 class="text-xl font-bold mb-4 text-gray-800 dark:text-gray-100">Planning</h2>
  <datalist id="plKlanten">${kl.map(k=>`<option value="${esc(k.naam+(k.plaats?' ('+k.plaats+')':''))}"></option>`).join('')}</datalist>
  <div class="grid lg:grid-cols-2 gap-6">
   <div>
    <div class="flex flex-wrap gap-3 items-end mb-3">
      <div><label class="block text-xs font-medium mb-1" for="plDatum">Datum</label><input type="date" id="plDatum" value="${esc(PLAN.datum)}" class="border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600"></div>
      <div><label class="block text-xs font-medium mb-1" for="plGroep">Algemeen bericht ordenen per</label><select id="plGroep" class="border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600"><option value="klus">Klus</option><option value="medewerker">Medewerker</option></select></div>
    </div>
    <label class="block text-xs font-medium mb-1" for="plNotitie">Algemene opmerking bovenaan (optioneel)</label>
    <textarea id="plNotitie" rows="2" class="w-full border rounded-lg px-3 py-2 mb-3 dark:bg-gray-700 dark:border-gray-600" style="min-height:0" placeholder="Bijv. Verzamelen om 06:45 op het bedrijf">${esc(PLAN.notitie)}</textarea>
    <div id="plRegels">${PLAN.regels.map(regelHtml).join('')}</div>
    <div class="flex gap-2 flex-wrap"><button id="plNieuw" class="px-4 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 min-h-[48px] font-medium">+ Klus toevoegen</button><button id="plWis" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl min-h-[48px]">Alles wissen</button></div>
   </div>
   <div>
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow border border-gray-100 dark:border-gray-700 p-4 mb-4">
      <h3 class="font-bold mb-1">Persoonlijk bericht per medewerker</h3>
      <p class="text-xs text-gray-500 dark:text-gray-400 mb-3">Elke medewerker krijgt alleen zijn eigen klussen. Eén tik opent WhatsApp op het juiste nummer; jij drukt daar nog op verzenden.</p>
      <div id="plPer"></div>
    </div>
    <label class="block text-xs font-medium mb-1" for="plTekst">Algemeen bericht (bijv. voor een groep)</label>
    <textarea id="plTekst" rows="12" class="w-full border rounded-xl px-3 py-2 mb-3 font-mono text-sm dark:bg-gray-700 dark:border-gray-600" style="min-height:0"></textarea>
    <div class="flex gap-2 flex-wrap"><button id="plKopieer" class="px-4 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 min-h-[48px] font-medium">Kopieer bericht</button><button id="plWa" class="px-4 py-2 bg-green-600 text-white rounded-xl hover:bg-green-700 min-h-[48px] font-medium">Open in WhatsApp</button></div>
    <p class="text-xs text-gray-500 mt-2">Bij het algemene bericht kies je in WhatsApp zelf de groep of de personen. Wijzigt je planning, dan worden de berichten vanzelf opnieuw opgebouwd (handmatige aanpassingen gaan dan verloren).</p>
   </div>
  </div></div>`;
  $('plGroep').value=PLAN.groep;
  const tekenPer=()=>{
    const {regels}=planContext();
    const ids=[...new Set(regels.flatMap(r=>r.wie||[]))];
    const lijst=ids.map(id=>wn.find(w=>w.id===id)).filter(Boolean);
    const arch=DB.list('planningen');
    const zonder=regels.filter(r=>!(r.wie||[]).length).length;
    $('plPer').innerHTML=lijst.length?lijst.map(w=>{
      const nr=waNummer(w.telefoon);
      const eerder=arch.filter(p=>p.medewerkerId===w.id&&p.datum===PLAN.datum).sort((a,b)=>String(b.verstuurdOp).localeCompare(String(a.verstuurdOp)))[0];
      const n=regels.filter(r=>(r.wie||[]).includes(w.id)).length;
      return `<div class="border border-gray-200 dark:border-gray-700 rounded-xl p-3 mb-2">
        <div class="flex flex-wrap items-center gap-2 justify-between">
          <div><div class="font-medium">${esc(w.naam)} <span class="text-xs text-gray-500">· ${n} klus${n===1?'':'sen'}</span></div>
          ${nr?'':'<div class="text-xs text-red-600">Telefoonnummer ontbreekt of klopt niet (pas aan bij Werknemers)</div>'}
          ${eerder?`<div class="text-xs text-emerald-700 dark:text-emerald-400">✓ Geopend in WhatsApp ${esc(tijdKort(eerder.verstuurdOp))}</div>`:''}</div>
          <button data-pwa="${esc(w.id)}" ${nr?'':'disabled'} class="px-4 py-2 rounded-xl font-medium min-h-[48px] ${nr?'bg-green-600 text-white hover:bg-green-700':'bg-gray-200 text-gray-400 cursor-not-allowed'}">${eerder?'Opnieuw sturen':'Stuur via WhatsApp'}</button>
        </div>
        <details class="mt-2"><summary class="text-sm cursor-pointer text-blue-600">Bekijk of pas het bericht aan</summary>
        <textarea data-ptekst="${esc(w.id)}" rows="8" class="w-full border rounded-xl px-3 py-2 mt-2 font-mono text-sm dark:bg-gray-700 dark:border-gray-600" style="min-height:0">${esc(planTekstVoor(w.id))}</textarea></details></div>`}).join('')
      +(zonder?`<p class="text-xs text-amber-700">${zonder} klus${zonder===1?'':'sen'} nog zonder medewerker.</p>`:'')
      :'<p class="text-sm text-gray-500">Kies bij een klus de medewerker(s); dan verschijnt hier per persoon een knop.</p>';
  };
  const ververs=()=>{planBewaar();$('plTekst').value=planTekst();tekenPer()};
  ververs();
  $('plPer').onclick=e=>{
    const b=e.target.closest('[data-pwa]');if(!b||b.disabled)return;
    const w=wn.find(x=>x.id===b.dataset.pwa);if(!w)return;
    const ta=$('plPer').querySelector('[data-ptekst="'+w.id+'"]');
    const tekst=ta?ta.value:planTekstVoor(w.id);
    waOpen(waNummer(w.telefoon),tekst);
    planLog(w.id,w.naam,tekst,PLAN.datum,'versturen');
    setTimeout(tekenPer,300);
  };
  $('plDatum').onchange=e=>{PLAN.datum=e.target.value;ververs()};
  $('plGroep').onchange=e=>{PLAN.groep=e.target.value;ververs()};
  $('plNotitie').oninput=e=>{PLAN.notitie=e.target.value;ververs()};
  const r$=el=>PLAN.regels.find(r=>r.id===el.closest('[data-r]').dataset.r);
  const box=$('plRegels');
  const locKey='wop_locaties';
  const locLees=()=>{try{return JSON.parse(localStorage.getItem(locKey)||'{}')}catch(e){return {}}};
  const locBewaar=r=>{const k=(r.klant||'').trim().toLowerCase();if(!k)return;const m=locLees();m[k]={laden:r.laden.filter(x=>(x||'').trim()),lossen:r.lossen.filter(x=>(x||'').trim())};try{localStorage.setItem(locKey,JSON.stringify(m))}catch(e){}};
  box.oninput=e=>{const f=e.target.dataset.f;if(!f)return;const r=r$(e.target);if(!r)return;
    if(f==='laden'||f==='lossen'){r[f][+e.target.dataset.i]=e.target.value;locBewaar(r)}else r[f]=e.target.value;
    ververs()};
  box.onchange=e=>{
    if(e.target.dataset.f==='klant'){
      const r=r$(e.target);const m=locLees()[(e.target.value||'').trim().toLowerCase()];
      if(r&&m){const oudL=m.laden||(m.laad?[m.laad]:[]),oudO=m.lossen||(m.los?[m.los]:[]);
        if(!r.laden.some(x=>(x||'').trim())&&!r.lossen.some(x=>(x||'').trim())&&(oudL.length||oudO.length)){r.laden=oudL.length?[...oudL]:[''];r.lossen=oudO.length?[...oudO]:[''];planBewaar();renderPlanning();toast('Laad- en loslocaties van de vorige keer ingevuld','success');return}}
    }
    if(e.target.dataset.wie===undefined)return;
    const r=r$(e.target);if(!r)return;r.wie=r.wie||[];const id=e.target.dataset.wie;
    r.wie=e.target.checked?[...new Set([...r.wie,id])]:r.wie.filter(x=>x!==id);ververs()};
  box.onclick=e=>{
    const t=e.target;
    if(t.dataset.addloc){const r=r$(t);if(r){r[t.dataset.addloc].push('');planBewaar();renderPlanning()}return}
    if(t.dataset.rmloc){const [v,i]=t.dataset.rmloc.split('|');const r=r$(t);if(r){r[v].splice(+i,1);if(!r[v].length)r[v]=[''];planBewaar();renderPlanning()}return}
    if(t.dataset.dup){const src=PLAN.regels.find(r=>r.id===t.dataset.dup);if(src){const i=PLAN.regels.indexOf(src);PLAN.regels.splice(i+1,0,{...src,id:nieuwPlanRegel().id,wie:[...(src.wie||[])],laden:[...src.laden],lossen:[...src.lossen]});planBewaar();renderPlanning()}return}
    if(t.dataset.del){PLAN.regels=PLAN.regels.filter(r=>r.id!==t.dataset.del);planBewaar();renderPlanning()}
  };
  $('plNieuw').onclick=()=>{PLAN.regels.push(nieuwPlanRegel());planBewaar();renderPlanning()};
  $('plWis').onclick=()=>{if(!PLAN.regels.length&&!PLAN.notitie||confirm('Alle klussen uit de planning wissen?')){PLAN.regels=[];PLAN.notitie='';planBewaar();renderPlanning()}};
  $('plKopieer').onclick=async()=>{const t=$('plTekst').value;try{await navigator.clipboard.writeText(t);toast('Bericht gekopieerd','success')}catch(e){$('plTekst').select();document.execCommand('copy');toast('Bericht gekopieerd','success')}};
  $('plWa').onclick=()=>{const t=$('plTekst').value;waOpen('',t);planLog(null,'Algemeen bericht',t,PLAN.datum,'algemeen')};
}

// === PLANNING-ARCHIEF ===
const ARCH={mw:'',van:'',tot:'',q:'',max:50};
function renderPlanArchief(){
  const wn=DB.list('werknemers').slice().sort((a,b)=>(a.naam||'').localeCompare(b.naam||''));
  const alle=DB.list('planningen').slice().sort((a,b)=>String(b.verstuurdOp).localeCompare(String(a.verstuurdOp)));
  const q=ARCH.q.trim().toLowerCase();
  const lijst=alle.filter(p=>{
    if(ARCH.mw==='__alg'){if(p.medewerkerId)return false}else if(ARCH.mw&&p.medewerkerId!==ARCH.mw)return false;
    if(ARCH.van&&(p.datum||'')<ARCH.van)return false;
    if(ARCH.tot&&(p.datum||'')>ARCH.tot)return false;
    if(q&&!((p.tekst||'')+' '+(p.medewerkerNaam||'')).toLowerCase().includes(q))return false;
    return true;
  });
  const toon=lijst.slice(0,ARCH.max);
  $('main').innerHTML=`<div class="max-w-full mx-auto"><h2 class="text-xl font-bold mb-1 text-gray-800 dark:text-gray-100">Planning-archief</h2>
  <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Elke keer dat je een planning in WhatsApp opent, wordt hij hier bewaard. Het archief laat zien dat je de knop hebt gebruikt; of je in WhatsApp echt op verzenden hebt gedrukt, kan ik niet zien.</p>
  <div class="flex flex-wrap gap-3 items-end mb-4">
    <div><label class="block text-xs font-medium mb-1" for="arMw">Medewerker</label><select id="arMw" class="border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600"><option value="">Iedereen</option><option value="__alg">Algemene berichten</option>${wn.map(w=>`<option value="${esc(w.id)}">${esc(w.naam)}</option>`).join('')}</select></div>
    <div><label class="block text-xs font-medium mb-1" for="arVan">Planning van</label><input type="date" id="arVan" value="${esc(ARCH.van)}" class="border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600"></div>
    <div><label class="block text-xs font-medium mb-1" for="arTot">tot en met</label><input type="date" id="arTot" value="${esc(ARCH.tot)}" class="border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600"></div>
    <div class="flex-1 min-w-[180px]"><label class="block text-xs font-medium mb-1" for="arQ">Zoeken in tekst</label><input id="arQ" value="${esc(ARCH.q)}" placeholder="Klant, laadnummer, ..." class="w-full border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600"></div>
  </div>
  <div class="space-y-3">${toon.length?toon.map(p=>`<div class="bg-white dark:bg-gray-800 rounded-2xl shadow border border-gray-100 dark:border-gray-700 p-4">
    <div class="flex flex-wrap items-start justify-between gap-2">
      <div><div class="font-semibold text-gray-800 dark:text-gray-100">${esc(p.medewerkerNaam||'Algemeen bericht')}${p.soort==='opnieuw'?' <span class="text-xs font-normal text-gray-500">(opnieuw gestuurd)</span>':''}${p.soort==='kopie'?' <span class="text-xs font-normal text-gray-500">(kopie van andere planning)</span>':''}</div>
      <div class="text-xs text-gray-500">Planning voor ${esc(datumLang(p.datum)||'—')} · geopend ${esc(tijdKort(p.verstuurdOp))}${p.verstuurdDoor?' door '+esc(p.verstuurdDoor):''}</div></div>
      <div class="flex flex-wrap gap-1">
        <button data-ar-again="${p.id}" class="px-3 py-2 rounded-xl bg-green-600 text-white text-sm min-h-[44px]">Opnieuw sturen</button>
        <button data-ar-copy="${p.id}" class="px-3 py-2 rounded-xl border border-gray-300 dark:border-gray-600 text-sm min-h-[44px]">Kopieer / naar andere medewerker</button>
        <button data-ar-del="${p.id}" class="px-2 text-red-500 text-sm min-h-[44px]">Verwijder</button></div></div>
    <details class="mt-2"><summary class="text-sm cursor-pointer text-blue-600">Bekijk bericht</summary><pre class="whitespace-pre-wrap text-sm mt-2 font-mono bg-gray-50 dark:bg-gray-900 rounded-xl p-3">${esc(p.tekst||'')}</pre></details></div>`).join(''):'<p class="text-gray-400 py-8 text-center">Nog niets in het archief.</p>'}</div>
  ${lijst.length>toon.length?`<button id="arMeer" class="mt-4 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl min-h-[48px]">Toon meer (${lijst.length-toon.length} verborgen)</button>`:''}</div>`;
  $('arMw').value=ARCH.mw;
  $('arMw').onchange=e=>{ARCH.mw=e.target.value;ARCH.max=50;renderPlanArchief()};
  $('arVan').onchange=e=>{ARCH.van=e.target.value;renderPlanArchief()};
  $('arTot').onchange=e=>{ARCH.tot=e.target.value;renderPlanArchief()};
  $('arQ').oninput=e=>{ARCH.q=e.target.value;const p=e.target.selectionStart;renderPlanArchief();const z=$('arQ');z.focus();try{z.setSelectionRange(p,p)}catch(x){}};
  if($('arMeer'))$('arMeer').onclick=()=>{ARCH.max+=50;renderPlanArchief()};
  document.querySelectorAll('[data-ar-again]').forEach(b=>b.onclick=()=>{
    const p=DB.get('planningen',b.dataset.arAgain);if(!p)return;
    const w=p.medewerkerId?DB.get('werknemers',p.medewerkerId):null;
    const nr=w?waNummer(w.telefoon):'';
    if(w&&!nr){toast('Telefoonnummer van '+w.naam+' ontbreekt of klopt niet','error');return}
    waOpen(nr,p.tekst);planLog(p.medewerkerId,p.medewerkerNaam,p.tekst,p.datum,'opnieuw');setTimeout(renderPlanArchief,300);
  });
  document.querySelectorAll('[data-ar-copy]').forEach(b=>b.onclick=()=>openPlanKopie(b.dataset.arCopy));
  document.querySelectorAll('[data-ar-del]').forEach(b=>b.onclick=()=>{if(confirm('Deze regel uit het archief verwijderen?')){DB.remove('planningen',b.dataset.arDel);renderPlanArchief()}});
}
function openPlanKopie(id){
  const p=DB.get('planningen',id);if(!p)return;
  const wn=DB.list('werknemers').filter(w=>w.actief!==false).sort((a,b)=>(a.naam||'').localeCompare(b.naam||''));
  const m=document.createElement('div');m.id='planKopie';m.className='fixed inset-0 bg-black/50 z-30 overflow-auto p-3';
  m.innerHTML=`<div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-5 w-full max-w-lg mx-auto my-4">
    <h3 class="font-bold mb-1">Planning kopiëren</h3>
    <p class="text-xs text-gray-500 mb-3">Planning voor ${esc(datumLang(p.datum)||'—')}. Kies wie hem krijgt en pas de tekst zo nodig aan.</p>
    <label class="block text-sm font-medium mb-1" for="pkMw">Sturen naar</label>
    <select id="pkMw" class="w-full border rounded-xl px-3 py-2 mb-3 bg-white dark:bg-gray-700 dark:border-gray-600"><option value="">— kies medewerker —</option>${wn.map(w=>`<option value="${esc(w.id)}">${esc(w.naam)}</option>`).join('')}</select>
    <label class="block text-sm font-medium mb-1" for="pkTekst">Bericht</label>
    <textarea id="pkTekst" rows="10" class="w-full border rounded-xl px-3 py-2 mb-3 font-mono text-sm bg-white dark:bg-gray-700 dark:border-gray-600" style="min-height:0">${esc(p.tekst||'')}</textarea>
    <div class="flex flex-wrap gap-2"><button id="pkWa" class="flex-1 bg-green-600 text-white py-2 rounded-xl font-medium min-h-[48px]">Open in WhatsApp</button><button id="pkKop" class="px-4 border border-gray-300 dark:border-gray-600 rounded-xl min-h-[48px]">Kopieer tekst</button><button id="pkX" class="px-4 bg-gray-200 dark:bg-gray-700 rounded-xl min-h-[48px]">Sluiten</button></div></div>`;
  document.body.appendChild(m);
  $('pkX').onclick=()=>m.remove();
  $('pkKop').onclick=async()=>{const t=$('pkTekst').value;try{await navigator.clipboard.writeText(t);toast('Bericht gekopieerd','success')}catch(e){$('pkTekst').select();document.execCommand('copy');toast('Bericht gekopieerd','success')}};
  $('pkWa').onclick=()=>{
    const w=wn.find(x=>x.id===$('pkMw').value);
    if(!w){toast('Kies eerst een medewerker','error');return}
    const nr=waNummer(w.telefoon);
    if(!nr){toast('Telefoonnummer van '+w.naam+' ontbreekt of klopt niet','error');return}
    const t=$('pkTekst').value;waOpen(nr,t);planLog(w.id,w.naam,t,p.datum,'kopie');m.remove();renderCurrentView();
  };
}

// === KEURINGEN & VERVALDATA (voertuigen en chauffeurs, alleen beheer) ===
const KEUR_SOORTEN={voertuig:['APK','Verzekering','Tachograaf-keuring','Onderhoudsbeurt','Overig'],chauffeur:['Rijbewijs','Code 95','Chauffeurskaart','VCA','Overig']};
const KEUR={toon:'open'};
const dagenTot=iso=>{if(!iso)return null;const a=new Date(iso+'T12:00:00'),b=new Date();b.setHours(12,0,0,0);return Math.round((a-b)/86400000)};
function keurLabel(v){
  if(v.type==='voertuig'){const m=DB.get('materieel',v.refId);return m?m.kenteken+(m.omschrijving?' · '+m.omschrijving:''):'(voertuig verwijderd)'}
  const w=DB.get('werknemers',v.refId);return w?w.naam:'(medewerker verwijderd)';
}
function keurStatus(dagen){
  if(dagen==null)return {t:'Geen datum',c:'bg-gray-100 text-gray-700'};
  if(dagen<0)return {t:'Verlopen ('+(-dagen)+' d)',c:'bg-red-100 text-red-800'};
  if(dagen<=30)return {t:'Nog '+dagen+' dagen',c:'bg-orange-100 text-orange-800'};
  if(dagen<=60)return {t:'Nog '+dagen+' dagen',c:'bg-amber-100 text-amber-900'};
  return {t:'Nog '+dagen+' dagen',c:'bg-emerald-100 text-emerald-800'};
}
function keuringBanner(){
  if(!isBeheer())return '';
  const kort=DB.list('vervaldata').filter(v=>{const d=dagenTot(v.vervaldatum);return d!=null&&d<=30}).sort((a,b)=>(a.vervaldatum||'').localeCompare(b.vervaldatum||''));
  if(!kort.length)return '';
  return `<div class="mb-4 rounded-2xl border border-orange-300 bg-orange-50 dark:bg-orange-950 dark:border-orange-800 p-4"><div class="flex items-center justify-between gap-2 mb-1"><div class="font-semibold text-orange-900 dark:text-orange-200">Binnenkort verlopen (${kort.length})</div><button data-gotab="keuringen" class="text-sm underline text-orange-900 dark:text-orange-200 min-h-[40px]">Alles bekijken</button></div>
  <ul class="text-sm text-orange-900 dark:text-orange-200 space-y-0.5">${kort.slice(0,5).map(v=>`<li>${esc(keurLabel(v))} – ${esc(v.soort==='Overig'&&v.omschrijving?v.omschrijving:v.soort)}: ${esc(keurStatus(dagenTot(v.vervaldatum)).t)}</li>`).join('')}${kort.length>5?`<li>… en ${kort.length-5} meer</li>`:''}</ul></div>`;

const URENOV={van:'',tot:'',status:'alle',open:{}};
function renderUrenOverzicht(){
  if(!URENOV.van){const n=new Date();const p=x=>String(x).padStart(2,'0');URENOV.van=n.getFullYear()+'-'+p(n.getMonth()+1)+'-01';URENOV.tot=today();}
  const werknemers=DB.list('werknemers');
  const wNaam={};werknemers.forEach(w=>wNaam[w.id]=w.naam);
  const dagen=DB.list('dagstaten').filter(d=>d.datum>=URENOV.van&&d.datum<=URENOV.tot&&(URENOV.status==='alle'||d.status===URENOV.status));
  const groep={};
  dagen.forEach(d=>{const id=d.medewerkerId||'?';(groep[id]=groep[id]||[]).push(d)});
  const rijen=Object.keys(groep).map(id=>{const l=groep[id].sort((a,b)=>a.datum<b.datum?-1:1);return{id,naam:wNaam[id]||(l[0].medewerkerNaam)||'Onbekend',dagen:l,uren:l.reduce((s,d)=>s+(Number(d.nettoUren)||0),0)}}).sort((a,b)=>a.naam.localeCompare(b.naam));
  const totaal=rijen.reduce((s,r)=>s+r.uren,0);
  const f=n=>(Math.round(n*100)/100).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
  const maandNamen=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

      <div><label class="block text-xs font-medium mb-1" for="uoStatus">Status</label>
        <select id="uoStatus" class="border rounded-lg px-3 dark:bg-gray-700 dark:border-gray-600">
          <option value="alle">Alle</option><option value="in_afwachting">In afwachting</option><option value="goedgekeurd">Goedgekeurd</option><option value="verwerkt">Verwerkt</option></select></div>
      <button id="uoCsv" class="px-4 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 min-h-[48px] font-medium">Download CSV</button>
    </div>
  </div>
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow overflow-hidden border border-gray-100 dark:border-gray-700 scroll-x">
  <table class="w-full text-sm"><thead class="bg-gray-50 dark:bg-gray-700"><tr>
    <th class="px-3 py-2 text-left">Medewerker</th><th class="px-3 py-2 text-right">Dagen</th><th class="px-3 py-2 text-right">Uren</th><th class="px-3 py-2"></th></tr></thead><tbody>
  ${rijen.length?rijen.map(r=>`<tr class="border-t border-gray-100 dark:border-gray-700">
    <td class="px-3 py-2 font-medium">${esc(r.naam)}</td><td class="px-3 py-2 text-right">${r.dagen.length}</td><td class="px-3 py-2 text-right font-semibold">${f(r.uren)}</td>
    <td class="px-3 py-2 text-right"><button data-uo="${esc(r.id)}" class="text-blue-600 hover:text-blue-800 text-xs min-h-[40px]">${URENOV.open[r.id]?'Verberg dagen':'Toon dagen'}</button></td></tr>
    ${URENOV.open[r.id]?`<tr><td colspan="4" class="px-3 pb-3 bg-gray-50 dark:bg-gray-900"><table class="w-full text-xs"><thead><tr class="text-left text-gray-500"><th class="py-1">Datum</th><th>Start</th><th>Eind</th><th>Pauze</th><th class="text-right">Uren</th><th class="text-right">Status</th></tr></thead><tbody>
      ${r.dagen.map(d=>`<tr class="border-t border-gray-200 dark:border-gray-700"><td class="py-1">${esc(d.datum)}</td><td>${esc(d.startTime||'')}</td><td>${esc(d.endTime||'')}</td><td>${esc(String(d.pauzeMin||0))} min</td><td class="text-right">${f(Number(d.nettoUren)||0)}</td><td class="text-right">${esc(statusNaam[d.status]||d.status||'')}</td></tr>`).join('')}
      </tbody></table></td></tr>`:''}`).join(''):'<tr><td colspan="4" class="px-3 py-6 text-center text-gray-500">Geen uren in deze periode.</td></tr>'}
  </tbody>${rijen.length?`<tfoot class="bg-gray-50 dark:bg-gray-700 font-semibold"><tr><td class="px-3 py-2">Totaal</td><td class="px-3 py-2 text-right">${dagen.length}</td><td class="px-3 py-2 text-right">${f(totaal)}</td><td></td></tr></tfoot>`:''}
  </table></div></div>`;
  $('uoStatus').value=URENOV.status;
  const her=()=>renderUrenOverzicht();

  $('uoMaand').onchange=e=>{const v=e.target.value;if(!v)return;const [j,m]=v.split('-').map(Number);const laatste=new Date(j,m,0).getDate();URENOV.van=v+'-01';URENOV.tot=v+'-'+String(laatste).padStart(2,'0');her()};

    rijen.forEach(r=>r.dagen.forEach(d=>regels.push([r.naam,d.datum,d.startTime||'',d.endTime||'',d.pauzeMin||0,String(Number(d.nettoUren)||0).replace('.',','),statusNaam[d.status]||d.status||''])));
    rijen.forEach(r=>regels.push([r.naam+' (totaal)','','','','',String(Math.round(r.uren*100)/100).replace('.',','),'']));
    const csv='﻿'+regels.map(r=>r.map(q).join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='uren_per_medewerker_'+URENOV.van+'_tot_'+URENOV.tot+'.csv';a.click();URL.revokeObjectURL(a.href);
  };
}
function renderExports(){
  const dagstaten=DB.list('dagstaten');
  const werknemers=DB.list('werknemers');
  const klanten=DB.list('klanten');
  const diensten=DB.list('diensten');
  $("main").innerHTML=`<div class="max-w-full mx-auto"><h2 class="text-xl font-bold mb-4 text-gray-800 dark:text-gray-100">Exporteren</h2>
  <div class="space-y-3">
  <button id="btnExportCSV" class="w-full px-4 py-3 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 font-medium min-h-[48px]">Exporteren voor loonadministratie (CSV)</button>
  <button id="btnExportJSON" class="w-full px-4 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-medium min-h-[48px]">JSON backup exporteren</button>
  <div class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-6 text-center">
  <p class="text-sm text-gray-500 mb-2">JSON backup importeren</p>

  </div></div>`;
  $('btnExportCSV').onclick=()=>exportCSV(dagstaten,werknemers,klanten,diensten);

function exportCSV(dagen,werknemers,klanten,diensten){
  const wMap={},kMap={},dMap={};
  werknemers.forEach(w=>wMap[w.id]=w);klanten.forEach(k=>kMap[k.id]=k);diensten.forEach(d=>dMap[d.id]=d);
  const headers=['Medewerker','Personeelsnr','Datum','Starttijd','Eindtijd','Pauze (min)','Netto uren dag','Klantcode','Klant','Adres klant','Dienst','Kenteken/Materieel','Omschrijving','Aantal','Eenheid','Wegen monsteren','Status'];
  const rows=[];
  dagen.forEach(d=>{const w=wMap[d.medewerkerId]||{};d.klussen.forEach(k=>{const kl=kMap[k.klantId]||{},dv=dMap[k.dienstId]||{};rows.push([w.naam||'',w.persNr||'',d.datum,d.startTime,d.endTime,d.pauzeMin,d.nettoUren,kl.klantcode||'',kl.naam||'',esc(klantAdres(kl)),dv.naam||'',esc(k.kenteken||''),esc(k.omschrijving||''),k.aantal,k.eenheid||'',k.wegenMonsteren?'Ja':'Nee',d.status].join(';'))});});
  const bom='\uFEFF';
  const csv=bom+headers.join(';')+'\n'+rows.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='urenadministratie_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);
  toast('CSV geëxporteerd','success');
}
function exportJSON(){const data={werknemers:DB.list('werknemers'),klanten:DB.list('klanten'),diensten:DB.list('diensten'),dagstaten:DB.list('dagstaten')};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uren_backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('JSON backup geëxporteerd','success')}
function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(data.werknemers)data.werknemers.forEach(w=>{const ex=DB.get('werknemers',w.id);ex?DB.update('werknemers',w.id,w):DB.insert('werknemers',w)});if(data.klanten)data.klanten.forEach(k=>{const ex=DB.get('klanten',k.id);ex?DB.update('klanten',k.id,k):DB.insert('klanten',k)});if(data.diensten)data.diensten.forEach(d=>{const ex=DB.get('diensten',d.id);ex?DB.update('diensten',d.id,d):DB.insert('diensten',d)});if(data.dagstaten)data.dagstaten.forEach(d=>{const ex=DB.get('dagstaten',d.id);ex?DB.update('dagstaten',d.id,d):DB.insert('dagstaten',d)});toast('Backup geïmporteerd','success');setTimeout(()=>renderCurrentView(),500)}catch(err){toast('Ongeldig JSON-bestand','error')}};reader.readAsText(file);e.target.value='';
}

const CACHE = {};
const TABELLEN = ['werknemers', 'klanten', 'diensten', 'dagstaten'];

// ---- sleutelconversie ----
// De database gebruikt snake_case kolommen (medewerker_id), de app werkt met
// camelCase (medewerkerId). Deze twee omzettertjes overbruggen dat verschil,
// ook binnen de klussen die als JSON in de dagstaat zitten.
const naarSnake = s => String(s).replace(/[A-Z]/g, c => '_' + c.toLowerCase());
const naarCamel = s => String(s).replace(/_([a-z0-9])/g, (m, c) => c.toUpperCase());
function sleutelsOm(o, fn){
  if (Array.isArray(o)) return o.map(x => sleutelsOm(x, fn));
  if (o && typeof o === 'object') { const u = {}; Object.keys(o).forEach(k => { u[fn(k)] = sleutelsOm(o[k], fn) }); return u }
  return o;
}

// ---- Supabase REST ----
// Een Supabase-sessie duurt ongeveer een uur. Wie de app langer open heeft staan
// (bijv. een hele werkdag) krijgt hier automatisch een nieuwe sleutel.
async function zorgVoorToken(){
  if (CONFIG.MODE !== 'supabase' || !AUTH_TOKEN || Date.now() < AUTH_VERLOOPT) return;
  const ok = await sbVernieuw();
  if (!ok) { toast('Je sessie is verlopen. Log opnieuw in.', 'error'); setTimeout(() => location.reload(), 1500); throw new Error('Sessie verlopen') }
}
async function sbREST(pad, opties){
  opties = opties || {};
  await zorgVoorToken();
  const h = Object.assign({ 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, opties.headers || {});
  h['Authorization'] = 'Bearer ' + (AUTH_TOKEN || CONFIG.SUPABASE_ANON_KEY);
  if (opties.prefer) h['Prefer'] = opties.prefer;
  const r = await fetch(CONFIG.SUPABASE_URL + pad, { method: opties.method || 'GET', headers: h, body: opties.body ? JSON.stringify(sleutelsOm(opties.body, naarSnake)) : undefined });
  const tekst = await r.text();
  let data = null;
  try { data = tekst ? JSON.parse(tekst) : null } catch (e) { data = null }
  if (!r.ok) throw new Error((data && (data.message || data.error_description || data.msg || data.hint)) || ('Fout ' + r.status));
  return opties.raw ? data : sleutelsOm(data, naarCamel);
}
async function sbLogin(gebruiker, wachtwoord){
  const r = await fetch(CONFIG.SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: naarEmail(gebruiker), password: wachtwoord })
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error_description || data.msg || data.error || 'Inloggen mislukt');
  AUTH_TOKEN = data.access_token; AUTH_REFRESH = data.refresh_token;
  AUTH_VERLOOPT = Date.now() + ((data.expires_in || 3600) * 1000) - 60000;
  localStorage.setItem('uren_auth', JSON.stringify({ r: AUTH_REFRESH, v: AUTH_VERLOOPT }));
  return data.user;
}
async function sbVernieuw(){
  const bewaard = JSON.parse(localStorage.getItem('uren_auth') || 'null');
  if (!bewaard || !bewaard.r) return false;
  const r = await fetch(CONFIG.SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST',
    headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: bewaard.r })
  });
  if (!r.ok) { localStorage.removeItem('uren_auth'); return false }
  const data = await r.json();
  AUTH_TOKEN = data.access_token; AUTH_REFRESH = data.refresh_token;
  AUTH_VERLOOPT = Date.now() + ((data.expires_in || 3600) * 1000) - 60000;
  localStorage.setItem('uren_auth', JSON.stringify({ r: AUTH_REFRESH, v: AUTH_VERLOOPT }));
  return true;
}
// Profiel (rol + koppeling aan een werknemer) ophalen bij de ingelogde gebruiker
async function sbProfiel(userId){
  const rijen = await sbREST('/rest/v1/profiles?id=eq.' + encodeURIComponent(userId) + '&select=*', { raw: true });

  localStorage.removeItem('uren_auth');
  AUTH_TOKEN = null; AUTH_REFRESH = null;
}

// ---- synchronisatielaag: synchrone cache bovenop Supabase ----
const CACHE_DB = {
  list(t){ return CACHE[t] || [] },
  get(t, id){ return this.list(t).find(r => r.id === id) },
  insert(t, o){ if (!o.id) o.id = uid(); (CACHE[t] = CACHE[t] || []).push(o); verstuur('insert', t, o); return o },
  update(t, id, o){ const a = CACHE[t] || []; const i = a.findIndex(x => x.id === id); if (i >= 0) a[i] = Object.assign({}, o, { id }); verstuur('update', t, id, o); return a[i] },
  remove(t, id){ CACHE[t] = (CACHE[t] || []).filter(x => x.id !== id); verstuur('remove', t, id); return CACHE[t] }
};
// ---- wachtrij: wijzigingen worden eerst bewaard op het toestel en daarna verstuurd ----
// Zo gaat er niets verloren als er geen bereik is; zodra er weer verbinding is
// worden ze in volgorde verstuurd.
const WACHTRIJ_KEY = 'wop_wachtrij';
const CACHE_KEY = 'wop_cache';
let wachtrijBezig = false, startteOffline = false;
function wachtrijLees(){ try { return JSON.parse(localStorage.getItem(WACHTRIJ_KEY) || '[]') } catch (e) { return [] } }
function wachtrijSchrijf(w){ try { localStorage.setItem(WACHTRIJ_KEY, JSON.stringify(w)) } catch (e) {} toonNetStatus() }
function cacheBewaar(){ if (CONFIG.MODE !== 'supabase' || !SESSIE) return; try { localStorage.setItem(CACHE_KEY, JSON.stringify({ gebruiker: SESSIE.id, t: Date.now(), data: CACHE })) } catch (e) {} }
function toonNetStatus(){
  const el = document.getElementById('netChip'); if (!el) return;
  const n = wachtrijLees().length, off = typeof navigator !== 'undefined' && navigator.onLine === false;
  if (off) { el.textContent = 'Geen bereik' + (n ? ' · ' + n + ' wacht op verzenden' : ''); el.className = 'text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-900'; }
  else if (n) { el.textContent = n + ' wacht op verzenden'; el.className = 'text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-900'; }
  else { el.textContent = ''; el.className = 'hidden'; }
}
async function voerUit(it){
  const { actie, tabel, a, b } = it;
  if (tabel === 'diensten' && (actie === 'insert' || actie === 'update')) {
    const obj = actie === 'insert' ? a : b, id = actie === 'insert' ? a.id : a;
    const { tarief, ...rest } = obj || {};
    if (actie === 'insert') await sbREST('/rest/v1/diensten', { method: 'POST', prefer: 'return=minimal', body: rest });
    else await sbREST('/rest/v1/diensten?id=eq.' + encodeURIComponent(id), { method: 'PATCH', prefer: 'return=minimal', body: rest });
    if (tarief !== undefined && tarief !== null && isBeheer()) {
      await sbREST('/rest/v1/diensten_tarief', { method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal', body: { dienstId: id, tarief: Number(tarief) || 0 } });
    }
    return;
  }
  if (actie === 'insert') await sbREST('/rest/v1/' + tabel, { method: 'POST', prefer: 'return=minimal', body: a });
  else if (actie === 'update') await sbREST('/rest/v1/' + tabel + '?id=eq.' + encodeURIComponent(a), { method: 'PATCH', prefer: 'return=minimal', body: b });
  else if (actie === 'remove') await sbREST('/rest/v1/' + tabel + '?id=eq.' + encodeURIComponent(a), { method: 'DELETE', prefer: 'return=minimal' });
}
async function verwerkWachtrij(){
  if (CONFIG.MODE !== 'supabase' || wachtrijBezig) return;
  wachtrijBezig = true;
  try {
    for (;;) {
      const w = wachtrijLees(); if (!w.length) break;
      if (!AUTH_TOKEN) { const ok = await sbVernieuw(); if (!ok) break; }
      try { await voerUit(w[0]) }
      catch (e) {
        const netwerk = e instanceof TypeError || (typeof navigator !== 'undefined' && navigator.onLine === false);
        if (netwerk) break;
        toast('Niet opgeslagen in de database: ' + e.message, 'error');   // bijv. geen rechten: niet blijven proberen
      }
      const rest = wachtrijLees(); rest.shift(); wachtrijSchrijf(rest);
    }
  } catch (e) { /* netwerkfout: later opnieuw */ }
  wachtrijBezig = false;
  toonNetStatus();
  if (!wachtrijLees().length && startteOffline && navigator.onLine !== false) {
    startteOffline = false;
    try { await laadAlles(); cacheBewaar(); renderCurrentView(); toast('Weer online: gegevens bijgewerkt', 'success') } catch (e) { startteOffline = true }
  }
}
function verstuur(actie, tabel, a, b){
  if (CONFIG.MODE !== 'supabase') return;
  const w = wachtrijLees(); w.push({ actie, tabel, a, b }); wachtrijSchrijf(w);
  cacheBewaar();
  verwerkWachtrij();
}
window.addEventListener('online', () => { toonNetStatus(); verwerkWachtrij() });
window.addEventListener('offline', toonNetStatus);
setInterval(() => { if (wachtrijLees().length) verwerkWachtrij() }, 30000);
async function laadAlles(){
  // Eerst versturen wat nog op het toestel wacht, anders overschrijft het laden die wijzigingen.
  if (!startteOffline) await verwerkWachtrij();
  // Supabase geeft standaard maximaal 1000 rijen per verzoek; daarom per pagina ophalen.
  for (const t of TABELLEN) {
    let alles = [], van = 0;
    for (;;) {
      const rijen = await sbREST('/rest/v1/' + t + '?select=*&order=id.asc&limit=1000&offset=' + van);
      if (!Array.isArray(rijen)) break;
      alles = alles.concat(rijen);
      if (rijen.length < 1000) break;
      van += 1000;
    }
    CACHE[t] = alles;
  }
  // Materieel (kentekens): mag ontbreken zolang de tabel nog niet is aangemaakt.
  try {
    const m = await sbREST('/rest/v1/materieel?select=*&order=kenteken.asc&limit=1000');
    CACHE.materieel = Array.isArray(m) ? m : [];
  } catch (e) { CACHE.materieel = CACHE.materieel || [] }
  // Orders (verzamelorders): alleen beheer; mag ontbreken zolang de tabel nog niet is aangemaakt.
  if (isBeheer()) {
    try {
      const o = await sbREST('/rest/v1/orders?select=*&order=ordernr.asc&limit=1000');
      CACHE.orders = Array.isArray(o) ? o : [];
    } catch (e) { CACHE.orders = CACHE.orders || [] }
  }
  // Planning-archief en vervaldata: alleen beheer; mogen ontbreken zolang de tabellen niet zijn aangemaakt.
  if (isBeheer()) {
    for (const t of ['planningen', 'vervaldata', 'klus_notities']) {
      try {
        const o = await sbREST('/rest/v1/' + t + '?select=*&limit=1000');
        CACHE[t] = Array.isArray(o) ? o : [];
      } catch (e) { CACHE[t] = CACHE[t] || [] }
    }
  }
  // Tarieven staan in een aparte tabel die alleen de beheerder mag lezen.
  if (isBeheer()) {
    try {
      const tr = await sbREST('/rest/v1/diensten_tarief?select=*&limit=1000');
      const m = {}; (tr || []).forEach(x => m[x.dienstId] = Number(x.tarief));
      (CACHE.diensten || []).forEach(d => { d.tarief = d.id in m ? m[d.id] : 35 });
    } catch (e) { (CACHE.diensten || []).forEach(d => { if (d.tarief == null) d.tarief = 35 }) }
  }
  cacheBewaar();
}

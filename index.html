async function inloggen(gebruiker, wachtwoord){
  if (!gebruiker || !wachtwoord) throw new Error('Vul je gebruikersnaam en wachtwoord in');
  if (CONFIG.MODE === 'local') {
    const acc = accounts().find(a => a.gebruikersnaam.toLowerCase() === String(gebruiker).trim().toLowerCase());
    if (!acc || acc.wachtwoordHash !== hashWachtwoord(wachtwoord)) throw new Error('Onbekende gebruikersnaam of verkeerd wachtwoord');
    if (acc.actief === false) throw new Error('Dit account is gedeactiveerd');
    SESSIE = { id: acc.id, naam: acc.naam, rol: acc.rol, werknemer_id: acc.werknemer_id || '', gebruikersnaam: acc.gebruikersnaam };
  } else {
    const user = await sbLogin(gebruiker, wachtwoord);
    const profiel = await sbProfiel(user.id);
    if (!profiel) throw new Error('Dit account heeft nog geen profiel. Vraag de beheerder om toegang.');
    if (profiel.actief === false) throw new Error('Dit account is gedeactiveerd');
    const gn = String(gebruiker).trim().toLowerCase();
    SESSIE = { id: user.id, naam: profiel.naam || gn, rol: profiel.rol || 'medewerker', werknemer_id: profiel.werknemer_id || '', gebruikersnaam: gn };
    toast('Gegevens laden…', 'info');
    await laadAlles();
  }
  localStorage.setItem('uren_sessie', JSON.stringify(SESSIE));
  verbergLogin();
  startApp();
}
async function uitloggen(){
  if (CONFIG.MODE === 'supabase') await sbUitloggen();
  SESSIE = null;
  localStorage.removeItem('uren_sessie');
  localStorage.removeItem('uren_concept');
  location.reload();
}

// ---- bestaande sessie hervatten (supabase) ----
async function hervatSessie(){
  const bewaard=JSON.parse(localStorage.getItem('uren_auth')||'null');
  if(!bewaard||!bewaard.r){ toonLogin(); return }
  try{
    if(!AUTH_TOKEN){ const ok=await sbVernieuw(); if(!ok){ toonLogin(); return } }
    const u=await sbREST('/auth/v1/user');
    if(!u||!u.id){ toonLogin(); return }
    const profiel=await sbProfiel(u.id);
    if(!profiel||profiel.actief===false){ toonLogin(); return }
    SESSIE={id:u.id,naam:profiel.naam||u.email,rol:profiel.rol||'medewerker',werknemer_id:profiel.werknemer_id||'',gebruikersnaam:u.email};
    await laadAlles();
    verbergLogin();
    startApp();
  }catch(e){
    // Geen verbinding: werk met de laatst opgeslagen gegevens op dit toestel.
    const netwerk = e instanceof TypeError || navigator.onLine === false;
    let snap = null, sess = null;
    try { snap = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); sess = JSON.parse(localStorage.getItem('uren_sessie') || 'null') } catch (x) {}
    if (netwerk && snap && sess && snap.gebruiker === sess.id && snap.data) {
      SESSIE = sess; Object.keys(snap.data).forEach(t => { CACHE[t] = snap.data[t] });
      startteOffline = true;
      verbergLogin(); startApp();
      toast('Geen bereik: je werkt met de laatst opgehaalde gegevens. Wat je invult wordt verstuurd zodra er weer bereik is.', 'info');
      toonNetStatus();
    } else toonLogin();
  }
}

async function apiAccounts(payload){
  await zorgVoorToken();
  const r = await fetch('/api/admin-users', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN },
    body: JSON.stringify(payload)
  });
  let d = null;
  try { d = await r.json() } catch (e) { d = null }
  if (!r.ok) throw new Error((d && (d.fout || d.message)) || 'Actie mislukt (' + r.status + ')');
  return d;
}
function renderAccounts(){
  if (!isBeheer()) { $('main').innerHTML = '<p class="p-6 text-center text-gray-500">Alleen voor beheerders.</p>'; return }
  const werknemers = DB.list('werknemers');
  $('main').innerHTML = `<div class="max-w-4xl mx-auto">
  <h2 class="text-xl font-bold mb-1 text-gray-800 dark:text-gray-100">Accounts</h2>
  <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Maak per medewerker een account met een gebruikersnaam en wachtwoord. Een medewerker ziet dan alleen zijn eigen uren.</p>
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-4 border border-gray-100 dark:border-gray-700 mb-4">
    <h3 class="font-semibold mb-3">Nieuw account</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div><label class="block text-xs text-gray-500 mb-1" for="naGebruiker">Gebruikersnaam</label><input id="naGebruiker" autocapitalize="none" class="${SEL_S} w-full bg-white dark:bg-gray-700" placeholder="bijv. jan"></div>
      <div><label class="block text-xs text-gray-500 mb-1" for="naNaam">Naam</label><input id="naNaam" class="${SEL_S} w-full bg-white dark:bg-gray-700" placeholder="Jan de Boer"></div>
      <div><label class="block text-xs text-gray-500 mb-1" for="naWachtwoord">Wachtwoord</label><input id="naWachtwoord" type="text" class="${SEL_S} w-full bg-white dark:bg-gray-700" placeholder="min. 6 tekens"></div>
      <div><label class="block text-xs text-gray-500 mb-1" for="naRol">Rol</label><select id="naRol" class="${SEL_S} w-full bg-white dark:bg-gray-700"><option value="medewerker">Medewerker</option><option value="beheer">Beheerder</option></select></div>
      <div class="md:col-span-2"><label class="block text-xs text-gray-500 mb-1" for="naWerknemer">Koppelen aan werknemer (voor medewerkers)</label>
        <select id="naWerknemer" class="${SEL_S} w-full bg-white dark:bg-gray-700"><option value="">— geen —</option>${werknemers.map(w => `<option value="${w.id}">${esc(w.naam)}</option>`).join('')}</select></div>
    </div>
    <button id="naKnop" class="mt-3 w-full md:w-auto px-4 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 min-h-[48px] font-medium">Account aanmaken</button>
  </div>
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow overflow-hidden border border-gray-100 dark:border-gray-700">
    <div class="scroll-x"><table class="w-full text-sm min-w-[640px]">
      <thead class="bg-gray-50 dark:bg-gray-700"><tr><th class="px-3 py-2 text-left">Gebruikersnaam</th><th class="px-3 py-2 text-left">Naam</th><th class="px-3 py-2 text-left">Rol</th><th class="px-3 py-2 text-left">Werknemer</th><th class="px-3 py-2">Actief</th><th class="px-3 py-2">Acties</th></tr></thead>
      <tbody id="accLijst"><tr><td colspan="6" class="px-3 py-6 text-center text-gray-400">Laden…</td></tr></tbody>
    </table></div>
  </div></div>`;
  $('naKnop').onclick = async () => {
    const gebruiker = $('naGebruiker').value.trim();
    const naam = $('naNaam').value.trim();
    const wachtwoord = $('naWachtwoord').value;
    const rol = $('naRol').value;
    const werknemer_id = $('naWerknemer').value;
    if (!gebruiker || !naam || !wachtwoord) { toast('Vul gebruikersnaam, naam en wachtwoord in', 'error'); return }
    if (wachtwoord.length < 6) { toast('Kies een wachtwoord van minstens 6 tekens', 'error'); return }
    if (rol === 'medewerker' && !werknemer_id) { toast('Kies aan welke werknemer dit account gekoppeld is', 'error'); return }
    const knop = $('naKnop'); knop.disabled = true; knop.textContent = 'Bezig…';
    try {
      await accountAanmaken({ gebruikersnaam: gebruiker, naam, wachtwoord, rol, werknemer_id });
      toast('Account voor ' + naam + ' aangemaakt', 'success');
      renderAccounts();
    } catch (e) {
      toast(e.message, 'error');
      knop.disabled = false; knop.textContent = 'Account aanmaken';
    }
  };
  vulAccountLijst();
}
async function accountAanmaken(d){
  if (CONFIG.MODE === 'local') {
    const a = accounts();
    if (a.some(x => x.gebruikersnaam.toLowerCase() === d.gebruikersnaam.toLowerCase())) throw new Error('Die gebruikersnaam bestaat al');
    a.push({ id: uid(), gebruikersnaam: d.gebruikersnaam, naam: d.naam, rol: d.rol, werknemer_id: d.werknemer_id, actief: true, wachtwoordHash: hashWachtwoord(d.wachtwoord) });
    bewaarAccounts(a);
  } else {
    await apiAccounts(Object.assign({ actie: 'create' }, d));
  }
}
async function vulAccountLijst(){
  const body = $('accLijst'); if (!body) return;
  let rijen = [];
  try {
    if (CONFIG.MODE === 'local') {
      rijen = accounts().map(a => ({ id: a.id, gebruikersnaam: a.gebruikersnaam, naam: a.naam, rol: a.rol, werknemer_id: a.werknemer_id, actief: a.actief !== false }));
    } else {
      const d = await apiAccounts({ actie: 'list' });
      rijen = (d && d.accounts) || [];
    }
  } catch (e) {
    body.innerHTML = `<tr><td colspan="6" class="px-3 py-6 text-center text-red-600 dark:text-red-400">Kon accounts niet laden: ${esc(e.message)}</td></tr>`;
    return;
  }
  if (!rijen.length) { body.innerHTML = '<tr><td colspan="6" class="px-3 py-6 text-center text-gray-400">Nog geen accounts</td></tr>'; return }
  const wMap = {}; DB.list('werknemers').forEach(w => wMap[w.id] = w.naam);
  body.innerHTML = rijen.map(a => `<tr class="border-t border-gray-100 dark:border-gray-700">
    <td class="px-3 py-2 font-medium">${esc(a.gebruikersnaam)}</td>
    <td class="px-3 py-2">${esc(a.naam)}</td>
    <td class="px-3 py-2">${a.rol === 'beheer' ? '<span class="badge bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200">Beheerder</span>' : 'Medewerker'}</td>
    <td class="px-3 py-2">${a.werknemer_id && wMap[a.werknemer_id] ? esc(wMap[a.werknemer_id]) : '—'}</td>
    <td class="px-3 py-2 text-center">${a.actief !== false ? '<span class="text-emerald-700 dark:text-emerald-400 font-medium">Ja</span>' : '<span class="text-gray-400">Nee</span>'}</td>
    <td class="px-3 py-2 whitespace-nowrap">
      <button data-acc-reset="${a.id}" class="text-xs underline text-blue-600 dark:text-blue-400 min-h-[48px]">nieuw wachtwoord</button>
      <button data-acc-toggle="${a.id}" data-actief="${a.actief !== false ? '1' : '0'}" class="text-xs underline text-gray-600 dark:text-gray-300 min-h-[48px] ml-2">${a.actief !== false ? 'deactiveren' : 'activeren'}</button>
    </td></tr>`).join('');
  body.querySelectorAll('[data-acc-reset]').forEach(b => b.onclick = async () => {
    const nieuw = prompt('Nieuw wachtwoord (min. 6 tekens):');
    if (!nieuw) return;
    if (nieuw.length < 6) { toast('Minstens 6 tekens', 'error'); return }
    try {
      if (CONFIG.MODE === 'local') {
        const a = accounts(); const i = a.findIndex(x => x.id === b.dataset.accReset);
        if (i >= 0) { a[i].wachtwoordHash = hashWachtwoord(nieuw); bewaarAccounts(a) }
      } else { await apiAccounts({ actie: 'reset', id: b.dataset.accReset, wachtwoord: nieuw }) }
      toast('Nieuw wachtwoord ingesteld', 'success');
    } catch (e) { toast(e.message, 'error') }
  });
  body.querySelectorAll('[data-acc-toggle]').forEach(b => b.onclick = async () => {
    const actief = b.dataset.actief !== '1';
    try {
      if (CONFIG.MODE === 'local') {
        const a = accounts(); const i = a.findIndex(x => x.id === b.dataset.accToggle);
        if (i >= 0) { a[i].actief = actief; bewaarAccounts(a) }
      } else { await apiAccounts({ actie: 'toggle', id: b.dataset.accToggle, actief }) }
      toast(actief ? 'Account geactiveerd' : 'Account gedeactiveerd', 'success');
      renderAccounts();
    } catch (e) { toast(e.message, 'error') }
  });
}

// === NAVIGATION ===
let currentView='invoer', currentBeheerTab='dashboard', currentMode='medewerker';
function renderCurrentView(){
  const main=$('main');
  // Oude handlers van het invoerformulier opruimen: anders reageren ze ook op
  // andere schermen (en crashen ze op velden die daar niet bestaan).
  main.oninput=null;main.onchange=null;main.onclick=null;
  main.classList.toggle('max-w-4xl',currentMode==='medewerker');main.classList.toggle('max-w-[1800px]',currentMode!=='medewerker');
  if(currentMode==='medewerker'){
    if(currentView==='invoer')renderInvoer();
    else if(currentView==='mijnuren')renderMijnUren();
  } else {
    switch(currentBeheerTab){
      case 'dashboard':renderDashboard();break;
      case 'klussen':renderKlussenBeheer();break;
      case 'orders':renderOrders();break;
      case 'klanten':renderKlanten();break;
      case 'diensten':renderDiensten();break;
      case 'materieel':renderMaterieel();break;
      case 'werknemers':renderWerknemers();break;
      case 'planning':renderPlanning();break;
      case 'planarchief':renderPlanArchief();break;
      case 'keuringen':renderKeuringen();break;
      case 'uren':renderUrenOverzicht();break;
      case 'export':renderExports();break;
      case 'accounts':renderAccounts();break;
      default:renderDashboard();
    }
  }
  naRender();
}
function renderBottomNav(){
  $('bottomNav').style.display=currentMode==='medewerker'?'flex':'none';
  $('beheerNav').style.display=currentMode==='beheer'?'flex':'none';
}
// Na elke render de rolregels toepassen (medewerker = alleen eigen uren)
function naRender(){ try{pasRolToe()}catch(e){} }
// Terugknop van de browser: elke pagina (tabblad) krijgt een eigen plek in de browsergeschiedenis.
const BEHEER_TABS=['dashboard','klussen','orders','klanten','diensten','materieel','keuringen','werknemers','planning','planarchief','uren','export','accounts'];
const BEHEER_ALLEEN=['accounts','orders','planarchief','keuringen'];
function navStaat(){return {m:currentMode,v:currentView,t:currentBeheerTab}}
function navPush(vervang){
  try{
    const st=navStaat(),h='#/'+(st.m==='beheer'?'beheer/'+st.t:'medewerker/'+st.v),o=history.state;
    if(vervang||!o){history.replaceState(st,'',h);return}
    if(o.m===st.m&&o.v===st.v&&o.t===st.t)return;
    history.pushState(st,'',h);
  }catch(e){}
}
function zetTabMarkering(){document.querySelectorAll('.tab-btn').forEach(b=>{const a=b.dataset.tab===currentBeheerTab;b.classList.toggle('border-emerald-600',a);b.classList.toggle('text-emerald-700',a);b.classList.toggle('border-transparent',!a)})}
window.addEventListener('popstate',e=>{
  const st=e.state;if(!st||!SESSIE)return;
  if(st.m==='beheer'&&(!isBeheer()||(BEHEER_ALLEEN.includes(st.t)&&!isBeheer())))return;
  currentMode=st.m==='beheer'?'beheer':'medewerker';currentView=st.v||'invoer';currentBeheerTab=st.t||'dashboard';
  const mt=$('modeToggle');if(mt)mt.value=currentMode;
  renderBottomNav();renderCurrentView();zetNav(currentView);zetTabMarkering();
});
function switchView(view){currentView=view;navPush();renderCurrentView()}
function switchTab(tab){
  if((tab==='accounts'||tab==='orders'||tab==='planarchief'||tab==='keuringen')&&!isBeheer()){toast('Alleen voor beheerders','error');return}
  // Een beheertabblad aanklikken betekent ook echt naar de beheermodus.
  currentMode='beheer';
  const mt=$('modeToggle');if(mt)mt.value='beheer';
  currentBeheerTab=tab;
  navPush();
  renderBottomNav();
  renderCurrentView();
  zetTabMarkering();
}

// === PWA ===
function initPWA(){
  try{
    const manifest={name:'Wempe op Pad',short_name:'Wempe op Pad',start_url:'.',display:'standalone',theme_color:'#000000',background_color:'#ffffff',icons:[{src:location.origin+'/icon-192.png',sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:location.origin+'/icon-512.png',sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
    const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(blob);document.head.appendChild(link);
    // Service worker
    const swCode=`const CACHE='uren-v1';self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.add('/')))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`;
    const swBlob=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker?.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }catch(e){console.log('PWA registration skipped:',e.message)}
}

// === INIT ===
function bindChrome(){
  $('modeToggle').onchange=e=>{currentMode=e.target.value;navPush();renderBottomNav();renderCurrentView();zetTabMarkering()};
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{switchView(b.dataset.view);document.querySelectorAll('[data-view]').forEach(x=>{x.classList.toggle('text-emerald-700',x.dataset.view===currentView);x.classList.toggle('text-gray-500',x.dataset.view!==currentView)})});
  document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  const uit=$('logoutBtn');
  if(uit)uit.onclick=()=>{ if(confirm('Weet je zeker dat je wilt uitloggen?')) uitloggen() };
}
function startApp(){
  // Beheerder begint in het dashboard, medewerker in de invoer.
  currentMode=isBeheer()?'beheer':'medewerker';
  // Na een verversing terug naar de pagina waar je was (staat in het adres, bijv. #/beheer/klussen).
  const mh=/^#\/(beheer|medewerker)\/([\w-]+)/.exec(location.hash||'');
  if(mh){
    if(mh[1]==='beheer'&&isBeheer()&&BEHEER_TABS.includes(mh[2])){currentMode='beheer';currentBeheerTab=mh[2]}
    else if(mh[1]==='medewerker'&&['invoer','mijnuren'].includes(mh[2])){currentMode='medewerker';currentView=mh[2]}
  }
  const mt=$('modeToggle');if(mt)mt.value=currentMode;
  renderBottomNav();
  naRender();
  renderCurrentView();
  zetNav(currentView);zetTabMarkering();
  navPush(true);
}
function toonSetupNodig(){
  const s=$('loginScreen');s.classList.remove('hidden');s.style.display='block';
  s.innerHTML='<div class="min-h-screen flex items-center justify-center px-4"><div class="max-w-sm text-center"><h1 class="text-xl font-bold mb-2">Wempe op Pad is nog niet gekoppeld</h1><p class="text-sm text-gray-600 dark:text-gray-300">De koppeling met de database is nog niet ingesteld. Neem contact op met de beheerder.</p></div></div>';
}
function init(){
  if(CONFIG.MODE==='local'&&!['localhost','127.0.0.1',''].includes(location.hostname)){ toonSetupNodig(); return }
  if(CONFIG.MODE==='local'){
    seedData();migrateKlanten();migrateDagstaten();migrateFacturatie();migrateIds();seedAccounts();
  }
  initDarkMode();
  bindChrome();
  initPWA();
  if(CONFIG.MODE==='supabase'){
    hervatSessie();
  } else {
    const bewaard=localStorage.getItem('uren_sessie');
    if(bewaard){ try{SESSIE=JSON.parse(bewaard)}catch(e){SESSIE=null} }
    if(SESSIE){ verbergLogin(); startApp() } else { toonLogin() }
  }
}
init();
